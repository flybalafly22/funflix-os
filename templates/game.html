<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FLYUSERFLY — FUNFLIX://OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/os.css">
  <style>
    html, body { height: 100vh; overflow: hidden; }

    #gameWrap {
      position: relative;
      flex: 1; min-height: 0;
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
    }
    #gameCanvas { position: absolute; inset: 0; display: block; }

    .g-panel {
      position: absolute;
      background: rgba(4,5,11,0.82);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      font-family: var(--mono);
      pointer-events: none;
    }

    #hudCase { top: 18px; left: 18px; width: 300px; padding: 14px 16px 13px; }
    #hudCaseTitle { font-size: 10px; letter-spacing: 0.24em; color: var(--red); margin-bottom: 8px; }
    #hudObjective { font-size: 11.5px; letter-spacing: 0.06em; color: var(--ink); line-height: 1.7; margin-bottom: 8px; }
    #hudProgress { font-size: 10px; letter-spacing: 0.18em; color: var(--ink-dim); }
    #hudDist { font-size: 10px; letter-spacing: 0.18em; color: var(--ink-faint); margin-top: 4px; }

    #hudKeys { bottom: 14px; left: 18px; padding: 8px 14px; font-size: 9px; letter-spacing: 0.16em; color: var(--ink-faint); }

    #hudHint {
      bottom: 64px; left: 50%; transform: translateX(-50%);
      padding: 10px 22px; border-color: var(--red-dim);
      font-size: 11px; letter-spacing: 0.2em; color: var(--ink);
      display: none;
    }
    #hudHint .k { color: var(--red); }

    #hudWarn {
      top: 18px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-color: var(--red);
      background: rgba(255,30,45,0.12);
      font-size: 11px; letter-spacing: 0.2em; color: #ff8b93;
      display: none;
      animation: warnBlink 0.8s steps(1) infinite;
    }
    @keyframes warnBlink { 50% { border-color: var(--red-dim); } }

    #speedo {
      bottom: 14px; right: 196px;
      padding: 8px 16px;
      font-size: 16px; letter-spacing: 0.1em; color: var(--ink);
      display: none;
    }
    #speedo .u { font-size: 9px; color: var(--ink-faint); letter-spacing: 0.2em; }

    #minimapBox {
      position: absolute; bottom: 14px; right: 18px;
      width: 160px; height: 160px;
      border-radius: 50%;
      border: 1px solid var(--line-bright);
      overflow: hidden;
      background: #07080f;
      display: none;
      pointer-events: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    #minimap { width: 100%; height: 100%; }

    #toastBox {
      position: absolute; right: 18px; top: 18px;
      width: 300px;
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: rgba(4,5,11,0.88);
      border: 1px solid var(--line-bright);
      border-left: 2px solid var(--red);
      padding: 11px 14px;
      font-family: var(--mono); font-size: 10.5px;
      letter-spacing: 0.08em; color: var(--ink);
      line-height: 1.7;
      opacity: 1; transition: opacity 0.6s;
    }
    .toast .tt { color: var(--red); letter-spacing: 0.18em; }
    .toast.bye { opacity: 0; }

    #dlg {
      position: absolute;
      bottom: 24px; left: 50%; transform: translateX(-50%);
      width: min(640px, calc(100% - 40px));
      background: rgba(4,5,11,0.94);
      border: 1px solid var(--line-bright);
      padding: 18px 22px;
      font-family: var(--mono);
      display: none;
    }
    #dlgSpeaker { font-size: 10px; letter-spacing: 0.26em; color: var(--red); margin-bottom: 10px; }
    #dlgText { font-size: 13px; line-height: 1.9; color: var(--ink); letter-spacing: 0.02em; margin-bottom: 14px; }
    .dlg-opt {
      padding: 8px 10px;
      font-size: 11px; letter-spacing: 0.12em; color: var(--ink-dim);
      border: 1px solid transparent; cursor: pointer; transition: all 0.12s;
    }
    .dlg-opt:hover { color: var(--ink); border-color: var(--line); background: rgba(255,255,255,0.03); }
    .dlg-opt .n { color: var(--red); margin-right: 10px; }

    #caseFile {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: min(380px, 90%);
      background: rgba(4,5,11,0.96);
      border-left: 1px solid var(--line-bright);
      padding: 24px;
      font-family: var(--mono);
      display: none; overflow-y: auto;
    }
    #caseFile h3 { font-size: 11px; letter-spacing: 0.3em; color: var(--red); font-weight: 400; margin-bottom: 18px; }
    .cf-item { border-bottom: 1px solid var(--line); padding: 12px 2px; }
    .cf-t { font-size: 11px; letter-spacing: 0.14em; color: var(--ink); margin-bottom: 5px; }
    .cf-d { font-size: 10px; letter-spacing: 0.06em; color: var(--ink-dim); line-height: 1.8; }
    .cf-empty { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.12em; line-height: 2; }

    #bigOv {
      position: absolute; inset: 0; z-index: 150;
      background: rgba(3,3,8,0.9);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .ov-box {
      width: min(620px, 100%);
      border: 1px solid var(--line-bright);
      background: rgba(5,6,13,0.97);
      padding: 40px 44px;
      position: relative;
    }
    .ov-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.4em; color: var(--red); margin-bottom: 14px; }
    .ov-title { font-family: var(--disp); font-size: clamp(28px, 5vw, 44px); font-weight: 800; color: var(--ink); margin-bottom: 6px; letter-spacing: 0.02em; }
    .ov-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.3em; color: var(--ink-faint); margin-bottom: 24px; }
    .ov-body { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--ink-dim); line-height: 2.1; margin-bottom: 28px; }
    .ov-body .hl { color: var(--ink); }
    .ov-body .rd { color: var(--red); }
    .ov-btns { display: flex; gap: 12px; flex-wrap: wrap; }
    .ov-btn {
      background: var(--red); border: none; color: #fff;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: 0.24em; padding: 14px 30px;
      cursor: pointer; transition: all 0.18s;
    }
    .ov-btn:hover { box-shadow: 0 0 32px var(--red-glow), 0 0 80px var(--red-glow); }
    .ov-btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-dim); }
    .ov-btn.ghost:hover { border-color: var(--line-bright); color: var(--ink); box-shadow: none; }
  </style>
</head>
<body data-nofx>

<div class="page-wrap">
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div class="g-panel" id="hudCase" style="display:none">
      <div id="hudCaseTitle"></div>
      <div id="hudObjective"></div>
      <div id="hudProgress"></div>
      <div id="hudDist"></div>
    </div>

    <div class="g-panel" id="hudKeys" style="display:none">WASD MOVE &middot; SHIFT RUN &middot; F VEHICLE &middot; E INTERACT &middot; TAB CASE FILE &middot; ESC PAUSE</div>

    <div class="g-panel" id="hudHint"><span class="k" id="hudHintKey">[E]</span> <span id="hudHintText">EXAMINE</span></div>
    <div class="g-panel" id="hudWarn"></div>
    <div class="g-panel" id="speedo"><span id="speedoVal">0</span> <span class="u">KM/H</span></div>
    <div id="minimapBox"><canvas id="minimap" width="160" height="160"></canvas></div>
    <div id="toastBox"></div>

    <div id="dlg">
      <div id="dlgSpeaker"></div>
      <div id="dlgText"></div>
      <div id="dlgOpts"></div>
    </div>

    <div id="caseFile">
      <h3>CASE FILE // EVIDENCE</h3>
      <div id="cfList"></div>
    </div>

    <div id="bigOv"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="/static/os.js"></script>
<script>
(() => {
  'use strict';
  const wrap   = document.getElementById('gameWrap');
  const canvas = document.getElementById('gameCanvas');

  /* ════════ RENDERER / SCENE ════════ */
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    wrap.innerHTML = '<div class="g-panel" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:24px 30px;font-size:12px;letter-spacing:0.1em;color:var(--ink-dim)">WEBGL UNAVAILABLE — THIS TERMINAL CANNOT RUN FLYUSERFLY.</div>';
    return;
  }
  const BLOOM_OK = !!(THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass && THREE.ShaderPass && THREE.GammaCorrectionShader);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, BLOOM_OK ? 1.25 : 1.5));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x04050b);
  scene.fog = new THREE.FogExp2(0x04050b, 0.0085);

  const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 600);

  /* bloom pipeline (falls back to plain render if CDN scripts failed) */
  let composer = null, bloomPass = null;
  if (BLOOM_OK) {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(800, 600), 0.85, 0.55, 0.6);
    composer.addPass(bloomPass);
    composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  }

  function resize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    if (composer) composer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(resize);

  /* ════════ LIGHTS ════════ */
  const hemi = new THREE.HemisphereLight(0x35426e, 0x0a0a12, 0.85);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0x8fa3cc, 0.22);
  dir.position.set(60, 100, 30);
  scene.add(dir);

  /* ════════ HELPERS ════════ */
  const dist2D = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
  function lerpAngle(a, b, t) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  }

  function makeWindowTex() {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#0c0e16'; g.fillRect(0, 0, 128, 256);
    const pal = ['#ffd9a0', '#9fc4ff', '#ff8d96', '#fff4d6', '#7fe8d0'];
    for (let y = 6; y < 246; y += 12) {
      for (let x = 6; x < 118; x += 10) {
        if (Math.random() < 0.3) {
          g.fillStyle = pal[(Math.random() * pal.length) | 0];
          g.globalAlpha = 0.45 + Math.random() * 0.55;
        } else {
          g.fillStyle = '#141826';
          g.globalAlpha = 1;
        }
        g.fillRect(x, y, 6, 8);
      }
    }
    g.globalAlpha = 1;
    const t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter;
    return t;
  }

  function makeGlowTex() {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,0.9)');
    gr.addColorStop(0.35, 'rgba(255,255,255,0.28)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = makeGlowTex();
  function makeGlow(color, scale) {
    const m = new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    const s = new THREE.Sprite(m);
    s.scale.set(scale, scale, 1);
    return s;
  }

  function textSprite(text, color) {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 64;
    const g = c.getContext('2d');
    g.font = '700 28px "JetBrains Mono", monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = color; g.shadowColor = color; g.shadowBlur = 14;
    g.fillText(text, 128, 34);
    const t = new THREE.CanvasTexture(c);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
    s.scale.set(5.6, 1.4, 1);
    return s;
  }

  function makeBlob(r) {
    const b = new THREE.Mesh(new THREE.CircleGeometry(r, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4, depthWrite: false }));
    b.rotation.x = -Math.PI / 2;
    b.position.y = 0.03;
    return b;
  }

  /* ════════ SKY ════════ */
  {
    const starN = 700;
    const sp = new Float32Array(starN * 3);
    for (let i = 0; i < starN; i++) {
      const a = Math.random() * Math.PI * 2, e = Math.random() * Math.PI * 0.48;
      sp[i * 3]     = Math.cos(a) * Math.cos(e) * 420;
      sp[i * 3 + 1] = Math.sin(e) * 420 + 10;
      sp[i * 3 + 2] = Math.sin(a) * Math.cos(e) * 420;
    }
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    const stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xaab6d8, size: 1.4, sizeAttenuation: false, transparent: true, opacity: 0.65 }));
    stars.material.fog = false;
    scene.add(stars);
    const moonGlow = makeGlow(0xcfd8ee, 90);
    moonGlow.material.fog = false;
    moonGlow.position.set(180, 200, -260);
    scene.add(moonGlow);
    const moonCore = makeGlow(0xeef2ff, 34);
    moonCore.material.fog = false;
    moonCore.position.set(180, 200, -260);
    scene.add(moonCore);
  }

  /* ════════ CITY ════════ */
  const BLOCK = 28;            // grid pitch — roads ~15u wide
  const BOUND = 120;
  const colliders = [];
  const buildingFootprints = [];   // for the minimap
  const cityStatic = new THREE.Group();   // everything mirrored for wet-street reflections

  const roofMat = new THREE.MeshStandardMaterial({ color: 0x0a0c14, roughness: 0.95 });
  const sideMats = [];
  for (let v = 0; v < 5; v++) {
    const t = makeWindowTex();
    sideMats.push(new THREE.MeshStandardMaterial({ map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.55, roughness: 0.9 }));
  }
  const neonColors = [0xff1e2d, 0x2dd4a0, 0x4d9fff, 0xf5b84d, 0xc44dff];
  const tallBuildings = [];

  for (let i = -4; i <= 4; i++) {
    for (let j = -4; j <= 4; j++) {
      if (i === 0 && j === 0) continue;
      const bx = i * BLOCK, bz = j * BLOCK;
      const w = 9 + Math.random() * 4;
      const d = 9 + Math.random() * 4;
      const h = 10 + Math.random() * 34;
      const sm = sideMats[(Math.random() * sideMats.length) | 0];
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [sm, sm, roofMat, roofMat, sm, sm]);
      mesh.position.set(bx, h / 2, bz);
      cityStatic.add(mesh);
      colliders.push({ x1: bx - w / 2 - 0.6, x2: bx + w / 2 + 0.6, z1: bz - d / 2 - 0.6, z2: bz + d / 2 + 0.6 });
      buildingFootprints.push({ x: bx, z: bz, w, d });

      if (h > 28) { // tower: stepped upper section + antenna
        const w2 = w * 0.62, d2 = d * 0.62, h2 = h * 0.4;
        const sm2 = sideMats[(Math.random() * sideMats.length) | 0];
        const up = new THREE.Mesh(new THREE.BoxGeometry(w2, h2, d2), [sm2, sm2, roofMat, roofMat, sm2, sm2]);
        up.position.set(bx, h + h2 / 2, bz);
        cityStatic.add(up);
        const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 6, 6), new THREE.MeshBasicMaterial({ color: 0x222838 }));
        ant.position.set(bx, h + h2 + 3, bz);
        cityStatic.add(ant);
        const blinkLight = makeGlow(0xff1e2d, 2.4);
        blinkLight.position.set(bx, h + h2 + 6, bz);
        cityStatic.add(blinkLight);
        tallBuildings.push({ x: bx, z: bz, h: h + h2, w: Math.max(w, d), blink: blinkLight });
      }

      if (Math.random() < 0.6) { // neon bars
        const bh = 2.5 + Math.random() * 6;
        const bar = new THREE.Mesh(
          new THREE.BoxGeometry(0.25, bh, 0.25),
          new THREE.MeshBasicMaterial({ color: neonColors[(Math.random() * neonColors.length) | 0] })
        );
        const side = Math.random() < 0.5 ? 1 : -1;
        if (Math.random() < 0.5) bar.position.set(bx + side * (w / 2 + 0.2), 2.5 + Math.random() * (h * 0.4), bz + (Math.random() - 0.5) * d * 0.6);
        else bar.position.set(bx + (Math.random() - 0.5) * w * 0.6, 2.5 + Math.random() * (h * 0.4), bz + side * (d / 2 + 0.2));
        cityStatic.add(bar);
      }
    }
  }

  /* animated billboards on the 4 tallest towers */
  const billboards = [];
  tallBuildings.sort((a, b) => b.h - a.h).slice(0, 4).forEach((tb, n) => {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const tex = new THREE.CanvasTexture(c);
    const bb = new THREE.Mesh(
      new THREE.PlaneGeometry(11, 5.5),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide })
    );
    const facing = n % 2 === 0 ? 1 : -1;
    bb.position.set(tb.x + (n % 2 ? tb.w / 2 + 0.3 : 0), tb.h * 0.62, tb.z + (n % 2 ? 0 : tb.w / 2 + 0.3));
    if (n % 2) bb.rotation.y = facing * Math.PI / 2;
    cityStatic.add(bb);
    billboards.push({ canvas: c, ctx: c.getContext('2d'), tex, hue: n * 90, scroll: 0,
      msg: ['FUNFLIX', 'WATCH EVERYTHING', 'THE GRID NEVER SLEEPS', 'FLY USER FLY'][n] });
  });

  /* plaza pylon */
  const pylonMat = new THREE.MeshStandardMaterial({ color: 0x0a0a12, emissive: 0xff1e2d, emissiveIntensity: 0.9, roughness: 0.6 });
  const pylon = new THREE.Mesh(new THREE.BoxGeometry(1.2, 8, 1.2), pylonMat);
  pylon.position.set(0, 4, 0);
  cityStatic.add(pylon);
  const pylonGlow = makeGlow(0xff1e2d, 8);
  pylonGlow.position.set(0, 8, 0);
  cityStatic.add(pylonGlow);
  colliders.push({ x1: -1.4, x2: 1.4, z1: -1.4, z2: 1.4 });

  /* maintenance shaft 7 */
  const shaft = new THREE.Group();
  const shaftBody = new THREE.Mesh(new THREE.BoxGeometry(5, 4, 3), new THREE.MeshStandardMaterial({ color: 0x10131e, roughness: 0.9 }));
  shaftBody.position.y = 2;
  shaft.add(shaftBody);
  const shaftDoor = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 2.6), new THREE.MeshBasicMaterial({ color: 0xff1e2d }));
  shaftDoor.position.set(0, 1.3, 1.52);
  shaft.add(shaftDoor);
  shaft.position.set(70, 0, 102);
  cityStatic.add(shaft);
  colliders.push({ x1: 67, x2: 73, z1: 100, z2: 104 });
  const shaftSign = textSprite('SHAFT 7', '#ff5b65');
  shaftSign.position.set(70, 5.4, 102);
  scene.add(shaftSign); // outside the mirrored group so the label is not duplicated underground

  /* streetlights — warm pools against the cool neon */
  const lampGroup = new THREE.Group();
  const poleGeo = new THREE.CylinderGeometry(0.09, 0.12, 7, 6);
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x1a1f2e, roughness: 0.8 });
  const poolTexC = document.createElement('canvas');
  poolTexC.width = 64; poolTexC.height = 64;
  {
    const g = poolTexC.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,214,150,0.55)');
    gr.addColorStop(1, 'rgba(255,214,150,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  }
  const poolTex = new THREE.CanvasTexture(poolTexC);
  for (let a = -3; a <= 2; a += 2) {
    for (let b = -3; b <= 2; b += 2) {
      const lx = 14 + a * BLOCK - 5.5, lz = 14 + b * BLOCK - 5.5;
      const pole = new THREE.Mesh(poleGeo, poleMat);

  let AC = null, ambGain = null, ambOn = true, engineOsc = null, engineGain = null;
  function audioInit() {
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const o1 = AC.createOscillator(), o2 = AC.createOscillator();
      o1.type = 'sawtooth'; o2.type = 'sawtooth';
      o1.frequency.value = 52; o2.frequency.value = 52.6;
      const lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 140;
      ambGain = AC.createGain(); ambGain.gain.value = 0.012;
      o1.connect(lp); o2.connect(lp); lp.connect(ambGain); ambGain.connect(AC.destination);
      o1.start(); o2.start();
      /* rain hiss */
      const len = 2 * AC.sampleRate;
      const buf = AC.createBuffer(1, len, AC.sampleRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      const noise = AC.createBufferSource();
      noise.buffer = buf; noise.loop = true;
      const bp = AC.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 5200; bp.Q.value = 0.4;
      const ng = AC.createGain(); ng.gain.value = 0.012;
      noise.connect(bp); bp.connect(ng); ng.connect(AC.destination);
      noise.start();
      /* engine */
      engineOsc = AC.createOscillator();
      engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 50;
      const elp = AC.createBiquadFilter();
      elp.type = 'lowpass'; elp.frequency.value = 320;
      engineGain = AC.createGain(); engineGain.gain.value = 0;
      engineOsc.connect(elp); elp.connect(engineGain); engineGain.connect(AC.destination);
      engineOsc.start();
    } catch (e) { AC = null; }
  }
  function beep(f, d, type, g) {
    if (!AC) return;
    try {
      const o = AC.createOscillator(), gn = AC.createGain();
      o.type = type || 'square'; o.frequency.value = f;
      gn.gain.setValueAtTime(g || 0.04, AC.currentTime);
      gn.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (d || 0.09));
      o.connect(gn); gn.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + (d || 0.09) + 0.02);
    } catch (e) {}
  }
  function thunder() {
    if (!AC) return;
    try {
      const len = 1.2 * AC.sampleRate;
      const buf = AC.createBuffer(1, len, AC.sampleRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const src = AC.createBufferSource();
      src.buffer = buf;
      const lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 110;
      const g = AC.createGain(); g.gain.value = 0.14;
      src.connect(lp); lp.connect(g); g.connect(AC.destination);
      src.start();
    } catch (e) {}
  }

  let camYaw = 0, camPitch = 0.5, camDist = 13, camDistTarget = 13;
  let dragging = false, lastMX = 0, lastMY = 0;

  canvas.addEventListener('mousedown', e => { dragging = true; lastMX = e.clientX; lastMY = e.clientY; });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    camYaw -= (e.clientX - lastMX) * 0.005;
    camPitch = Math.min(1.05, Math.max(0.2, camPitch + (e.clientY - lastMY) * 0.004));
    lastMX = e.clientX; lastMY = e.clientY;
  });
  canvas.addEventListener('wheel', e => {
    camDistTarget = Math.min(24, Math.max(8, camDistTarget + e.deltaY * 0.012));
  }, { passive: true });

  function focusObj() { return driving ? playerCar : player; }

  function enterCar() {
    driving = true;
    player.visible = false;
    camDistTarget = 17;
    el('speedo').style.display = 'block';
    sfxBlip();
  }
  function exitCar() {
    driving = false;
    carVel = 0;
    if (engineGain) engineGain.gain.value = 0;
    /* step out beside the car, away from walls */
    const side = new THREE.Vector3(Math.cos(carHeading), 0, -Math.sin(carHeading));
    let ex = playerCar.position.x + side.x * 2.6, ez = playerCar.position.z + side.z * 2.6;
    if (hitsBuilding(ex, ez, 0.7)) { ex = playerCar.position.x - side.x * 2.6; ez = playerCar.position.z - side.z * 2.6; }
    player.position.set(ex, 0, ez);
    player.visible = true;
    camDistTarget = 13;
    el('speedo').style.display = 'none';
    sfxBlip();
  }

  document.addEventListener('keydown', e => {
    if (window.OS && OS.paletteOpen) return;
    if (e.target.closest('input, select, textarea')) return;
    audioInit();

    if (e.code === 'Tab') {
      e.preventDefault();
      if (!overlayOpen && mission > 0) toggleCaseFile();
      return;
    }
    if (e.code === 'Escape') {
      if (dialogOpen()) { closeDialog(); return; }
      if (caseFileOpen) { toggleCaseFile(false); return; }
      if (mission > 0) {
        if (pauseShown) hideOverlay();
        else if (!overlayOpen) {
          pauseShown = true;
          showOverlay({
            eyebrow: '// PAUSED', title: 'STANDBY',
            body: 'WASD — MOVE / DRIVE &nbsp;&middot;&nbsp; SHIFT — RUN<br/>F — ENTER / EXIT VEHICLE &nbsp;&middot;&nbsp; SPACE — HANDBRAKE<br/>MOUSE DRAG — ORBIT &nbsp;&middot;&nbsp; WHEEL — ZOOM<br/>E — INTERACT &nbsp;&middot;&nbsp; TAB — CASE FILE<br/>M — AMBIENCE &nbsp;&middot;&nbsp; ESC — RESUME',
            buttons: [{ label: 'RESUME', fn: hideOverlay }],
          });
        }
      }
      return;
    }
    if (e.code === 'KeyM') {
      if (ambGain) { ambOn = !ambOn; ambGain.gain.value = ambOn ? 0.012 : 0; toast('AMBIENCE', ambOn ? 'ON' : 'OFF'); }
      return;
    }
    if (dialogOpen()) {
      const opt = dlgOptions.find(o => String(o.n) === e.key);
      if (opt) opt.fn();
      return;
    }
    if (overlayOpen) return;
    if (e.code === 'KeyF' && mission > 0 && mission < 4) {
      if (driving) exitCar();
      else if (dist2D(player.position, playerCar.position) < 4.5) enterCar();
      return;
    }
    if (e.code === 'KeyE' && !driving) {
      const it = nearestInteract();
      if (it) it.act();
      return;
    }
    keys.add(e.code);
  });
  document.addEventListener('keyup', e => keys.delete(e.code));
  window.addEventListener('blur', () => keys.clear());

  /* ════════ INTERACTABLES ════════ */
  const interactables = [];
  EVIDENCE.forEach(ev => {
    interactables.push({
      pos: () => ev.mesh.position, r: 3.4,
      enabled: () => mission === 1 && !ev.found,
      prompt: 'EXAMINE EVIDENCE', key: 'E',
      act: () => collectEvidence(ev),
    });
  });
  SUSPECTS.forEach(s => {
    interactables.push({
      pos: () => s.mesh.position, r: 4,
      enabled: () => mission >= 1 && mission < 4 && !overlayOpen,
      prompt: `QUESTION ${s.name}`, key: 'E',
      act: () => talkTo(s),
    });
  });
  interactables.push({
    pos: () => shaft.position, r: 5.5,
    enabled: () => mission === 3,
    prompt: 'EXAMINE SHAFT 7', key: 'E',
    act: () => {
      openDialog('MAINTENANCE SHAFT 7', 'The dock still smells of ozone and cheap tobacco. The access log glows: one entry, code M-7, signed in crimson light.', [
        { n: 1, label: 'STEP AWAY', fn: closeDialog },
      ]);
      addNote('SHAFT 7 ACCESS LOG', 'ONE ENTRY. CODE M-7. SIGNED IN CRIMSON LIGHT.');
    },
  });
  interactables.push({
    pos: () => playerCar.position, r: 4.5,
    enabled: () => mission > 0 && mission < 4 && !driving,
    prompt: 'ENTER VEHICLE', key: 'F',
    act: enterCar, // E works here too, not just F
  });

  function nearestInteract() {
    let best = null, bd = 1e9;
    for (const it of interactables) {
      if (!it.enabled()) continue;
      const d = dist2D(player.position, it.pos());
      if (d < it.r && d < bd) { bd = d; best = it; }
    }
    return best;
  }

  /* ════════ MISSIONS ════════ */
  let mission = 0, found = 0, wrongAccusations = 0, startTime = 0;
  let droneActive = false, droneDone = false, m2Completed = false, wpI = 0, lostT = 0;

  function collectEvidence(ev) {
    ev.found = true;
    scene.remove(ev.mesh);
    found++;
    sfxPickup();
    addNote(ev.t, ev.d);
    toast(`EVIDENCE ${found}/5`, ev.t);
    setProgress(`EVIDENCE ${found}/5`);
    shake = 0.35;
    if (found === 5) setTimeout(debrief1, 1000);
  }

  function talkTo(s) {
    if (mission < 3) {
      openDialog(`${s.name} — ${s.role}`, `“Come back when you have something, detective.”`, [
        { n: 1, label: 'WALK AWAY', fn: closeDialog },
      ]);
      return;
    }
    openDialog(`${s.name} — ${s.role}`, s.q, [
      { n: 1, label: 'PRESS FOR DETAILS', fn: () => { addNote(`STATEMENT — ${s.name}`, s.note); openDialog(`${s.name} — ${s.role}`, s.detail, [
        { n: 1, label: 'ACCUSE', fn: () => accuse(s) },
        { n: 2, label: 'WALK AWAY', fn: closeDialog },
      ]); } },
      { n: 2, label: 'ACCUSE', fn: () => accuse(s) },
      { n: 3, label: 'WALK AWAY', fn: closeDialog },
    ]);
  }

  function accuse(s) {
    if (s.win) {
      sfxPickup();
      openDialog(`${s.name} — ${s.role}`, s.confess, [
        { n: 1, label: 'CLOSE THE CASE', fn: () => { closeDialog(); winGame(); } },
      ]);
    } else {
      wrongAccusations++;
      sfxError();
      openDialog(`${s.name} — ${s.role}`, s.alibi, [
        { n: 1, label: 'WALK AWAY', fn: () => { closeDialog(); toast('ALIBI HOLDS', 'THE TRAIL COOLS. ACCURACY NOTED.'); } },
      ]);
    }
  }

  function startM1() {
    mission = 1;
    startTime = performance.now();
    setCase('CASE FILE 01 // COLD SCENE', 'SWEEP THE DISTRICT — RECOVER THE EVIDENCE', 'EVIDENCE 0/5');
    toast('CASE OPENED', 'FOLLOW THE BEACON. YOUR CAR IS PARKED EAST OF THE PLAZA.');
  }

  function debrief1() {
    showOverlay({
      eyebrow: '// CASE FILE 01 — CLOSED', title: 'COLD SCENE', decode: true,
      body: `Five fragments, one shape: someone with <span class="hl">maintenance access</span>, <span class="rd">crimson glass</span>, and a <span class="hl">long reach</span>.<br/><br/>A courier drone just lit up over the plaza. It flies like it&rsquo;s guilty. Bring the car.`,
      buttons: [{ label: 'OPEN CASE FILE 02', fn: () => { hideOverlay(); startM2(); } }],
    });
  }

  function startM2() {
    mission = 2;
    droneActive = false; droneDone = false; m2Completed = false; wpI = 0; lostT = 0;
    drone.position.set(0, 3.6, 5);
    setCase('CASE FILE 02 // THE COURIER', 'TAIL THE DRONE — STAY WITHIN 40M', 'APPROACH THE DRONE TO BEGIN');
  }

  function resetTail() {
    droneActive = false; wpI = 0; lostT = 0;
    drone.position.set(0, 3.6, 5);
    hideWarn();
    sfxError();
    toast('TARGET LOST', 'THE DRONE CIRCLES BACK TO THE PLAZA. AGAIN.');
    setProgress('APPROACH THE DRONE TO BEGIN');
  }

  function debrief2() {
    addNote('DRONE LOG', 'DOCKED AT MAINTENANCE SHAFT 7. ACCESS CODE M-7.');
    showOverlay({
      eyebrow: '// CASE FILE 02 — CLOSED', title: 'THE COURIER', decode: true,
      body: `The drone docked at <span class="hl">Maintenance Shaft 7</span> and signed itself in with code <span class="rd">M-7</span>.<br/><br/>Three people are standing in the plaza. One of them is lying.`,
      buttons: [{ label: 'OPEN CASE FILE 03', fn: () => { hideOverlay(); startM3(); } }],
    });
  }

  function startM3() {
    mission = 3;
    setCase('CASE FILE 03 // THE ACCUSATION', 'QUESTION THE SUSPECTS — ACCUSE THE THIEF', 'TAB — REVIEW THE CASE FILE');
    toast('FINAL CASE FILE', 'RETURN TO THE PLAZA. CHOOSE CAREFULLY.');
  }

  function winGame() {
    mission = 4;
    setBeacon(0, 0, false);
    if (driving) exitCar();
    const secs = Math.floor((performance.now() - startTime) / 1000);
    const mm = String(Math.floor(secs / 60)).padStart(2, '0');
    const ss = String(secs % 60).padStart(2, '0');
    let bestLine = '';
    try {
      const best = localStorage.getItem('fuf_best');
      if (!best || secs < +best) { localStorage.setItem('fuf_best', secs); bestLine = '<br/><span class="rd">NEW DISTRICT RECORD.</span>'; }
      else { const b = +best; bestLine = `<br/>DISTRICT RECORD — ${String(Math.floor(b / 60)).padStart(2, '0')}:${String(b % 60).padStart(2, '0')}`; }
    } catch (e) {}
    showOverlay({
      eyebrow: '// VERDICT', title: 'CASE CLOSED', sub: 'THE FEED COMES HOME', decode: true,
      body: `The city keeps buffering. Somewhere, a server exhales.<br/><br/>TIME — <span class="hl">${mm}:${ss}</span><br/>FALSE ACCUSATIONS — <span class="hl">${wrongAccusations}</span>${bestLine}<br/><br/><span class="rd">FLY, USER. FLY.</span>`,
      buttons: [
        { label: 'REOPEN CASE', fn: () => location.reload() },
        { label: 'RETURN TO OS', fn: () => { document.body.classList.add('fade-out'); setTimeout(() => location.href = '/', 180); }, ghost: true },
      ],
    });
  }

  /* ════════ MINIMAP ════════ */
  const mapScale = 2;
  const mapBase = document.createElement('canvas');
  mapBase.width = mapBase.height = (BOUND + 20) * 2 * mapScale;
  {
    const g = mapBase.getContext('2d');
    g.fillStyle = '#0d101c';
    g.fillRect(0, 0, mapBase.width, mapBase.height);
    const cx0 = mapBase.width / 2;
    /* roads */
    g.strokeStyle = '#070910';
    g.lineWidth = 15 * mapScale;
    for (let k = -3; k <= 2; k++) {
      const line = (14 + k * BLOCK) * mapScale;
      g.beginPath(); g.moveTo(cx0 + line, 0); g.lineTo(cx0 + line, mapBase.height); g.stroke();
      g.beginPath(); g.moveTo(0, cx0 + line); g.lineTo(mapBase.width, cx0 + line); g.stroke();
    }
    /* buildings */
    g.fillStyle = '#1b2236';
    buildingFootprints.forEach(b => {
      g.fillRect(cx0 + (b.x - b.w / 2) * mapScale, cx0 + (b.z - b.d / 2) * mapScale, b.w * mapScale, b.d * mapScale);
    });
    /* plaza */
    g.fillStyle = '#13182a';
    g.beginPath(); g.arc(cx0, cx0, 10 * mapScale, 0, 7); g.fill();
  }
  const mmCtx = el('minimap').getContext('2d');
  function drawMinimap() {
    const f = focusObj().position;
    const VIEW = 70; // world units across the minimap
    const px = (f.x + BOUND + 20) * mapScale, pz = (f.z + BOUND + 20) * mapScale;
    const w = VIEW * mapScale;
    mmCtx.clearRect(0, 0, 160, 160);
    mmCtx.drawImage(mapBase, px - w / 2, pz - w / 2, w, w, 0, 0, 160, 160);
    const toMap = (x, z) => [80 + (x - f.x) * (160 / VIEW), 80 + (z - f.z) * (160 / VIEW)];
    const blip = (x, z, color, r) => {
      const p = toMap(x, z);
      if (p[0] < -10 || p[0] > 170 || p[1] < -10 || p[1] > 170) { // clamp to edge
        p[0] = Math.max(6, Math.min(154, p[0]));
        p[1] = Math.max(6, Math.min(154, p[1]));
      }
      mmCtx.fillStyle = color;
      mmCtx.beginPath(); mmCtx.arc(p[0], p[1], r, 0, 7); mmCtx.fill();
    };
    if (beacon.visible) blip(beacon.position.x, beacon.position.z, '#ff1e2d', 4);
    if (mission === 2) blip(drone.position.x, drone.position.z, '#2dd4a0', 3.5);
    if (mission === 3) SUSPECTS.forEach(s => blip(s.mesh.position.x, s.mesh.position.z, '#f5b84d', 3));
    if (!driving) blip(playerCar.position.x, playerCar.position.z, '#9fb6e8', 3);
    /* player arrow */
    const ang = driving ? carHeading : playerInner.rotation.y;
    mmCtx.save();
    mmCtx.translate(80, 80);
    mmCtx.rotate(-ang + Math.PI);
    mmCtx.fillStyle = '#ffffff';
    mmCtx.beginPath();
    mmCtx.moveTo(0, -7); mmCtx.lineTo(4.5, 5); mmCtx.lineTo(-4.5, 5);
    mmCtx.closePath(); mmCtx.fill();
    mmCtx.restore();
  }

  /* ════════ INTRO ════════ */
  const touchNote = ('ontouchstart' in window) ? '<br/><br/><span class="rd">NOTE — A KEYBOARD IS REQUIRED. MOBILE IS NOT SUPPORTED.</span>' : '';
  showOverlay({
    eyebrow: '// FUNFLIX://OS PRESENTS', title: 'FLYUSERFLY', sub: 'A NOIR DETECTIVE SIMULATION', decode: true,
    body: `Night 47. Rain on neon.<br/><br/>The <span class="hl">Master Feed</span> is gone — six petabytes of everything anyone ever watched, lifted from the vault between two heartbeats of the grid.<br/><br/>You&rsquo;re the last detective on payroll. The city gave you a car, a hat, and one night.<br/><br/><span class="rd">FLY, USER. FLY.</span>${touchNote}`,
    buttons: [{ label: 'INITIATE CASE', fn: () => { audioInit(); hideOverlay(); startM1(); } }],
  });

  /* ════════ MAIN LOOP ════════ */
  const clock = new THREE.Clock();
  let shake = 0;
  const camPos = new THREE.Vector3(0, 10, 26);
  let lightning = 0, nextStrike = 14 + Math.random() * 20;
  let fpsAcc = 0, fpsN = 0, slowT = 0, perfMode = false;

  function hitsBuilding(x, z, m) {
    const r = m === undefined ? 0.7 : m;
    for (const c of colliders) {
      if (x > c.x1 - r && x < c.x2 + r && z > c.z1 - r && z < c.z2 + r) return true;
    }
    return false;
  }

  function tick() {
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    const frozen = overlayOpen || dialogOpen();

    /* adaptive quality: drop bloom if we cannot hold ~45fps */
    if (composer && !perfMode) {
      fpsAcc += dt; fpsN++;
      if (fpsN >= 30) {
        if (fpsAcc / fpsN > 0.024) { slowT += fpsAcc; } else slowT = 0;
        if (slowT > 2.5) {
          perfMode = true; composer = null;
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
          toast('PERFORMANCE MODE', 'BLOOM DISABLED FOR SMOOTHER PLAY.');
        }
        fpsAcc = 0; fpsN = 0;
      }
    }

    /* ── on-foot movement ── */
    let moving = false;
    if (!frozen && !driving && mission > 0 && mission < 4) {
      let mx = 0, mz = 0;
      const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
      const rx = Math.cos(camYaw),  rz = -Math.sin(camYaw);
      if (keys.has('KeyW') || keys.has('ArrowUp'))    { mx += fx; mz += fz; }
      if (keys.has('KeyS') || keys.has('ArrowDown'))  { mx -= fx; mz -= fz; }
      if (keys.has('KeyD') || keys.has('ArrowRight')) { mx += rx; mz += rz; }
      if (keys.has('KeyA') || keys.has('ArrowLeft'))  { mx -= rx; mz -= rz; }
      const len = Math.hypot(mx, mz);
      if (len > 0.01) {
        moving = true;
        mx /= len; mz /= len;
        const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight')) ? 13 : 7.5;
        const nx = player.position.x + mx * speed * dt;
        const nz = player.position.z + mz * speed * dt;
        if (!hitsBuilding(nx, player.position.z)) player.position.x = Math.max(-BOUND, Math.min(BOUND, nx));
        if (!hitsBuilding(player.position.x, nz)) player.position.z = Math.max(-BOUND, Math.min(BOUND, nz));
        playerInner.rotation.y = lerpAngle(playerInner.rotation.y, Math.atan2(mx, mz), Math.min(1, dt * 12));
      }
    }
    walkAnim(playerInner, t, moving ? 1 : 0);

    /* ── driving ── */
    if (!frozen && driving) {
      const accel = keys.has('KeyW') || keys.has('ArrowUp');
      const brake = keys.has('KeyS') || keys.has('ArrowDown');
      const hand  = keys.has('Space');
      if (accel) carVel = Math.min(28, carVel + 16 * dt);
      else if (brake) carVel = Math.max(-9, carVel - 26 * dt);
      else carVel *= Math.max(0, 1 - 1.4 * dt);
      if (hand) carVel *= Math.max(0, 1 - 5 * dt);
      const steer = (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0) - (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0);
      if (Math.abs(carVel) > 0.5) {
        carHeading += steer * 1.7 * dt * Math.sign(carVel) * Math.min(1, Math.abs(carVel) / 9);
      }
      const nx = playerCar.position.x + Math.sin(carHeading) * carVel * dt;
      const nz = playerCar.position.z + Math.cos(carHeading) * carVel * dt;
      if (hitsBuilding(nx, nz, 1.6)) {
        carVel *= -0.22;
        shake = Math.min(0.5, Math.abs(carVel) * 0.04 + 0.12);
        sfxError();
      } else {
        playerCar.position.x = Math.max(-BOUND, Math.min(BOUND, nx));
        playerCar.position.z = Math.max(-BOUND, Math.min(BOUND, nz));
      }
      playerCar.rotation.y = carHeading;
      player.position.copy(playerCar.position); // keep mission distances in sync
      if (engineGain) {
        engineGain.gain.value = 0.028;
        if (engineOsc) engineOsc.frequency.value = 46 + Math.abs(carVel) * 5.2 + Math.sin(t * 30) * 2;
      }
      el('speedoVal').textContent = Math.round(Math.abs(carVel) * 3.6);
    } else if (engineGain) {
      engineGain.gain.value = 0; // silent when on foot or paused
    }

    /* ── traffic ── */
    if (!frozen) {
      trafficCars.forEach(tc => {
        const wp = tc.loop[tc.target];
        const dx = wp[0] - tc.mesh.position.x, dz = wp[1] - tc.mesh.position.z;
        const dd = Math.hypot(dx, dz);
        if (dd < 1.5) tc.target = (tc.target + 1) % tc.loop.length;
        else {
          tc.mesh.position.x += (dx / dd) * tc.speed * dt;
          tc.mesh.position.z += (dz / dd) * tc.speed * dt;
          tc.mesh.rotation.y = lerpAngle(tc.mesh.rotation.y, Math.atan2(dx, dz), Math.min(1, dt * 5));
        }
      });
      peds.forEach(pd => {
        const axis = pd.horizontal ? 'x' : 'z';
        pd.mesh.position[axis] += pd.dir * pd.speed * dt;
        if (pd.mesh.position[axis] > pd.to) pd.dir = -1;
        if (pd.mesh.position[axis] < pd.from) pd.dir = 1;
        const ang = pd.horizontal ? (pd.dir > 0 ? Math.PI / 2 : -Math.PI / 2) : (pd.dir > 0 ? 0 : Math.PI);
        pd.mesh.rotation.y = lerpAngle(pd.mesh.rotation.y, ang, Math.min(1, dt * 6));
        walkAnim(pd.mesh, t + pd.line, 0.8);
      });
    }

    /* ── world anims ── */
    EVIDENCE.forEach((ev, i) => {
      if (ev.found) return;
      ev.core.rotation.y += dt * 2;
      ev.core.position.y = 0.8 + Math.sin(t * 2 + i) * 0.18;
    });
    droneRing.rotation.z += dt * 2.4;
    SUSPECTS.forEach((s, i) => { s.mesh.rotation.z = Math.sin(t * 1.2 + i * 2) * 0.02; });
    pylonMat.emissiveIntensity = 0.7 + Math.sin(t * 2.2) * 0.3;
    beaconRing.scale.setScalar(1 + Math.sin(t * 3) * 0.12);
    beacon.material.opacity = 0.1 + Math.sin(t * 2.5) * 0.04;
    tallBuildings.forEach((tb, i) => { if (tb.blink) tb.blink.material.opacity = 0.5 + Math.sin(t * 2 + i * 1.7) * 0.5; });

    /* billboards (throttled to ~8fps) */
    if ((t * 8 | 0) !== ((t - dt) * 8 | 0)) {
      billboards.forEach(bb => {
        bb.scroll = (bb.scroll + 14) % 600;
        bb.hue = (bb.hue + 2) % 360;
        const g = bb.ctx;
        g.fillStyle = '#06070f';
        g.fillRect(0, 0, 256, 128);
        g.font = '900 44px "Syne", sans-serif';
        g.fillStyle = `hsl(${bb.hue}, 90%, 60%)`;
        g.shadowColor = g.fillStyle; g.shadowBlur = 18;
        g.fillText(bb.msg, 256 - bb.scroll, 80);
        g.shadowBlur = 0;
        bb.tex.needsUpdate = true;
      });
    }

    /* lightning */
    if (!frozen) {
      nextStrike -= dt;
      if (nextStrike <= 0) {
        lightning = 1;
        nextStrike = 16 + Math.random() * 26;
        setTimeout(thunder, 600 + Math.random() * 1500);
      }
    }
    if (lightning > 0.01) {
      lightning *= Math.pow(0.004, dt);
      renderer.toneMappingExposure = 1.05 + lightning * (0.7 + Math.sin(t * 60) * 0.3);
    } else renderer.toneMappingExposure = 1.05;

    /* rain follows the focus */
    const f = focusObj().position;
    const rp = rainGeo.attributes.position.array;
    for (let i = 0; i < RAIN_N; i++) {
      rp[i * 3 + 1] -= 58 * dt;
      if (rp[i * 3 + 1] < 0) {
        rp[i * 3 + 1] = 55 + Math.random() * 8;
        rp[i * 3]     = f.x + (Math.random() - 0.5) * 200;
        rp[i * 3 + 2] = f.z + (Math.random() - 0.5) * 200;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;

    /* ── mission logic ── */
    if (!frozen) {
      if (mission === 1) {
        let nearest = null, nd = 1e9;
        EVIDENCE.forEach(ev => {
          if (ev.found) return;
          const d = dist2D(player.position, ev.mesh.position);
          if (d < nd) { nd = d; nearest = ev; }
        });
        if (nearest) setBeacon(nearest.x, nearest.z, true);
        else setBeacon(0, 0, false);
      } else if (mission === 2) {
        setBeacon(drone.position.x, drone.position.z, true);
        const dp = dist2D(player.position, drone.position);
        if (!droneActive && !droneDone) {
          if (dp < 16) {
            droneActive = true;
            setProgress('IN PURSUIT');
            toast('COURIER DEPARTING', 'DO NOT LOSE IT.');
            sfxBlip();
          }
        } else if (droneActive && !droneDone) {
          const wp = DRONE_WP[wpI];
          const dx = wp[0] - drone.position.x, dz = wp[1] - drone.position.z;
          const dd = Math.hypot(dx, dz);
          if (dd < 1.2) {
            wpI++;
            if (wpI >= DRONE_WP.length) droneDone = true;
          } else {
            drone.position.x += (dx / dd) * 11.5 * dt;
            drone.position.z += (dz / dd) * 11.5 * dt;
          }
          drone.position.y = 3.6 + Math.sin(t * 3) * 0.25;
          if (dp > 40) {
            lostT += dt;
            warn(`SIGNAL LOST — RESET IN ${Math.max(0, 4 - lostT).toFixed(1)}S`);
            if (lostT >= 4) resetTail();
          } else if (dp > 30) {
            warn('SIGNAL DEGRADING — CLOSE THE GAP');
            lostT = 0;
          } else { hideWarn(); lostT = 0; }
        } else if (droneDone) {
          drone.position.y += (1.6 - drone.position.y) * dt * 3;
          hideWarn();
          if (!m2Completed) { m2Completed = true; sfxPickup(); setTimeout(debrief2, 900); }
        }
      } else if (mission === 3) {
        setBeacon(0, -2, true);
      }
    }

    /* interact hint */
    if (!frozen && mission > 0 && mission < 4) {
      if (driving) {
        el('hudHint').style.display = Math.abs(carVel) < 1 ? 'block' : 'none';
        el('hudHintKey').textContent = '[F]';
        el('hudHintText').textContent = 'EXIT VEHICLE';
      } else {
        const it = nearestInteract();
        if (it) {
          el('hudHint').style.display = 'block';
          el('hudHintKey').textContent = `[${it.key}]`;
          el('hudHintText').textContent = it.prompt;
        } else el('hudHint').style.display = 'none';
      }
    } else el('hudHint').style.display = 'none';

    /* beacon distance */
    if (beacon.visible && mission > 0 && mission < 4) {
      el('hudDist').textContent = `BEACON — ${Math.round(dist2D(player.position, beacon.position))}M`;
    } else el('hudDist').textContent = '';

    /* minimap */
    if (mission > 0) drawMinimap();

    /* ── camera ── */
    camDist += (camDistTarget - camDist) * Math.min(1, dt * 5);
    const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
    const desired = new THREE.Vector3(
      f.x + Math.sin(camYaw) * cp * camDist,
      f.y + sp * camDist + 1.6,
      f.z + Math.cos(camYaw) * cp * camDist
    );
    camPos.lerp(desired, Math.min(1, dt * 6));
    if (shake > 0.003) {
      camPos.x += (Math.random() - 0.5) * shake;
      camPos.y += (Math.random() - 0.5) * shake;
      shake *= Math.pow(0.01, dt);
    }
    camera.position.copy(camPos);
    camera.lookAt(f.x, f.y + 1.7, f.z);

    if (composer) composer.render();
    else renderer.render(scene, camera);
  }
  tick();
})();
</script>
</body>
