<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compute — FUNFLIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/os.css">
  <style>
    .stage {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 64px 24px 80px;
    }

    .mod-head { text-align: center; margin-bottom: 48px; }
    .mod-over {
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--gray-2);
      margin-bottom: 16px;
    }
    .mod-title {
      font-family: var(--serif); font-weight: 400;
      font-size: clamp(44px, 6vw, 68px);
      letter-spacing: -0.02em;
      line-height: 0.95;
      color: var(--black);
    }
    .mod-sub {
      margin-top: 12px;
      font-family: var(--serif); font-style: italic;
      font-size: 17px; color: var(--gray);
    }

    .bench {
      display: flex; gap: 24px; flex-wrap: wrap;
      align-items: stretch; justify-content: center;
    }

    /* ── the instrument ── */
    .instrument {
      width: min(430px, 100%);
      background: #fff;
      border: 1px solid var(--rule-2);
      border-radius: 28px;
      padding: 12px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.05);
    }
    .instrument-inner {
      border: 1px solid var(--rule);
      border-radius: 18px;
      padding: 26px;
    }

    .readout {
      border-bottom: 1px solid var(--rule-2);
      padding: 6px 4px 22px;
      margin-bottom: 24px;
      min-height: 104px;
      display: flex; flex-direction: column;
      justify-content: flex-end; align-items: flex-end;
      word-break: break-all;
    }
    .readout-expr {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 300;
      color: var(--gray-2);
      letter-spacing: 0.08em;
      min-height: 16px; margin-bottom: 10px;
    }
    .readout-val {
      font-family: var(--serif); font-weight: 400;
      font-size: 48px; line-height: 1;
      color: var(--black);
      transition: font-size 0.15s;
    }
    .readout-val.long { font-size: 28px; }
    .readout-val.error {
      font-size: 16px; font-style: italic;
      color: var(--gray);
    }

    .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .key {
      border: 1px solid var(--rule);
      border-radius: 12px;
      background: #fff;
      color: var(--gray);
      font-family: var(--sans); font-size: 12px; font-weight: 500;
      padding: 13px 4px;
      transition: all 0.16s;
    }
    .key:hover { border-color: var(--black); color: var(--black); }
    .key:active { transform: scale(0.94); }

    .k-num { font-family: var(--serif); font-size: 18px; color: var(--black); }
    .k-fn  { font-size: 11px; color: var(--gray); }
    .k-op  { font-family: var(--serif); font-size: 17px; color: var(--black); background: var(--wash); }
    .k-const { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--black); }
    .k-ac {
      color: var(--black); border-color: var(--black);
      font-size: 10px; font-weight: 700; letter-spacing: 0.24em;
    }
    .k-eq {
      grid-column: span 2;
      background: var(--black); border-color: var(--black);
      border-radius: 999px;
      color: #fff;
      font-family: var(--serif); font-size: 20px;
    }
    .k-eq:hover { background: var(--black); color: #fff; transform: scale(1.02); }
    .k-eq:active { transform: scale(0.96); }
    .k-span2 { grid-column: span 2; }
    .keys-sep { grid-column: span 5; height: 4px; }

    /* ── the ledger ── */
    .ledger {
      width: 250px;
      display: flex; flex-direction: column;
      background: #fff;
      border: 1px solid var(--rule-2);
      border-radius: 28px;
      padding: 28px 26px;
      max-height: 610px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.05);
    }
    @media (max-width: 760px) { .ledger { width: min(430px, 100%); max-height: 230px; } }
    .ledger-title {
      font-family: var(--sans); font-size: 10px; font-weight: 600;
      letter-spacing: 0.26em; text-transform: uppercase;
      color: var(--gray-2);
      padding-bottom: 16px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 6px;
    }
    .ledger-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .ledger-empty {
      font-family: var(--serif); font-style: italic;
      font-size: 15px; color: var(--gray-2);
      line-height: 1.9; padding-top: 14px;
    }
    .h-item {
      text-align: right;
      padding: 13px 4px;
      border-bottom: 1px solid var(--rule);
      background: none; border-left: none; border-right: none; border-top: none;
      width: 100%;
      transition: background 0.15s;
      border-radius: 8px;
    }
    .h-item:hover { background: var(--wash); }
    .h-expr {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px; font-weight: 300;
      color: var(--gray-2);
      display: block; margin-bottom: 4px;
      word-break: break-all;
    }
    .h-val {
      font-family: var(--serif);
      font-size: 18px; color: var(--gray);
      word-break: break-all;
      transition: color 0.15s;
    }
    .h-item:hover .h-val { color: var(--black); }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="stage">
    <div class="mod-head fade-rise">
      <div class="mod-over">Instrument No. I</div>
      <h1 class="mod-title">Compute</h1>
      <div class="mod-sub">a scientific instrument of uncommon precision</div>
    </div>

    <div class="bench">
      <div class="instrument fade-rise-d1">
        <div class="instrument-inner">
          <div class="readout">
            <div class="readout-expr" id="expression">&nbsp;</div>
            <div class="readout-val" id="result">0</div>
          </div>

          <div class="keys">
            <button class="key k-fn" onclick="append('sin(')">sin</button>
            <button class="key k-fn" onclick="append('cos(')">cos</button>
            <button class="key k-fn" onclick="append('tan(')">tan</button>
            <button class="key k-fn" onclick="append('log(')">log</button>
            <button class="key k-fn" onclick="append('log2(')">log&#8322;</button>

            <button class="key k-fn" onclick="append('sqrt(')">&radic;</button>
            <button class="key k-fn" onclick="append('pow(')">x&#690;</button>
            <button class="key k-fn" onclick="append('exp(')">e&#739;</button>
            <button class="key k-fn" onclick="append('factorial(')">n!</button>
            <button class="key k-fn" onclick="append('abs(')">|x|</button>

            <button class="key k-fn" onclick="append('degrees(')">deg</button>
            <button class="key k-fn" onclick="append('radians(')">rad</button>
            <button class="key k-const" onclick="append('pi')">&pi;</button>
            <button class="key k-const" onclick="append('e')">e</button>
            <button class="key k-fn" onclick="append('(')">(&hairsp;)</button>

            <div class="keys-sep"></div>

            <button class="key k-ac" onclick="clearAll()">AC</button>
            <button class="key k-fn" onclick="backspace()">&#9003;</button>
            <button class="key k-op" onclick="append('%')">%</button>
            <button class="key k-op" onclick="append('/')">&divide;</button>
            <button class="key k-op" onclick="append('**')">^</button>

            <button class="key k-num" onclick="append('7')">7</button>
            <button class="key k-num" onclick="append('8')">8</button>
            <button class="key k-num" onclick="append('9')">9</button>
            <button class="key k-op" onclick="append('*')">&times;</button>
            <button class="key k-op" onclick="append('//')">&divide;&divide;</button>

            <button class="key k-num" onclick="append('4')">4</button>
            <button class="key k-num" onclick="append('5')">5</button>
            <button class="key k-num" onclick="append('6')">6</button>
            <button class="key k-op" onclick="append('-')">&minus;</button>
            <button class="key k-fn" onclick="append(')')">)</button>

            <button class="key k-num" onclick="append('1')">1</button>
            <button class="key k-num" onclick="append('2')">2</button>
            <button class="key k-num" onclick="append('3')">3</button>
            <button class="key k-op" onclick="append('+')">+</button>
            <button class="key k-fn" onclick="append('.')">.</button>

            <button class="key k-num k-span2" onclick="append('0')">0</button>
            <button class="key k-fn" onclick="negate()">+/&minus;</button>
            <button class="key k-eq" onclick="calculate()">=</button>
          </div>
        </div>
      </div>

      <div class="ledger fade-rise-d2">
        <div class="ledger-title">The Ledger</div>
        <div class="ledger-list" id="historyList">
          <div class="ledger-empty">Nothing yet. Results are kept here, like receipts in a coat pocket. Click one to recall it.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/os.js"></script>
<script>
  let expr = '';
  const history = [];

  const exprEl = document.getElementById('expression');
  const resEl  = document.getElementById('result');

  function updateDisplay() { exprEl.innerHTML = expr || '&nbsp;'; }
  function fitResult() { resEl.classList.toggle('long', resEl.textContent.length > 12); }

  function append(val) {
    if (val === '(' && expr && /[\d)]$/.test(expr)) expr += '*' + val;
    else expr += val;
    updateDisplay();
  }

  function clearAll() {
    expr = '';
    resEl.textContent = '0';
    resEl.className = 'readout-val';
    updateDisplay();
  }

  function backspace() { expr = expr.slice(0, -1); updateDisplay(); }

  function negate() {
    if (!expr) return;
    expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr;
    updateDisplay();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = history.map((h, i) =>
      `<button class="h-item" data-i="${i}"><span class="h-expr">${escapeHtml(h.expr)} =</span><span class="h-val">${escapeHtml(h.res)}</span></button>`
    ).join('');
  }
  document.getElementById('historyList').addEventListener('click', e => {
    const it = e.target.closest('.h-item');
    if (!it) return;
    expr = history[+it.dataset.i].res;
    resEl.textContent = expr;
    resEl.className = 'readout-val';
    fitResult();
    updateDisplay();
  });
  function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  async function calculate() {
    if (!expr) return;
    const sent = expr;
    try {
      const res  = await fetch('/calculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ expression: sent }),
      });
      const data = await res.json();
      if (data.error) {
        resEl.textContent = data.error;
        resEl.className = 'readout-val error';
      } else {
        exprEl.textContent = sent + ' =';
        resEl.textContent = data.result;
        resEl.className = 'readout-val';
        fitResult();
        expr = data.result;
        history.unshift({ expr: sent, res: data.result });
        if (history.length > 12) history.pop();
        renderHistory();
      }
    } catch {
      resEl.textContent = 'a momentary lapse — try again';
      resEl.className = 'readout-val error';
    }
  }

  document.addEventListener('keydown', e => {
    if (window.OS && OS.paletteOpen) return;
    if (e.metaKey || e.ctrlKey) return;
    if (e.target.closest('input, select, textarea')) return;
    if (e.key >= '0' && e.key <= '9') append(e.key);
    else if (['+','-','*','/','%','.','(',')'].includes(e.key)) append(e.key);
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === '^') append('**');
  });
</script>
</body>
</html>
