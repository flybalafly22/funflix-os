<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compute — FUNFLIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/os.css">
  <style>
    .stage {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 54px 24px 70px;
    }

    .mod-head { text-align: center; margin-bottom: 44px; }
    .mod-over {
      font-family: var(--sans); font-size: 9px; font-weight: 600;
      letter-spacing: 0.5em; text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    .mod-title {
      font-family: var(--serif); font-weight: 300;
      font-size: clamp(40px, 6vw, 62px);
      letter-spacing: 0.04em;
      color: var(--ivory);
    }
    .mod-sub {
      margin-top: 10px;
      font-family: var(--serif); font-style: italic;
      font-size: 14px; color: var(--ivory-faint);
    }

    .bench {
      display: flex; gap: 26px; flex-wrap: wrap;
      align-items: stretch; justify-content: center;
    }

    /* ── the instrument ── */
    .instrument {
      width: 430px;
      background: rgba(255,255,255,0.012);
      border: 1px solid var(--hairline-2);
      padding: 14px;
      position: relative;
    }
    .instrument-inner {
      border: 1px solid var(--hairline);
      padding: 26px;
    }

    .readout {
      border-bottom: 1px solid var(--hairline-2);
      padding: 6px 4px 22px;
      margin-bottom: 26px;
      min-height: 104px;
      display: flex; flex-direction: column;
      justify-content: flex-end; align-items: flex-end;
      word-break: break-all;
    }
    .readout-expr {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 300;
      color: var(--ivory-faint);
      letter-spacing: 0.1em;
      min-height: 16px; margin-bottom: 10px;
    }
    .readout-val {
      font-family: var(--serif); font-weight: 300;
      font-size: 46px; line-height: 1;
      color: var(--ivory);
      letter-spacing: 0.01em;
      transition: font-size 0.15s;
    }
    .readout-val.long { font-size: 27px; }
    .readout-val.error {
      font-size: 15px; font-style: italic;
      color: var(--gold-bright);
    }

    .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .key {
      border: 1px solid var(--hairline);
      background: transparent;
      color: var(--ivory-dim);
      font-family: var(--sans); font-size: 13px; font-weight: 500;
      padding: 13px 4px;
      transition: all 0.18s;
    }
    .key:hover { border-color: var(--gold-dim); color: var(--ivory); background: rgba(200,164,93,0.05); }
    .key:active { transform: scale(0.95); }

    .k-num { font-family: var(--serif); font-size: 16px; font-weight: 400; color: var(--ivory); }
    .k-fn  { font-size: 11px; color: var(--ivory-faint); }
    .k-fn:hover { color: var(--ivory-dim); }
    .k-op  { color: var(--gold); font-family: var(--serif); font-size: 15px; }
    .k-const { color: var(--gold-bright); font-family: var(--serif); font-style: italic; font-size: 15px; }
    .k-ac {
      color: var(--gold-bright); border-color: var(--gold-dim);
      font-size: 10px; font-weight: 700; letter-spacing: 0.3em;
    }
    .k-eq {
      grid-column: span 2;
      background: var(--gold); border-color: var(--gold);
      color: var(--noir);
      font-family: var(--serif); font-size: 19px;
    }
    .k-eq:hover { background: var(--gold-bright); border-color: var(--gold-bright); color: var(--noir); box-shadow: 0 0 34px var(--gold-glow); }
    .k-span2 { grid-column: span 2; }
    .keys-sep { grid-column: span 5; height: 4px; }

    /* ── the ledger ── */
    .ledger {
      width: 240px;
      display: flex; flex-direction: column;
      border: 1px solid var(--hairline-2);
      padding: 26px 24px;
      max-height: 600px;
      background: rgba(255,255,255,0.012);
    }
    @media (max-width: 760px) { .ledger { width: 430px; max-height: 230px; } }
    .ledger-title {
      font-family: var(--sans); font-size: 9px; font-weight: 600;
      letter-spacing: 0.42em; text-transform: uppercase;
      color: var(--ivory-faint);
      padding-bottom: 16px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 6px;
    }
    .ledger-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .ledger-empty {
      font-family: var(--serif); font-style: italic;
      font-size: 13px; color: var(--ivory-faint);
      line-height: 2; padding-top: 14px;
    }
    .h-item {
      text-align: right;
      padding: 13px 4px;
      border-bottom: 1px solid var(--hairline);
      background: none; border-left: none; border-right: none; border-top: none;
      width: 100%;
      transition: background 0.18s;
    }
    .h-item:hover { background: rgba(200,164,93,0.05); }
    .h-expr {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px; font-weight: 300;
      color: var(--ivory-faint);
      display: block; margin-bottom: 4px;
      word-break: break-all; letter-spacing: 0.06em;
    }
    .h-val {
      font-family: var(--serif);
      font-size: 16px; color: var(--ivory-dim);
      word-break: break-all;
      transition: color 0.18s;
    }
    .h-item:hover .h-val { color: var(--gold-bright); }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="stage">
    <div class="mod-head rise" style="animation-delay:0.05s">
      <div class="mod-over">Instrument No. I</div>
      <h1 class="mod-title">Compute</h1>
      <div class="mod-sub">a scientific instrument of uncommon precision</div>
    </div>

    <div class="bench">
      <div class="instrument rise" style="animation-delay:0.2s">
        <div class="instrument-inner">
          <div class="readout">
            <div class="readout-expr" id="expression">&nbsp;</div>
            <div class="readout-val" id="result">0</div>
          </div>

          <div class="keys">
            <button class="key k-fn" onclick="append('sin(')">sin</button>
            <button class="key k-fn" onclick="append('cos(')">cos</button>
            <button class="key k-fn" onclick="append('tan(')">tan</button>
            <button class="key k-fn" onclick="append('log(')">log</button>
            <button class="key k-fn" onclick="append('log2(')">log&#8322;</button>

            <button class="key k-fn" onclick="append('sqrt(')">&radic;</button>
            <button class="key k-fn" onclick="append('pow(')">x&#690;</button>
            <button class="key k-fn" onclick="append('exp(')">e&#739;</button>
            <button class="key k-fn" onclick="append('factorial(')">n!</button>
            <button class="key k-fn" onclick="append('abs(')">|x|</button>

            <button class="key k-fn" onclick="append('degrees(')">deg</button>
            <button class="key k-fn" onclick="append('radians(')">rad</button>
            <button class="key k-const" onclick="append('pi')">&pi;</button>
            <button class="key k-const" onclick="append('e')">e</button>
            <button class="key k-fn" onclick="append('(')">(&hairsp;)</button>

            <div class="keys-sep"></div>

            <button class="key k-ac" onclick="clearAll()">AC</button>
            <button class="key k-fn" onclick="backspace()">&#9003;</button>
            <button class="key k-op" onclick="append('%')">%</button>
            <button class="key k-op" onclick="append('/')">&divide;</button>
            <button class="key k-op" onclick="append('**')">^</button>

            <button class="key k-num" onclick="append('7')">7</button>
            <button class="key k-num" onclick="append('8')">8</button>
            <button class="key k-num" onclick="append('9')">9</button>
            <button class="key k-op" onclick="append('*')">&times;</button>
            <button class="key k-op" onclick="append('//')">&divide;&divide;</button>

            <button class="key k-num" onclick="append('4')">4</button>
            <button class="key k-num" onclick="append('5')">5</button>
            <button class="key k-num" onclick="append('6')">6</button>
            <button class="key k-op" onclick="append('-')">&minus;</button>
            <button class="key k-fn" onclick="append(')')">)</button>

            <button class="key k-num" onclick="append('1')">1</button>
            <button class="key k-num" onclick="append('2')">2</button>
            <button class="key k-num" onclick="append('3')">3</button>
            <button class="key k-op" onclick="append('+')">+</button>
            <button class="key k-fn" onclick="append('.')">.</button>

            <button class="key k-num k-span2" onclick="append('0')">0</button>
            <button class="key k-fn" onclick="negate()">+/&minus;</button>
            <button class="key k-eq" onclick="calculate()">=</button>
          </div>
        </div>
      </div>

      <div class="ledger rise" style="animation-delay:0.32s">
        <div class="ledger-title">The Ledger</div>
        <div class="ledger-list" id="historyList">
          <div class="ledger-empty">Nothing yet. Results are kept here, like receipts in a coat pocket. Click one to recall it.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/os.js"></script>
<script>
  let expr = '';
  const history = [];

  const exprEl = document.getElementById('expression');
  const resEl  = document.getElementById('result');

  function updateDisplay() { exprEl.innerHTML = expr || '&nbsp;'; }
  function fitResult() { resEl.classList.toggle('long', resEl.textContent.length > 12); }

  function append(val) {
    if (val === '(' && expr && /[\d)]$/.test(expr)) expr += '*' + val;
    else expr += val;
    updateDisplay();
  }

  function clearAll() {
    expr = '';
    resEl.textContent = '0';
    resEl.className = 'readout-val';
    updateDisplay();
  }

  function backspace() { expr = expr.slice(0, -1); updateDisplay(); }

  function negate() {
    if (!expr) return;
    expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr;
    updateDisplay();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = history.map((h, i) =>
      `<button class="h-item" data-i="${i}"><span class="h-expr">${escapeHtml(h.expr)} =</span><span class="h-val">${escapeHtml(h.res)}</span></button>`
    ).join('');
  }
  document.getElementById('historyList').addEventListener('click', e => {
    const it = e.target.closest('.h-item');
    if (!it) return;
    expr = history[+it.dataset.i].res;
    resEl.textContent = expr;
    resEl.className = 'readout-val';
    fitResult();
    updateDisplay();
  });
  function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  async function calculate() {
    if (!expr) return;
    const sent = expr;
    try {
      const res  = await fetch('/calculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ expression: sent }),
      });
      const data = await res.json();
      if (data.error) {
        resEl.textContent = data.error;
        resEl.className = 'readout-val error';
      } else {
        exprEl.textContent = sent + ' =';
        resEl.textContent = data.result;
        resEl.className = 'readout-val';
        fitResult();
        expr = data.result;
        history.unshift({ expr: sent, res: data.result });
        if (history.length > 12) history.pop();
        renderHistory();
      }
    } catch {
      resEl.textContent = 'a momentary lapse — try again';
      resEl.className = 'readout-val error';
    }
  }

  document.addEventListener('keydown', e => {
    if (window.OS && OS.paletteOpen) return;
    if (e.metaKey || e.ctrlKey) return;
    if (e.target.closest('input, select, textarea')) return;
    if (e.key >= '0' && e.key <= '9') append(e.key);
    else if (['+','-','*','/','%','.','(',')'].includes(e.key)) append(e.key);
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === '^') append('**');
  });
</script>
</body>
</html>
