<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>FLY — COSTA VISTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/os.css">
  <style>
    html, body { height: 100vh; height: 100dvh; overflow: hidden; }

    #gameWrap {
      position: relative;
      flex: 1; min-height: 0;
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
      background: #0b0a08;
    }
    #gameCanvas { position: absolute; inset: 0; display: block; }

    body.immersive .hud, body.immersive .statusbar { display: none !important; }
    body.immersive #gameWrap { position: fixed; inset: 0; z-index: 120; }

    .g-panel {
      position: absolute;
      background: rgba(8,6,16,0.78);
      border: 1px solid rgba(255,94,138,0.35);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      font-family: var(--mono);
      pointer-events: none;
      border-radius: 4px;
      color: #f1f5f9;
    }

    #hudObj { top: 14px; left: 14px; width: 280px; padding: 12px 15px 11px; }
    #hudObjTitle { font-size: 10px; letter-spacing: 0.22em; color: #ff5e8a; margin-bottom: 7px; }
    #hudObjText { font-size: 11.5px; letter-spacing: 0.05em; color: #f1f5f9; line-height: 1.65; }
    #hudObjSub { font-size: 9.5px; letter-spacing: 0.16em; color: #94a3b8; margin-top: 6px; }

    #hudClock {
      top: 14px; right: 14px;
      padding: 8px 14px;
      font-size: 13px; letter-spacing: 0.18em; color: #f1f5f9;
    }
    #hudClock .d { color: #ffb35c; font-size: 9px; letter-spacing: 0.2em; }

    #hudHint {
      bottom: 168px; left: 50%; transform: translateX(-50%);
      padding: 9px 20px;
      font-size: 11px; letter-spacing: 0.18em; color: #f1f5f9;
      display: none;
    }
    #hudHint .k { color: #ff5e8a; }

    #speedo {
      bottom: 14px; left: 50%; transform: translateX(-50%);
      padding: 7px 15px;
      font-size: 15px; letter-spacing: 0.1em; color: #f1f5f9;
      display: none;
    }
    #speedo .u { font-size: 9px; color: #64748b; letter-spacing: 0.2em; }

    #minimapBox {
      position: absolute; bottom: 14px; right: 14px;
      width: 150px; height: 150px;
      border-radius: 50%;
      border: 1px solid rgba(255,94,138,0.45);
      overflow: hidden;
      background: #0a0d18;
      display: none;
      pointer-events: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.55);
    }
    #minimap { width: 100%; height: 100%; }

    #toastBox {
      position: absolute; left: 50%; top: 56px; transform: translateX(-50%);
      width: min(320px, 80%);
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: rgba(8,6,16,0.88);
      border: 1px solid rgba(255,94,138,0.5);
      border-radius: 4px;
      padding: 10px 14px;
      font-family: var(--mono); font-size: 10.5px;
      letter-spacing: 0.08em; color: #f1f5f9;
      line-height: 1.6; text-align: center;
      opacity: 1; transition: opacity 0.6s;
    }
    .toast .tt { color: #ff5e8a; letter-spacing: 0.18em; }
    .toast.bye { opacity: 0; }

    #dlg {
      position: absolute;
      bottom: 170px; left: 50%; transform: translateX(-50%);
      width: min(560px, calc(100% - 30px));
      background: rgba(8,6,16,0.94);
      border: 1px solid rgba(255,94,138,0.5);
      border-radius: 6px;
      padding: 16px 20px;
      font-family: var(--mono);
      display: none;
      z-index: 60;
      color: #f1f5f9;
    }
    #dlgSpeaker { font-size: 10px; letter-spacing: 0.24em; color: #ffb35c; margin-bottom: 9px; }
    #dlgText { font-size: 13px; line-height: 1.85; color: #f1f5f9; margin-bottom: 12px; }
    .dlg-opt {
      padding: 11px 12px;
      font-size: 11.5px; letter-spacing: 0.1em; color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
      cursor: pointer; margin-bottom: 6px;
      transition: all 0.12s;
    }
    .dlg-opt:hover { color: #f1f5f9; border-color: rgba(255,94,138,0.5); background: rgba(255,94,138,0.06); }
    .dlg-opt .n { color: #ff5e8a; margin-right: 10px; }

    #bigOv {
      position: absolute; inset: 0; z-index: 150;
      background: rgba(6,4,14,0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .ov-box {
      width: min(560px, 100%);
      max-height: 90%;
      overflow-y: auto;
      border: 1px solid rgba(255,94,138,0.5);
      border-radius: 8px;
      background: linear-gradient(165deg, rgba(20,10,30,0.97), rgba(8,6,18,0.97));
      padding: 36px 38px;
      position: relative;
      color: #94a3b8;
    }
    .ov-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.4em; color: #ffb35c; margin-bottom: 12px; }
    .ov-title {
      font-family: var(--disp); font-size: clamp(34px, 7vw, 56px); font-weight: 800;
      background: linear-gradient(135deg, #ff5e8a 10%, #ffb35c 60%, #7fe8d8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 4px; letter-spacing: 0.02em;
    }
    .ov-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.3em; color: #64748b; margin-bottom: 20px; }
    .ov-body { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: #94a3b8; line-height: 2.05; margin-bottom: 24px; }
    .ov-body .hl { color: #f1f5f9; }
    .ov-body .pk { color: #ff5e8a; }
    .ov-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .ov-btn {
      background: linear-gradient(135deg, #ff5e8a, #e0447a); border: none; color: #fff;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: 0.22em; padding: 14px 26px;
      cursor: pointer; border-radius: 4px;
      transition: all 0.18s;
    }
    .ov-btn:hover { box-shadow: 0 0 30px rgba(255,94,138,0.4); }
    .ov-btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #94a3b8; }
    .ov-btn.ghost:hover { border-color: rgba(255,255,255,0.4); color: #f1f5f9; box-shadow: none; }

    .corner-btns {
      position: absolute; top: 52px; right: 14px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 70;
    }
    .cbtn {
      background: rgba(8,6,16,0.8);
      border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;
      color: #94a3b8;
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em;
      padding: 8px 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .cbtn:hover { color: #f1f5f9; border-color: rgba(255,94,138,0.5); }

    #touchUI { position: absolute; inset: 0; display: none; pointer-events: none; z-index: 50; }
    #joyZone { position: absolute; left: 0; bottom: 0; width: 45%; height: 60%; pointer-events: auto; }
    #joyBase {
      position: absolute; width: 112px; height: 112px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.06);
      display: none;
      transform: translate(-50%, -50%);
    }
    #joyNub {
      position: absolute; left: 50%; top: 50%;
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,94,138,0.55);
      border: 1.5px solid rgba(255,255,255,0.5);
      transform: translate(-50%, -50%);
    }
    .tbtn {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(8,6,16,0.6);
      color: #fff;
      font-family: var(--mono); font-weight: 700; letter-spacing: 0.1em;
      pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .tbtn:active, .tbtn.on { background: rgba(255,94,138,0.5); }
    #btnGas   { right: 18px;  bottom: 96px; width: 84px; height: 84px; font-size: 13px; display: none; }
    #btnBrake { right: 116px; bottom: 56px; width: 66px; height: 66px; font-size: 10px; display: none; }
    #btnJump  { right: 18px;  bottom: 96px; width: 84px; height: 84px; font-size: 12px; }
    #btnAct   { right: 116px; bottom: 130px; width: 64px; height: 64px; font-size: 10px; }
    #btnVeh   { right: 116px; bottom: 56px;  width: 64px; height: 64px; font-size: 10px; }
    #btnRadio { right: 30px;  bottom: 200px; width: 50px; height: 50px; font-size: 9px; display: none; }
  </style>
</head>
<body data-nofx>

<div class="page-wrap">
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div class="g-panel" id="hudObj" style="display:none">
      <div id="hudObjTitle">THE COURIER RUN</div>
      <div id="hudObjText"></div>
      <div id="hudObjSub"></div>
    </div>

    <div class="g-panel" id="hudClock" style="display:none"><span class="d" id="hudDayTag">DAY</span> <span id="hudClockVal">18:00</span></div>
    <div class="g-panel" id="hudHint"><span class="k" id="hudHintKey">[E]</span> <span id="hudHintText">TALK</span></div>
    <div class="g-panel" id="speedo"><span id="speedoVal">0</span> <span class="u">KM/H</span></div>
    <div id="minimapBox"><canvas id="minimap" width="150" height="150"></canvas></div>
    <div id="toastBox"></div>

    <div id="wayArrow" style="position:absolute; left:50%; top:50%; z-index:55; display:none; pointer-events:none; transform:translate(-50%,-50%);">
      <div id="wayChevron" style="font-family:var(--mono); font-size:30px; color:#ff5e8a; text-shadow:0 0 12px rgba(255,94,138,0.8), 0 2px 6px rgba(0,0,0,0.6); line-height:1;">&#10148;</div>
      <div id="wayDist" style="font-family:var(--mono); font-size:10px; letter-spacing:0.12em; color:#fff; text-align:center; margin-top:3px; text-shadow:0 1px 4px rgba(0,0,0,0.8);">--</div>
    </div>

    <div class="corner-btns">
      <button class="cbtn" id="btnFS">FULLSCREEN</button>
      <button class="cbtn" id="btnPause" style="display:none">PAUSE</button>
    </div>

    <div id="dlg">
      <div id="dlgSpeaker"></div>
      <div id="dlgText"></div>
      <div id="dlgOpts"></div>
    </div>

    <div id="touchUI">
      <div id="joyZone"><div id="joyBase"><div id="joyNub"></div></div></div>
      <button class="tbtn" id="btnJump">JUMP</button>
      <button class="tbtn" id="btnGas">GAS</button>
      <button class="tbtn" id="btnBrake">BRAKE</button>
      <button class="tbtn" id="btnAct">TALK</button>
      <button class="tbtn" id="btnVeh">RIDE</button>
      <button class="tbtn" id="btnRadio">FM</button>
    </div>

    <div class="g-panel" id="hudKeys" style="display:none; bottom: 14px; left: 14px; padding: 8px 13px; font-size: 9px; letter-spacing: 0.14em; color: #94a3b8;"></div>

    <div id="cineTop" style="position:absolute; left:0; right:0; top:0; height:0; background:#000; z-index:140; transition:height 0.8s ease;"></div>
    <div id="cineBot" style="position:absolute; left:0; right:0; bottom:0; height:0; background:#000; z-index:140; transition:height 0.8s ease;"></div>
    <div id="cineCard" style="position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); z-index:141; font-family:var(--mono); color:#fff; font-size:clamp(15px,3vw,25px); letter-spacing:0.2em; text-align:center; opacity:0; transition:opacity 0.7s; text-shadow:0 2px 24px rgba(0,0,0,0.65); pointer-events:none; width:90%;"></div>
    <button class="cbtn" id="btnSkip" style="position:absolute; bottom:18px; right:18px; z-index:142; display:none;">SKIP</button>

    <div id="bigOv"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="/static/os.js"></script>
<script>
(() => {
  'use strict';
  const wrap   = document.getElementById('gameWrap');
  const canvas = document.getElementById('gameCanvas');
  const el     = id => document.getElementById(id);
  const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  /* ════════ RENDERER — shadows + physically based pipeline ════════ */
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_TOUCH, powerPreference: 'high-performance' });
  } catch (e) {
    wrap.innerHTML = '<div class="g-panel" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:24px 30px;font-size:12px;color:#94a3b8">WEBGL UNAVAILABLE.</div>';
    return;
  }
  renderer.setPixelRatio(IS_TOUCH ? 1 : Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.92; // calmer sun — detail survives noon
  renderer.shadowMap.enabled = !IS_TOUCH;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7fc4f5);
  scene.fog = new THREE.FogExp2(0x7fc4f5, 0.0019);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 700);

  /* subtle bloom — sun, neon, headlights glow like a modern title (desktop only) */
  let composer = null;
  if (!IS_TOUCH && THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass && THREE.ShaderPass && THREE.GammaCorrectionShader) {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(800, 600), 0.45, 0.4, 0.85));
    composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  }

  function resize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    if (composer) composer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(resize);

  /* fullscreen / immersive */
  let immersive = false;
  el('btnFS').addEventListener('click', () => {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl && wrap.requestFullscreen) wrap.requestFullscreen().catch(() => toggleImmersive());
    else if (!fsEl && wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    else if (fsEl && document.exitFullscreen) document.exitFullscreen();
    else toggleImmersive();
    setTimeout(resize, 350);
  });
  function toggleImmersive() {
    immersive = !immersive;
    document.body.classList.toggle('immersive', immersive);
    el('btnFS').textContent = immersive ? 'EXIT FULL' : 'FULLSCREEN';
    setTimeout(resize, 50);
  }
  document.addEventListener('fullscreenchange', () => setTimeout(resize, 100));

  /* ════════ HELPERS ════════ */
  const dist2D = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function lerpAngle(a, b, t) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  }

  const shinyMats = [];   // envMapIntensity follows daylight
  const windowMats = [];  // emissive windows follow night

  function cnv(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }
  function tex(c, srgb) {
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (srgb) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    return t;
  }
  function texClone(t, rx, ry) {
    const k = t.clone();
    k.needsUpdate = true;
    k.repeat.set(rx, ry);
    return k;
  }

  function makeGlowTex() {
    const c = cnv(64, 64);
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,0.9)');
    gr.addColorStop(0.4, 'rgba(255,255,255,0.25)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = makeGlowTex();
  function makeGlow(color, scale) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.set(scale, scale, 1);
    return s;
  }
  function textSprite(text, color) {
    const c = cnv(256, 64);
    const g = c.getContext('2d');
    g.font = '700 26px "JetBrains Mono", monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = color; g.shadowColor = color; g.shadowBlur = 12;
    g.fillText(text, 128, 34);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    s.scale.set(6, 1.5, 1);
    return s;
  }
  function makeBlob(r) {
    // faint contact shadow even alongside the real shadow map — grounds the feet
    const b = new THREE.Mesh(new THREE.CircleGeometry(r, 14), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: IS_TOUCH ? 0.3 : 0.14, depthWrite: false }));
    b.rotation.x = -Math.PI / 2;
    b.position.y = 0.04;
    return b;
  }

  /* ════════ PROCEDURAL TEXTURES ════════ */
  function noiseCanvas(base, specks, n, w, h) {
    const c = cnv(w || 256, h || 256);
    const g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < n; i++) {
      g.fillStyle = specks[(Math.random() * specks.length) | 0];
      g.globalAlpha = 0.12 + Math.random() * 0.3;
      const s = 1 + Math.random() * 2.4;
      g.fillRect(Math.random() * c.width, Math.random() * c.height, s, s);
    }
    g.globalAlpha = 1;
    return c;
  }

  /* asphalt with lane wear + cracks */
  const asphaltC = noiseCanvas('#43464d', ['#2c2e33', '#55585f', '#393b40', '#606268'], 2600);
  {
    const g = asphaltC.getContext('2d');
    g.strokeStyle = 'rgba(20,20,22,0.35)';
    for (let i = 0; i < 7; i++) {
      g.lineWidth = 0.8 + Math.random();
      g.beginPath();
      let x = Math.random() * 256, y = Math.random() * 256;
      g.moveTo(x, y);
      for (let k = 0; k < 5; k++) { x += rand(-28, 28); y += rand(8, 30); g.lineTo(x, y); }
      g.stroke();
    }
  }
  const asphaltTex = tex(asphaltC, true);

  /* sidewalk concrete with expansion joints */
  const concreteC = noiseCanvas('#bcb8ac', ['#a8a499', '#cac6ba', '#b0aca0'], 1600);
  {
    const g = concreteC.getContext('2d');
    g.strokeStyle = 'rgba(70,68,60,0.4)'; g.lineWidth = 2;
    for (let i = 0; i <= 256; i += 64) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke();
      g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke();
    }
  }
  const concreteTex = tex(concreteC, true);

  const sandTex  = tex(noiseCanvas('#e3cf9e', ['#d6bf88', '#efe0b4', '#cbb37c'], 2200), true);
  const grassTex = tex(noiseCanvas('#6da75c', ['#578c47', '#7fbb6c', '#4e7f40'], 2600), true);

  /* water: color + rolling wave bump */
  const waterColorTex = tex(noiseCanvas('#2a96ac', ['#23869a', '#35a8be', '#1f7d90'], 900), true);
  const waveC = cnv(256, 256);
  {
    const g = waveC.getContext('2d');
    const d = g.createImageData(256, 256);
    for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
      const v = 128 + 60 * Math.sin(x * 0.10 + Math.sin(y * 0.07) * 2.4) * Math.sin(y * 0.085 + Math.sin(x * 0.05) * 1.8);
      const i = (y * 256 + x) * 4;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255;
    }
    g.putImageData(d, 0, 0);
  }
  const waveTex = tex(waveC, false);

  /* cloud puff */

  /* ── building facades: plaster & brick, with frames, sills, slabs, AC units ── */
  function facadeCanvases(style, wallHex) {
    const W = 256, H = 512;
    const c = cnv(W, H), e = cnv(W, H);
    const g = c.getContext('2d'), ge = e.getContext('2d');
    ge.fillStyle = '#000'; ge.fillRect(0, 0, W, H);

    if (style === 'brick') {
      g.fillStyle = '#cfc8bb'; g.fillRect(0, 0, W, H); // mortar
      const bw = 26, bh = 11;
      for (let y = 0; y < H; y += bh) {
        const off = (y / bh) % 2 ? bw / 2 : 0;
        for (let x = -bw; x < W; x += bw) {
          const jitter = (Math.random() - 0.5) * 14;
          g.fillStyle = `rgb(${168 + jitter | 0},${92 + jitter * 0.6 | 0},${70 + jitter * 0.5 | 0})`;
          g.fillRect(x + off + 1, y + 1, bw - 2, bh - 2);
        }
      }
    } else {
      g.fillStyle = wallHex; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(0,0,0,0.05)';
      for (let i = 0; i < 60; i++) g.fillRect(Math.random() * W, Math.random() * H, 2, rand(8, 40));
    }

    const floors = 8, cols = 4;
    const fH = H / floors;
    const winW = 38, winH = 32;
    for (let f = 0; f < floors; f++) {
      const fy = f * fH;
      /* floor slab shadow band */
      g.fillStyle = 'rgba(0,0,0,0.16)';
      g.fillRect(0, fy + fH - 5, W, 3);
      for (let cIdx = 0; cIdx < cols; cIdx++) {
        const wx = 14 + cIdx * ((W - 28) / cols) + ((W - 28) / cols - winW) / 2;
        const wy = fy + 12;
        /* frame */
        g.fillStyle = '#2c2f35';
        g.fillRect(wx - 3, wy - 3, winW + 6, winH + 6);
        /* glass with sky sheen */
        const gl = g.createLinearGradient(wx, wy, wx + winW, wy + winH);
        gl.addColorStop(0, '#5d7d9a'); gl.addColorStop(0.45, '#33495e'); gl.addColorStop(1, '#1f2d3c');
        g.fillStyle = gl;
        g.fillRect(wx, wy, winW, winH);
        g.fillStyle = 'rgba(255,255,255,0.20)';
        g.beginPath(); g.moveTo(wx, wy + winH * 0.55); g.lineTo(wx + winW * 0.5, wy); g.lineTo(wx + winW * 0.78, wy); g.lineTo(wx, wy + winH); g.closePath(); g.fill();
        /* mullion */
        g.fillStyle = '#2c2f35';
        g.fillRect(wx + winW / 2 - 1, wy, 2, winH);
        /* sill + shadow under it */
        g.fillStyle = '#ddd8ca';
        g.fillRect(wx - 5, wy + winH + 3, winW + 10, 4);
        g.fillStyle = 'rgba(0,0,0,0.25)';
        g.fillRect(wx - 5, wy + winH + 7, winW + 10, 2);
        /* the occasional AC unit */
        if (Math.random() < 0.12) {
          g.fillStyle = '#9aa0a6';
          g.fillRect(wx + 4, wy + winH + 8, 22, 12);
          g.fillStyle = '#70757a';

          ge.fillRect(wx, wy, winW, winH);
        }
      }
    }
    return { map: tex(c, true), emi: tex(e, true) };
  }

  /* ════════ ENVIRONMENT REFLECTIONS ════════ */
  {

  /* ════════ SHARED MATERIALS ════════ */
  const trimDark = new THREE.MeshStandardMaterial({ color: 0x16181d, roughness: 0.6, metalness: 0.3 });

  /* ════════ WORLD ════════ */

  let shopIdx = 0;

  /* open-air parking lots break the grid monotony; cars arrive after the builders exist */
  const parkingLots = [];
  function buildParkingLot(bx, bz) {

  const doorMat = new THREE.MeshStandardMaterial({ color: 0x3a2f22, roughness: 0.8 });
  const awningC = cnv(64, 32);
  {
    const g = awningC.getContext('2d');

  function boxFaces(side) { return [side, side, roofMat, roofMat, side, side]; }
  function mkFacadeMat(w, floors, glass, industrial) {

  function updateDayNight(dt) {
    dayT = (dayT + dt / DAY_LEN) % 1;
    const th = (dayT - 0.25) * Math.PI * 2;
    const elev = Math.sin(th);
    const sx = Math.cos(th);
    const dayF = Math.max(0, elev);
    sun.intensity = dayF * 1.12 + 0.04;
    const horiz = clamp(1 - Math.abs(elev) * 2.4, 0, 1);
    sun.color.setHex(0xfff2dd).lerp(new THREE.Color(0xff7a40), horiz);
    sunSprite.position.set(sx * 430, elev * 380 + 6, 60);
    sunSprite.material.opacity = clamp(elev * 3 + 0.2, 0, 1);
    sunSprite.scale.setScalar(80 + horiz * 70);

    moonSprite.position.set(-sx * 420, -elev * 360 + 30, -80);
    const nightF = clamp((0.05 - elev) * 5, 0, 1);
    moonSprite.material.opacity = nightF * 0.9;
    starMat.opacity = nightF * 0.85;
    hemiL.intensity = 0.28 + dayF * 0.42;
    skyAt(dayT);
    scene.background.copy(skyCol);
    scene.fog.color.copy(skyCol);
    hemiL.color.copy(skyCol).lerp(new THREE.Color(0xffffff), 0.45);
    windowMats.forEach(m => m.emissiveIntensity = 0.05 + nightF * 0.85);
    lampGlowMat.opacity = nightF;
    lampPoolMat.opacity = nightF * 0.85;
    carPoolMat.opacity = 0.06 + nightF * 0.6;
    shinyMats.forEach(m => m.envMapIntensity = 0.3 + dayF * 1.1);
    const sF = clamp(1 - Math.abs(dayT - 0.75) * 9, 0, 1);
    waterTmp.copy(waterDay).lerp(waterNight, nightF).lerp(waterSunset, sF * 0.45);
    waterMat.color.copy(waterTmp);
    cloudTmp.copy(cloudDay).lerp(cloudSunset, sF).lerp(cloudNight, nightF);
    cloudMat.color.copy(cloudTmp);
    cloudMat.opacity = 0.55 - nightF * 0.38;
    const hrs = Math.floor(dayT * 24), mins = Math.floor((dayT * 24 % 1) * 60);
    el('hudClockVal').textContent = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
    el('hudDayTag').textContent = nightF > 0.5 ? 'NIGHT' : (sF > 0.3 ? 'SUNSET' : 'DAY');

      s.lineTo(-2.32, 0.3);
      s.lineTo(2.36, 0.3);
    } else {
      s.moveTo(2.36, 0.3);
      s.quadraticCurveTo(2.46, 0.55, 2.36, 0.78);
      s.quadraticCurveTo(2.1, 0.94, 1.7, 0.94);
      s.lineTo(1.12, 0.98);
      s.quadraticCurveTo(0.78, 1.04, 0.5, 1.42);
      s.quadraticCurveTo(0.3, 1.52, -0.1, 1.52);
      s.quadraticCurveTo(-0.5, 1.5, -0.78, 1.18);
      s.quadraticCurveTo(-0.95, 1.0, -1.3, 0.98);
      s.lineTo(-2.1, 0.94);
      s.quadraticCurveTo(-2.44, 0.86, -2.4, 0.55);
      s.lineTo(-2.34, 0.3);
      s.lineTo(2.36, 0.3);
    }
    const geo = new THREE.ExtrudeGeometry(s, { depth: 1.78, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.14, bevelSegments: 3, steps: 1 });
    geo.rotateY(-Math.PI / 2);
    geo.computeBoundingBox();
    const bb = geo.boundingBox;
    geo.translate(-(bb.min.x + bb.max.x) / 2, 0, 0);
    geo.computeVertexNormals();
    return geo;

  function spawnSparks(x, y, z, power) {
    let want = Math.min(16, 5 + (power * 12 | 0)), got = 0;
    for (const p of sparks) {
      if (got >= want) break;
      if (p.life > 0) continue;
      p.life = 0.3 + Math.random() * 0.3;
      const a = Math.random() * 6.28, sp = 2 + Math.random() * 5;
      p.vx = Math.cos(a) * sp; p.vz = Math.sin(a) * sp; p.vy = 2 + Math.random() * 5;
      p.spr.visible = true; p.spr.position.set(x, y, z); p.spr.material.opacity = 1;
      got++;
    }
  }
  const smokes = [];
  for (let i = 0; i < 34; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x3a3a3a, transparent: true, depthWrite: false, opacity: 0 }));
    s.visible = false; scene.add(s);
    smokes.push({ spr: s, life: 0, vy: 0, size: 1 });
  }
  function spawnSmoke(x, y, z, dark) {
    for (const p of smokes) {
      if (p.life > 0) continue;
      p.life = 1.3 + Math.random() * 0.9; p.vy = 1.1 + Math.random();
      p.size = 1 + Math.random() * 0.8;
      p.spr.visible = true; p.spr.position.set(x, y, z);
      p.spr.material.color.setHex(dark ? 0x1c1c1c : 0x555555);
      p.spr.material.opacity = 0.5; p.spr.scale.set(p.size, p.size, 1);

    }
  }
  function updateFX(dt) {
    for (const p of sparks) {
      if (p.life <= 0) continue;
      p.life -= dt; p.vy -= 15 * dt;
      p.spr.position.x += p.vx * dt; p.spr.position.y += p.vy * dt; p.spr.position.z += p.vz * dt;
      if (p.spr.position.y < 0.1) { p.spr.position.y = 0.1; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; }
      p.spr.material.opacity = Math.max(0, p.life / 0.35);
      if (p.life <= 0) p.spr.visible = false;
    }
    for (const p of smokes) {
      if (p.life <= 0) continue;
      p.life -= dt; p.vy *= (1 - 0.4 * dt);
      p.spr.position.y += p.vy * dt;
      const sc = p.size + (2.2 - p.life) * 1.6;
      p.spr.scale.set(sc, sc, 1);
      p.spr.material.opacity = Math.max(0, p.life * 0.32);
      if (p.life <= 0) p.spr.visible = false;
    }
  }

    const c = v.mesh.userData.crash;

    if (c.damage > 0.5) c.hl.visible = false;
    if (c.damage > 0.85) c.hr.visible = false;

        spawnSparks(tc.mesh.position.x, 0.6, tc.mesh.position.z, power * 0.4);
      }
    });

  /* ════════ AUDIO ════════ */
  let AC = null, engineOsc = null, engineGain = null, radioOn = false, radioGain = null, radioStep = 0, radioNext = 0;
  function audioInit() {
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const len = 2 * AC.sampleRate;
      const buf = AC.createBuffer(1, len, AC.sampleRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      const noise = AC.createBufferSource();
      noise.buffer = buf; noise.loop = true;
      const lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 420;
      const og = AC.createGain(); og.gain.value = 0.012;
      const lfo = AC.createOscillator(); lfo.frequency.value = 0.09;
      const lfoG = AC.createGain(); lfoG.gain.value = 0.007;
      lfo.connect(lfoG); lfoG.connect(og.gain);
      noise.connect(lp); lp.connect(og); og.connect(AC.destination);
      noise.start(); lfo.start();
      engineOsc = AC.createOscillator();
      engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 50;
      const elp = AC.createBiquadFilter();
      elp.type = 'lowpass'; elp.frequency.value = 340;
      engineGain = AC.createGain(); engineGain.gain.value = 0;
      engineOsc.connect(elp); elp.connect(engineGain); engineGain.connect(AC.destination);
      engineOsc.start();
      radioGain = AC.createGain(); radioGain.gain.value = 0;
      radioGain.connect(AC.destination);
      radioNext = AC.currentTime + 0.1;
    } catch (e) { AC = null; }
  }
  function beep(f, d, type, g) {
    if (!AC) return;
    try {
      const o = AC.createOscillator(), gn = AC.createGain();
      o.type = type || 'square'; o.frequency.value = f;
      gn.gain.setValueAtTime(g || 0.04, AC.currentTime);
      gn.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (d || 0.09));
      o.connect(gn); gn.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + (d || 0.09) + 0.02);
    } catch (e) {}
  }
  const sfxPickup = () => { beep(660, 0.07); setTimeout(() => beep(990, 0.07), 80); setTimeout(() => beep(1320, 0.1), 160); };
  const sfxBlip   = () => beep(880, 0.05, 'square', 0.025);
  const sfxThud   = () => beep(120, 0.18, 'sawtooth', 0.05);
  const sfxCrash  = (p) => { beep(80 + Math.random() * 30, 0.32, 'sawtooth', 0.07); setTimeout(() => beep(170, 0.16, 'square', 0.05), 40); if (p > 0.5) setTimeout(() => beep(240, 0.1, 'square', 0.03), 90); };
  let gullT = 8;
  function gull() { beep(1380, 0.12, 'sine', 0.018); setTimeout(() => beep(1050, 0.16, 'sine', 0.015), 140); }

  const BASS = [55, 55, 110, 55, 65.4, 65.4, 130.8, 65.4, 43.65, 43.65, 87.3, 43.65, 49, 49, 98, 98];
  const ARP  = [220, 261.6, 329.6, 440, 523.2, 440, 329.6, 261.6, 174.6, 220, 261.6, 349.2, 196, 246.9, 293.7, 392];
  const STEP = 0.155;
  function radioTick() {
    if (!AC || !radioOn) return;
    while (radioNext < AC.currentTime + 0.18) {
      const s = radioStep % 16;
      try {
        const b = AC.createOscillator(), bg = AC.createGain(), bf = AC.createBiquadFilter();
        b.type = 'sawtooth'; b.frequency.value = BASS[s];
        bf.type = 'lowpass'; bf.frequency.value = 300;
        bg.gain.setValueAtTime(0.05, radioNext);
        bg.gain.exponentialRampToValueAtTime(0.001, radioNext + STEP * 0.9);
        b.connect(bf); bf.connect(bg); bg.connect(radioGain);
        b.start(radioNext); b.stop(radioNext + STEP);
        if (s % 2 === 0) {
          const a = AC.createOscillator(), ag = AC.createGain();
          a.type = 'square'; a.frequency.value = ARP[s];
          ag.gain.setValueAtTime(0.016, radioNext);
          ag.gain.exponentialRampToValueAtTime(0.001, radioNext + STEP * 0.7);
          a.connect(ag); ag.connect(radioGain);
          a.start(radioNext); a.stop(radioNext + STEP);
        }
      } catch (e) {}
      radioNext += STEP;
      radioStep++;
    }
  }
  function toggleRadio() {
    if (!AC) return;
    radioOn = !radioOn;
    radioGain.gain.value = radioOn ? 0.9 : 0;
    if (radioOn) radioNext = AC.currentTime + 0.05;
    toast('SYNTHRIDER FM', radioOn ? 'NOW PLAYING — MIDNIGHT MIRAGE' : 'RADIO OFF');
    el('btnRadio').classList.toggle('on', radioOn);
  }

  el('dlgOpts').addEventListener('click', e => {
    const o = e.target.closest('.dlg-opt');
    if (o && dlgOptions) {
      const opt = dlgOptions.find(x => String(x.n) === o.dataset.n);
      if (opt) opt.fn();
    }
  });
  const dialogOpen = () => dlgOptions !== null;

  let overlayOpen = false, pauseShown = false;
  function showOverlay(cfg) {
    overlayOpen = true;
    const btns = cfg.buttons.map((b, i) => `<button class="ov-btn ${b.ghost ? 'ghost' : ''}" data-b="${i}">${b.label}</button>`).join('');
    el('bigOv').innerHTML = `
      <div class="ov-box">
        ${cfg.eyebrow ? `<div class="ov-eyebrow">${cfg.eyebrow}</div>` : ''}
        ${cfg.title ? `<div class="ov-title">${cfg.title}</div>` : ''}
        ${cfg.sub ? `<div class="ov-sub">${cfg.sub}</div>` : ''}
        <div class="ov-body">${cfg.body}</div>
        <div class="ov-btns">${btns}</div>
      </div>`;
    el('bigOv').style.display = 'flex';
    el('bigOv').querySelectorAll('.ov-btn').forEach(btn => {
      btn.addEventListener('click', () => cfg.buttons[+btn.dataset.b].fn());
    });
  }
  function hideOverlay() { overlayOpen = false; pauseShown = false; el('bigOv').style.display = 'none'; }

  /* ════════ MISSION + SAVE ════════ */
  const SAVE_KEY = 'fly_save_v1';
  function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
  function save(data) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {} }
  let saveData = loadSave();

  /* states: idle | drive,talk,chase,pickup,return (acts I & II) | a3_drive,a3_grab,a3_escape | done */
  let mState = 'idle', missionStart = 0, curAct = 1, a3Timer = 0, intercomDone = false;

  function resetMissionEntities() {
    stopHunt(true);
    thiefCar.visible = false;
    enforcerCar.visible = false;
    pursuers.forEach(pu => { pu.active = false; pu.mesh.visible = false; });
    pkg.visible = false;
    a3Timer = 0; intercomDone = false;
    setBeacon(0, 0, false);
  }

  function showKeysStrip() {
    if (IS_TOUCH) return;
    const hk = el('hudKeys');
    hk.textContent = 'WASD MOVE · SHIFT RUN · F VEHICLE · E INTERACT · ESC PAUSE';
    hk.style.display = 'block';
    setTimeout(() => { hk.style.display = 'none'; }, 45000);
  }

  function startAct(n) {
    resetMissionEntities();
    curAct = n;
    missionStart = performance.now();
    if (n === 1) {
      mState = 'drive';
      el('hudObjTitle').textContent = 'ACT I — THE COURIER RUN';
      setObjective('DRIVE TO THE DOCKS', 'RICO IS WAITING BY THE CRATES — FOLLOW THE PINK BEACON');
      toast('ACT I', 'A PACKAGE WAS STOLEN. GET IT BACK.');
      showKeysStrip();
    } else if (n === 2) {
      mState = 'drive';
      el('hudObjTitle').textContent = 'ACT II — THE INFORMANT';
      setObjective('DRIVE TO LA GAVIOTA', 'MARISOL TENDS BAR ON THE MARINA BOARDWALK, SOUTH SIDE');
      toast('ACT II', 'THE THIEF WAS HIRED. FIND OUT BY WHOM.');
    } else {
      mState = 'a3_drive';
      el('hudObjTitle').textContent = 'ACT III — THE MASTER TAPE';
      setObjective('GO TO DELGADO TOWER', 'EASTSIDE — THE GLASS MONOLITH WITH HIS NAME ON IT');
      toast('ACT III', 'IBARRA&rsquo;S LAST RECORDING IS IN THAT TOWER.');
    }
  }
  const startMission = () => startAct(saveData.act && saveData.act <= 3 ? saveData.act : 1);

  /* ── opening cinematic + controls card ── */
  let cine = false, cineT = 0;
  function startCinematic() {
    cine = true; cineT = 0;
    el('cineTop').style.height = el('cineBot').style.height = '11%';
    el('btnSkip').style.display = 'block';
    cineCards();
  }
  async function cineCards() {
    const card = el('cineCard');
    const show = async (txt, hold) => {
      if (!cine) return;
      card.textContent = txt;
      card.style.opacity = 1;
      await sleep(hold);
      card.style.opacity = 0;
      await sleep(650);
    };
    await sleep(500);
    await show('COSTA VISTA — 1986', 2200);
    await show('ONE PROTOTYPE SYNTH CHIP. ONE OF A KIND.', 2100);
    await show('STOLEN TONIGHT. YOUR FRIEND NEEDS YOU.', 2300);
  }
  function endCine() {
    if (!cine) return;
    cine = false;
    el('cineTop').style.height = el('cineBot').style.height = '0';
    el('cineCard').style.opacity = 0;
    el('btnSkip').style.display = 'none';
    showControlsCard();
  }
  el('btnSkip').addEventListener('click', endCine);
  function showControlsCard(toMenu) {
    if (toMenu) { showControlsMenuVariant(); return; }
    showOverlay({
      eyebrow: '// HOW TO PLAY', title: 'CONTROLS',
      body: IS_TOUCH
        ? 'LEFT THUMB — <span class="hl">MOVE & STEER</span><br/>RIGHT BUTTONS — <span class="hl">JUMP / GAS / BRAKE / TALK / RIDE</span><br/>DRAG EMPTY SPACE — <span class="hl">CAMERA</span><br/><br/>FOLLOW THE <span class="pk">PINK BEACON</span>. IT ALWAYS MARKS YOUR GOAL.'
        : 'WASD / ARROWS — <span class="hl">MOVE & DRIVE</span> &nbsp;&middot;&nbsp; SHIFT — <span class="hl">RUN</span><br/>F — <span class="hl">ENTER / EXIT VEHICLE</span> &nbsp;&middot;&nbsp; E — <span class="hl">TALK / PICK UP</span><br/>SPACE — <span class="hl">JUMP / HANDBRAKE</span> &nbsp;&middot;&nbsp; R — <span class="hl">RADIO IN CAR</span><br/>MOUSE DRAG — <span class="hl">CAMERA</span> &nbsp;&middot;&nbsp; WHEEL — <span class="hl">ZOOM</span><br/><br/>FOLLOW THE <span class="pk">PINK BEACON</span>. IT ALWAYS MARKS YOUR GOAL.',
      buttons: [{ label: "LET'S GO", fn: () => { hideOverlay(); startMission(); } }],
    });
  }
  function showControlsMenuVariant() {
    showOverlay({
      eyebrow: '// HOW TO PLAY', title: 'CONTROLS',
      body: IS_TOUCH
        ? 'LEFT THUMB — <span class="hl">MOVE & STEER</span><br/>RIGHT BUTTONS — <span class="hl">JUMP / GAS / BRAKE / TALK / RIDE</span><br/>DRAG EMPTY SPACE — <span class="hl">CAMERA</span>'
        : 'WASD / ARROWS — <span class="hl">MOVE & DRIVE</span> &nbsp;&middot;&nbsp; SHIFT — <span class="hl">RUN</span><br/>F — <span class="hl">VEHICLE</span> &nbsp;&middot;&nbsp; E — <span class="hl">TALK / PICK UP</span> &nbsp;&middot;&nbsp; SPACE — <span class="hl">JUMP / HANDBRAKE</span><br/>R — <span class="hl">RADIO</span> &nbsp;&middot;&nbsp; MOUSE — <span class="hl">CAMERA</span> &nbsp;&middot;&nbsp; ESC — <span class="hl">PAUSE</span>',
      buttons: [{ label: 'BACK', fn: () => { hideOverlay(); showTitleMenu(); } }],
    });
  }

  /* ── the game shell: title menu ── */
  function showTitleMenu() {
    resetMissionEntities();
    mState = 'idle';
    el('hudObj').style.display = 'none';
    el('hudClock').style.display = 'none';
    el('minimapBox').style.display = 'none';
    el('btnPause').style.display = 'none';
    const act = saveData.act || (saveData.done ? 2 : 1);
    saveData.act = act;
    const storyLabel = act > 3 ? 'REPLAY STORY' : (act > 1 ? `CONTINUE — ACT ${['', 'I', 'II', 'III'][act]}` : 'STORY MODE');
    showOverlay({
      eyebrow: '// FUNFLIX PRESENTS', title: 'FLY', sub: 'COSTA VISTA — 1986',
      body: `Your mentor, <span class="hl">Maestro Ibarra</span>, built one perfect synthesizer chip — then vanished.<br/>Tonight it resurfaced on Rico&rsquo;s dock... and so did the people who took him.<br/><br/><span class="pk">A story in three acts</span>, an open city, and a sea that drinks the sun.${IS_TOUCH ? '<br/><br/>TOUCH CONTROLS READY.' : ''}`,
      buttons: [
        { label: storyLabel, fn: () => {
            audioInit(); hideOverlay();
            if (act > 3) { saveData.act = 1; save(saveData); curAct = 1; startCinematic(); }
            else if (act === 1) startCinematic();
            else startAct(act);
          } },
        ...(act > 1 ? [{ label: 'FREE ROAM', fn: () => { audioInit(); hideOverlay(); startFreeRoam(); } }] : []),
        { label: 'CONTROLS', fn: () => showControlsCard(true) },
        { label: 'QUIT', fn: () => { document.body.classList.add('fade-out'); setTimeout(() => location.href = '/', 180); }, ghost: true },
      ],
    });
  }
  function startFreeRoam() {
    resetMissionEntities();
    mState = 'done';
    el('hudObjTitle').textContent = 'COSTA VISTA';
    setObjective('FREE ROAM', 'THE CITY IS YOURS.');
  }

  /* ── Act I & III: Rico ── */
  function ricoTalk() {
    if (curAct === 1 && (mState === 'drive' || mState === 'talk')) {
      mState = 'talk';
      openDialog('RICO — DOCK FOREMAN', '“There you are. Some clown in a maroon coupe lifted the package — a prototype synth chip. Maestro Ibarra&rsquo;s work. Your teacher&rsquo;s work. Run him down and bring it home.”', [
        { n: 1, label: 'FOR IBARRA.', fn: () => { closeDialog(); beginChase(); } },
      ]);
    } else if (curAct === 1 && mState === 'return') {
      openDialog('RICO — DOCK FOREMAN', '“You got it. But look at the casing — this is a copy. Somebody paid that clown to steal a FAKE. Which means someone wanted us looking the wrong way. Ask Marisol at La Gaviota. She hears everything.”', [
        { n: 1, label: 'I&rsquo;LL FIND HER.', fn: () => { closeDialog(); actComplete(1); } },
      ]);
    } else if (curAct === 3 && mState === 'a3_escape') {
      openDialog('RICO — DOCK FOREMAN', '“The master tape... Ibarra&rsquo;s last record. Delgado wanted to bury it behind his label forever. Tomorrow we press it free — every radio in Costa Vista plays it at dawn. You did right by the old man.”', [
        { n: 1, label: 'FOR IBARRA.', fn: () => { closeDialog(); gameComplete(); } },
      ]);
    } else {
      openDialog('RICO — DOCK FOREMAN', mState === 'chase' ? '“He is still out there — go!”' : '“Enjoy the sunset, friend.”', [
        { n: 1, label: 'LATER.', fn: closeDialog },
      ]);
    }
  }

  /* ── Act II: Marisol ── */
  function marisolTalk() {
    if (curAct === 2 && (mState === 'drive' || mState === 'talk')) {
      mState = 'talk';
      openDialog('MARISOL — LA GAVIOTA', '“The coupe? Hired by Delgado&rsquo;s fixer. Black coupe, runs the north heights every night carrying the boss&rsquo;s books. Ibarra refused to sell Delgado his music — then he vanished. Knock that ledger loose and we&rsquo;ll know where the real chip sleeps.”', [
        { n: 1, label: 'CONSIDER IT DONE.', fn: () => { closeDialog(); beginChase(); } },
      ]);
    } else if (curAct === 2 && mState === 'return') {
      openDialog('MARISOL — LA GAVIOTA', '“Let me see... &lsquo;IBARRA — TOWER STORAGE B.&rsquo; The master tape. Everything he ever was, locked in Delgado&rsquo;s tower. Go get him back, corredor.”', [
        { n: 1, label: 'TOWER. TONIGHT.', fn: () => { closeDialog(); actComplete(2); } },
      ]);
    } else {
      openDialog('MARISOL — LA GAVIOTA', '“The sea keeps secrets better than I do.”', [
        { n: 1, label: 'LATER.', fn: closeDialog },
      ]);
    }
  }

  function beginChase() {
    mState = 'chase';
    if (curAct === 1) {
      startHunt(thiefCar, THIEF_LOOP, 17, -54, 60, bustHunt);
      setObjective('CHASE THE MAROON COUPE', 'RAM IT OR RIDE ITS BUMPER TO FORCE IT TO STOP');
      toast('CHASE', 'THE COUPE IS ON THE BEACH ROAD.');
    } else {
      startHunt(enforcerCar, NORTH_LOOP, 19, -54, -90, bustHunt);
      setObjective('TAKE DOWN THE BLACK COUPE', 'IT RUNS THE NORTH HEIGHTS RING — FASTER THAN THE LAST ONE');
      toast('CHASE', 'THE FIXER&rsquo;S CAR IS IN THE HEIGHTS.');
    }
  }

  function bustHunt() {
    stopHunt(false);
    sfxThud(); setTimeout(sfxPickup, 250);
    pkg.position.set(hunt.car.position.x + 2.2, 0, hunt.car.position.z);
    pkg.visible = true;
    mState = 'pickup';
    setObjective(curAct === 1 ? 'RECOVER THE PACKAGE' : 'GRAB THE LEDGER', 'WALK OVER WHAT THE DRIVER DROPPED');
    toast('GOT HIM', curAct === 1 ? 'THE COUPE STALLED. GRAB THE PACKAGE.' : 'THE FIXER BAILED. TAKE THE LEDGER.');
  }

  function pickupPkg() {
    pkg.visible = false;
    sfxPickup();
    mState = 'return';
    if (curAct === 1) {
      setObjective('RETURN TO RICO', 'BRING THE PACKAGE BACK TO THE DOCKS');
      toast('PACKAGE SECURED', 'RICO IS WAITING.');
      setTimeout(() => {
        if (mState === 'return' && curAct === 1) {
          sfxBlip();
          openDialog('RICO — ON THE RADIO', '“Heads up — the coupe&rsquo;s crew is circling the docks looking for you. Bring it home in one piece, friend.”', [
            { n: 1, label: 'COPY THAT.', fn: closeDialog },
          ]);
        }
      }, 1600);
    } else {
      setObjective('BACK TO MARISOL', 'SHE CAN READ THE FIXER&rsquo;S SHORTHAND');
      toast('LEDGER SECURED', 'LA GAVIOTA, SOUTH MARINA.');
    }
  }

  /* ── Act III beats ── */
  function towerIntercom() {
    intercomDone = true;
    openDialog('DELGADO — INTERCOM', '“The courier. I own every note in this city — the charts, the airwaves, even silence. Ibarra understood that too late. Walk away, and I&rsquo;ll let you keep your little sunset.”', [
      { n: 1, label: 'OPEN THE DOOR, DELGADO.', fn: () => {
        closeDialog();
        mState = 'a3_grab';
        a3Timer = 90;
        pursuers.forEach((pu, i) => {
          pu.active = true; pu.mesh.visible = true;
          pu.mesh.position.set(TOWER.x - 18 + i * 36, 0, TOWER.z);
          pu.heading = 0;
        });
        setObjective('REACH STORAGE B — BEHIND THE TOWER', 'HIS CREW IS COMING. THE CLOCK IS RUNNING.');
        toast('ALARM RAISED', 'TWO CARS ON YOUR TAIL. MOVE.');
      } },
    ]);
  }
  function grabTape() {
    sfxPickup();
    mState = 'a3_escape';
    setObjective('ESCAPE TO THE DOCKS', 'LOSE THEM OR OUTRUN THEM — RICO IS WAITING');
    toast('MASTER TAPE SECURED', 'IBARRA&rsquo;S LAST RECORD. GO. GO. GO.');
  }
  function failAct3() {
    toast('TOO SLOW', 'HIS CREW SEALED THE STORAGE. CIRCLE BACK.');
    sfxThud();
    pursuers.forEach(pu => { pu.active = false; pu.mesh.visible = false; });
    intercomDone = false;
    mState = 'a3_drive';
    setObjective('GO TO DELGADO TOWER', 'SHAKE THEM OFF AND TRY AGAIN');
  }

  function actComplete(n) {
    const secs = Math.floor((performance.now() - missionStart) / 1000);
    saveData.act = n + 1;
    save(saveData);
    resetMissionEntities();
    mState = 'idle';
    const acts = {
      1: { t: 'ACT I COMPLETE', s: 'THE FAKE', b: 'The chip was a decoy — someone wanted eyes off the real prize.<br/>Marisol pours answers at La Gaviota, down on the marina.' },
      2: { t: 'ACT II COMPLETE', s: 'THE LEDGER', b: 'One line in the fixer&rsquo;s book: <span class="hl">IBARRA — TOWER STORAGE B.</span><br/>Your mentor&rsquo;s last master tape, locked in Delgado&rsquo;s monolith.' },
    };
    const a = acts[n];
    showOverlay({
      eyebrow: '// ' + a.t, title: a.s, sub: `CLEARED IN ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')} — PROGRESS SAVED`,
      body: a.b,
      buttons: [
        { label: `BEGIN ACT ${n + 1 === 2 ? 'II' : 'III'}`, fn: () => { hideOverlay(); startAct(n + 1); } },
        { label: 'FREE ROAM', fn: () => { hideOverlay(); startFreeRoam(); }, ghost: true },
      ],
    });
  }

  function gameComplete() {
    const secs = Math.floor((performance.now() - missionStart) / 1000);
    saveData.act = 4; saveData.done = true;
    save(saveData);
    resetMissionEntities();
    mState = 'done';
    showOverlay({
      eyebrow: '// STORY COMPLETE', title: 'FOR IBARRA', sub: 'COSTA VISTA — SAVED TO THIS BROWSER',
      body: `Dawn. Every radio on the strip plays a chord nobody has heard before —<br/>your mentor&rsquo;s voice, free of Delgado forever.<br/><br/>ACT III — <span class="hl">${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</span><br/><br/><span class="pk">THE CITY IS YOURS. FREE ROAM FOREVER.</span>`,
      buttons: [
        { label: 'FREE ROAM', fn: () => { hideOverlay(); startFreeRoam(); } },
        { label: 'MAIN MENU', fn: () => { hideOverlay(); showTitleMenu(); }, ghost: true },
      ],
    });
  }

  /* ════════ INPUT ════════ */
  const keys = new Set();
  const pad = { mx: 0, my: 0, gas: false, brake: false };
  let camYaw = Math.PI, camPitch = 0.46, camDist = 11, camDistT = 11;
  let dragging = false, lastMX = 0, lastMY = 0;

  canvas.addEventListener('mousedown', e => { dragging = true; lastMX = e.clientX; lastMY = e.clientY; });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    camYaw -= (e.clientX - lastMX) * 0.005;
    camPitch = clamp(camPitch + (e.clientY - lastMY) * 0.004, 0.18, 1.05);
    lastMX = e.clientX; lastMY = e.clientY;
  });
  canvas.addEventListener('wheel', e => { camDistT = clamp(camDistT + e.deltaY * 0.012, 7, 22); }, { passive: true });

  function doAction() {
    if (dialogOpen()) return;
    const it = nearestInteract();
    if (it) it.act();
  }
  function doVehicle() {
    if (dialogOpen() || overlayOpen) return;
    if (currentV) exitVehicle();
    else {
      let best = null, bd = 5.5;
      vehicles.forEach(v => {
        const d = dist2D(player.position, v.mesh.position);
        if (d < bd) { bd = d; best = v; }
      });
      if (best) enterVehicle(best);
    }
  }
  function doJump() {
    if (currentV || dialogOpen() || overlayOpen) return;
    if (onGround) { vy = 8.6; onGround = false; }
  }

  function enterVehicle(v) {
    currentV = v;
    camDistT = v.kind === 'bike' ? 13 : 16;
    if (v.kind !== 'bike') player.visible = false;
    el('speedo').style.display = 'block';
    el('btnRadio').style.display = IS_TOUCH ? 'flex' : 'none';
    setTouchMode();
    toast(v.name, 'PRESS F TO EXIT' + (IS_TOUCH ? ' — USE GAS / BRAKE' : ''));
    sfxBlip();
  }
  function exitVehicle() {
    const v = currentV;
    currentV = null;
    const side = new THREE.Vector3(Math.cos(v.heading), 0, -Math.sin(v.heading));
    let ex = v.mesh.position.x + side.x * 2.4, ez = v.mesh.position.z + side.z * 2.4;
    if (hitsBuilding(ex, ez, 0.7)) { ex = v.mesh.position.x - side.x * 2.4; ez = v.mesh.position.z - side.z * 2.4; }
    player.position.set(clamp(ex, BOUND_X[0], BOUND_X[1]), 0, clamp(ez, BOUND_Z[0], BOUND_Z[1]));
    py = 0; vy = 0; onGround = true;
    player.rotation.y = 0;
    playerInner.rotation.y = v.heading;
    player.visible = true;
    camDistT = 11;
    if (engineGain) engineGain.gain.value = 0;
    el('speedo').style.display = 'none';
    el('btnRadio').style.display = 'none';
    setTouchMode();
    sfxBlip();
  }

  document.addEventListener('keydown', e => {
    if (window.OS && OS.paletteOpen) return;
    if (e.target.closest('input, select, textarea')) return;
    audioInit();
    if (cine) {
      if (e.code === 'Enter' || e.code === 'Space' || e.code === 'Escape') endCine();
      return;
    }
    if (e.code === 'Escape') {
      if (dialogOpen()) { closeDialog(); return; }
      if (mState !== 'idle') {
        if (pauseShown) hideOverlay();
        else if (!overlayOpen) showPause();
      }
      return;
    }
    if (dialogOpen()) {
      const opt = dlgOptions.find(o => String(o.n) === e.key);
      if (opt) opt.fn();
      return;
    }
    if (overlayOpen) return;
    if (e.code === 'KeyE') { doAction(); return; }
    if (e.code === 'KeyF') { doVehicle(); return; }
    if (e.code === 'KeyR') { if (currentV) toggleRadio(); return; }
    if (e.code === 'Space') { e.preventDefault(); doJump(); }
    keys.add(e.code);
  });
  document.addEventListener('keyup', e => keys.delete(e.code));
  window.addEventListener('blur', () => keys.clear());

  function showPause() {
    pauseShown = true;
    showOverlay({
      eyebrow: '// PAUSED', title: 'COSTA VISTA',
      body: (IS_TOUCH
        ? 'LEFT THUMB — MOVE / STEER<br/>RIGHT BUTTONS — JUMP, GAS, BRAKE, TALK, RIDE<br/>DRAG EMPTY SPACE — CAMERA'
        : 'WASD — MOVE / DRIVE &nbsp;&middot;&nbsp; SHIFT — RUN &nbsp;&middot;&nbsp; SPACE — JUMP<br/>F — VEHICLE &nbsp;&middot;&nbsp; E — TALK / PICKUP &nbsp;&middot;&nbsp; R — RADIO (IN CAR)<br/>MOUSE DRAG — CAMERA &nbsp;&middot;&nbsp; WHEEL — ZOOM')
        + '<br/><br/>PROGRESS SAVES TO THIS BROWSER AUTOMATICALLY.',
      buttons: [
        { label: 'RESUME', fn: hideOverlay },
        ...(mState !== 'done' && mState !== 'idle' ? [{ label: 'RESTART ACT', fn: () => { hideOverlay(); startAct(curAct); } }] : []),
        { label: 'MAIN MENU', fn: () => { hideOverlay(); showTitleMenu(); } },
        { label: 'QUIT GAME', fn: () => { document.body.classList.add('fade-out'); setTimeout(() => location.href = '/', 180); }, ghost: true },
      ],
    });
  }
  el('btnPause').addEventListener('click', () => { if (!overlayOpen) showPause(); });

  /* touch controls */
  let joyId = null, joyBaseX = 0, joyBaseY = 0, camId = null, camLX = 0, camLY = 0;
  if (IS_TOUCH) {
    el('touchUI').style.display = 'block';
    const joyZone = el('joyZone'), joyBase = el('joyBase'), joyNub = el('joyNub');
    joyZone.addEventListener('touchstart', e => {
      e.preventDefault();
      audioInit();
      const t = e.changedTouches[0];
      joyId = t.identifier;
      const r = wrap.getBoundingClientRect();
      joyBaseX = t.clientX - r.left; joyBaseY = t.clientY - r.top;
      joyBase.style.display = 'block';
      joyBase.style.left = joyBaseX + 'px';
      joyBase.style.top = joyBaseY + 'px';
      joyNub.style.left = '50%'; joyNub.style.top = '50%';
    }, { passive: false });
    joyZone.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier !== joyId) continue;
        const r = wrap.getBoundingClientRect();
        let dx = (t.clientX - r.left) - joyBaseX, dy = (t.clientY - r.top) - joyBaseY;
        const m = Math.hypot(dx, dy), MAX = 44;
        if (m > MAX) { dx = dx / m * MAX; dy = dy / m * MAX; }
        pad.mx = dx / MAX; pad.my = -dy / MAX;
        joyNub.style.left = `calc(50% + ${dx}px)`;

    const joyEnd = e => {

    bindHold('btnBrake', () => pad.brake = true, () => pad.brake = false);
    bindHold('btnJump',  () => doJump());

  }
  function setTouchMode() {
    if (!IS_TOUCH) return;
