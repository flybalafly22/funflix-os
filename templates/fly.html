<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>FLY — COSTA VISTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/os.css">
  <style>
    html, body { height: 100vh; height: 100dvh; overflow: hidden; }

    #gameWrap {
      position: relative;
      flex: 1; min-height: 0;
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
      background: #0b0a08;
    }
    #gameCanvas { position: absolute; inset: 0; display: block; }

    body.immersive .hud, body.immersive .statusbar { display: none !important; }
    body.immersive #gameWrap { position: fixed; inset: 0; z-index: 120; }

    .g-panel {
      position: absolute;
      background: rgba(8,6,16,0.78);
      border: 1px solid rgba(255,94,138,0.35);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      font-family: var(--mono);
      pointer-events: none;
      border-radius: 4px;
      color: #f1f5f9;
    }

    #hudObj { top: 14px; left: 14px; width: 280px; padding: 12px 15px 11px; }
    #hudObjTitle { font-size: 10px; letter-spacing: 0.22em; color: #ff5e8a; margin-bottom: 7px; }
    #hudObjText { font-size: 11.5px; letter-spacing: 0.05em; color: #f1f5f9; line-height: 1.65; }
    #hudObjSub { font-size: 9.5px; letter-spacing: 0.16em; color: #94a3b8; margin-top: 6px; }

    #hudClock {
      top: 14px; right: 14px;
      padding: 8px 14px;
      font-size: 13px; letter-spacing: 0.18em; color: #f1f5f9;
    }
    #hudClock .d { color: #ffb35c; font-size: 9px; letter-spacing: 0.2em; }

    #hudHint {
      bottom: 168px; left: 50%; transform: translateX(-50%);
      padding: 9px 20px;
      font-size: 11px; letter-spacing: 0.18em; color: #f1f5f9;
      display: none;
    }
    #hudHint .k { color: #ff5e8a; }

    #speedo {
      bottom: 14px; left: 50%; transform: translateX(-50%);
      padding: 7px 15px;
      font-size: 15px; letter-spacing: 0.1em; color: #f1f5f9;
      display: none;
    }
    #speedo .u { font-size: 9px; color: #64748b; letter-spacing: 0.2em; }

    #minimapBox {
      position: absolute; bottom: 14px; right: 14px;
      width: 150px; height: 150px;
      border-radius: 50%;
      border: 1px solid rgba(255,94,138,0.45);
      overflow: hidden;
      background: #0a0d18;
      display: none;
      pointer-events: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.55);
    }
    #minimap { width: 100%; height: 100%; }

    #toastBox {
      position: absolute; left: 50%; top: 56px; transform: translateX(-50%);
      width: min(320px, 80%);
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: rgba(8,6,16,0.88);
      border: 1px solid rgba(255,94,138,0.5);
      border-radius: 4px;
      padding: 10px 14px;
      font-family: var(--mono); font-size: 10.5px;
      letter-spacing: 0.08em; color: #f1f5f9;
      line-height: 1.6; text-align: center;
      opacity: 1; transition: opacity 0.6s;
    }
    .toast .tt { color: #ff5e8a; letter-spacing: 0.18em; }
    .toast.bye { opacity: 0; }

    #dlg {
      position: absolute;
      bottom: 170px; left: 50%; transform: translateX(-50%);
      width: min(560px, calc(100% - 30px));
      background: rgba(8,6,16,0.94);
      border: 1px solid rgba(255,94,138,0.5);
      border-radius: 6px;
      padding: 16px 20px;
      font-family: var(--mono);
      display: none;
      z-index: 60;
      color: #f1f5f9;
    }
    #dlgSpeaker { font-size: 10px; letter-spacing: 0.24em; color: #ffb35c; margin-bottom: 9px; }
    #dlgText { font-size: 13px; line-height: 1.85; color: #f1f5f9; margin-bottom: 12px; }
    .dlg-opt {
      padding: 11px 12px;
      font-size: 11.5px; letter-spacing: 0.1em; color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
      cursor: pointer; margin-bottom: 6px;
      transition: all 0.12s;
    }
    .dlg-opt:hover { color: #f1f5f9; border-color: rgba(255,94,138,0.5); background: rgba(255,94,138,0.06); }
    .dlg-opt .n { color: #ff5e8a; margin-right: 10px; }

    #bigOv {
      position: absolute; inset: 0; z-index: 150;
      background: rgba(6,4,14,0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .ov-box {
      width: min(560px, 100%);
      max-height: 90%;
      overflow-y: auto;
      border: 1px solid rgba(255,94,138,0.5);
      border-radius: 8px;
      background: linear-gradient(165deg, rgba(20,10,30,0.97), rgba(8,6,18,0.97));
      padding: 36px 38px;
      position: relative;
      color: #94a3b8;
    }
    .ov-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 0.4em; color: #ffb35c; margin-bottom: 12px; }
    .ov-title {
      font-family: var(--disp); font-size: clamp(34px, 7vw, 56px); font-weight: 800;
      background: linear-gradient(135deg, #ff5e8a 10%, #ffb35c 60%, #7fe8d8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 4px; letter-spacing: 0.02em;
    }
    .ov-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.3em; color: #64748b; margin-bottom: 20px; }
    .ov-body { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: #94a3b8; line-height: 2.05; margin-bottom: 24px; }
    .ov-body .hl { color: #f1f5f9; }
    .ov-body .pk { color: #ff5e8a; }
    .ov-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .ov-btn {
      background: linear-gradient(135deg, #ff5e8a, #e0447a); border: none; color: #fff;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: 0.22em; padding: 14px 26px;
      cursor: pointer; border-radius: 4px;
      transition: all 0.18s;
    }
    .ov-btn:hover { box-shadow: 0 0 30px rgba(255,94,138,0.4); }
    .ov-btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #94a3b8; }
    .ov-btn.ghost:hover { border-color: rgba(255,255,255,0.4); color: #f1f5f9; box-shadow: none; }

    .corner-btns {
      position: absolute; top: 52px; right: 14px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 70;
    }
    .cbtn {
      background: rgba(8,6,16,0.8);
      border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;
      color: #94a3b8;
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em;
      padding: 8px 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .cbtn:hover { color: #f1f5f9; border-color: rgba(255,94,138,0.5); }

    #touchUI { position: absolute; inset: 0; display: none; pointer-events: none; z-index: 50; }
    #joyZone { position: absolute; left: 0; bottom: 0; width: 45%; height: 60%; pointer-events: auto; }
    #joyBase {
      position: absolute; width: 112px; height: 112px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.06);
      display: none;
      transform: translate(-50%, -50%);
    }
    #joyNub {
      position: absolute; left: 50%; top: 50%;
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,94,138,0.55);
      border: 1.5px solid rgba(255,255,255,0.5);
      transform: translate(-50%, -50%);
    }
    .tbtn {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(8,6,16,0.6);
      color: #fff;
      font-family: var(--mono); font-weight: 700; letter-spacing: 0.1em;
      pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .tbtn:active, .tbtn.on { background: rgba(255,94,138,0.5); }
    #btnGas   { right: 18px;  bottom: 96px; width: 84px; height: 84px; font-size: 13px; display: none; }
    #btnBrake { right: 116px; bottom: 56px; width: 66px; height: 66px; font-size: 10px; display: none; }
    #btnJump  { right: 18px;  bottom: 96px; width: 84px; height: 84px; font-size: 12px; }
    #btnAct   { right: 116px; bottom: 130px; width: 64px; height: 64px; font-size: 10px; }
    #btnVeh   { right: 116px; bottom: 56px;  width: 64px; height: 64px; font-size: 10px; }
    #btnRadio { right: 30px;  bottom: 200px; width: 50px; height: 50px; font-size: 9px; display: none; }
  </style>
</head>
<body data-nofx>

<div class="page-wrap">
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div class="g-panel" id="hudObj" style="display:none">
      <div id="hudObjTitle">THE COURIER RUN</div>
      <div id="hudObjText"></div>
      <div id="hudObjSub"></div>
    </div>

    <div class="g-panel" id="hudClock" style="display:none"><span class="d" id="hudDayTag">DAY</span> <span id="hudClockVal">18:00</span></div>
    <div class="g-panel" id="hudHint"><span class="k" id="hudHintKey">[E]</span> <span id="hudHintText">TALK</span></div>
    <div class="g-panel" id="speedo"><span id="speedoVal">0</span> <span class="u">KM/H</span></div>
    <div id="minimapBox"><canvas id="minimap" width="150" height="150"></canvas></div>
    <div id="toastBox"></div>

    <div class="corner-btns">
      <button class="cbtn" id="btnFS">FULLSCREEN</button>
      <button class="cbtn" id="btnPause" style="display:none">PAUSE</button>
    </div>

    <div id="dlg">
      <div id="dlgSpeaker"></div>
      <div id="dlgText"></div>
      <div id="dlgOpts"></div>
    </div>

    <div id="touchUI">
      <div id="joyZone"><div id="joyBase"><div id="joyNub"></div></div></div>
      <button class="tbtn" id="btnJump">JUMP</button>
      <button class="tbtn" id="btnGas">GAS</button>
      <button class="tbtn" id="btnBrake">BRAKE</button>
      <button class="tbtn" id="btnAct">TALK</button>
      <button class="tbtn" id="btnVeh">RIDE</button>
      <button class="tbtn" id="btnRadio">FM</button>
    </div>

    <div class="g-panel" id="hudKeys" style="display:none; bottom: 14px; left: 14px; padding: 8px 13px; font-size: 9px; letter-spacing: 0.14em; color: #94a3b8;"></div>

    <div id="cineTop" style="position:absolute; left:0; right:0; top:0; height:0; background:#000; z-index:140; transition:height 0.8s ease;"></div>
    <div id="cineBot" style="position:absolute; left:0; right:0; bottom:0; height:0; background:#000; z-index:140; transition:height 0.8s ease;"></div>
    <div id="cineCard" style="position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); z-index:141; font-family:var(--mono); color:#fff; font-size:clamp(15px,3vw,25px); letter-spacing:0.2em; text-align:center; opacity:0; transition:opacity 0.7s; text-shadow:0 2px 24px rgba(0,0,0,0.65); pointer-events:none; width:90%;"></div>
    <button class="cbtn" id="btnSkip" style="position:absolute; bottom:18px; right:18px; z-index:142; display:none;">SKIP</button>

    <div id="bigOv"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="/static/os.js"></script>
<script>
(() => {
  'use strict';
  const wrap   = document.getElementById('gameWrap');
  const canvas = document.getElementById('gameCanvas');
  const el     = id => document.getElementById(id);
  const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  /* ════════ RENDERER — shadows + physically based pipeline ════════ */
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_TOUCH, powerPreference: 'high-performance' });
  } catch (e) {
    wrap.innerHTML = '<div class="g-panel" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:24px 30px;font-size:12px;color:#94a3b8">WEBGL UNAVAILABLE.</div>';
    return;
  }
  renderer.setPixelRatio(IS_TOUCH ? 1 : Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.92; // calmer sun — detail survives noon
  renderer.shadowMap.enabled = !IS_TOUCH;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7fc4f5);
  scene.fog = new THREE.FogExp2(0x7fc4f5, 0.0036);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 700);

  function resize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(resize);

  /* fullscreen / immersive */
  let immersive = false;
  el('btnFS').addEventListener('click', () => {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl && wrap.requestFullscreen) wrap.requestFullscreen().catch(() => toggleImmersive());
    else if (!fsEl && wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    else if (fsEl && document.exitFullscreen) document.exitFullscreen();
    else toggleImmersive();
    setTimeout(resize, 350);
  });
  function toggleImmersive() {
    immersive = !immersive;
    document.body.classList.toggle('immersive', immersive);
    el('btnFS').textContent = immersive ? 'EXIT FULL' : 'FULLSCREEN';
    setTimeout(resize, 50);
  }
  document.addEventListener('fullscreenchange', () => setTimeout(resize, 100));

  /* ════════ HELPERS ════════ */
  const dist2D = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function lerpAngle(a, b, t) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  }

  const shinyMats = [];   // envMapIntensity follows daylight
  const windowMats = [];  // emissive windows follow night

  function cnv(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }
  function tex(c, srgb) {
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (srgb) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    return t;
  }
  function texClone(t, rx, ry) {
    const k = t.clone();
    k.needsUpdate = true;
    k.repeat.set(rx, ry);
    return k;
  }

  function makeGlowTex() {
    const c = cnv(64, 64);
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,0.9)');
    gr.addColorStop(0.4, 'rgba(255,255,255,0.25)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = makeGlowTex();
  function makeGlow(color, scale) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.set(scale, scale, 1);
    return s;
  }
  function textSprite(text, color) {
    const c = cnv(256, 64);
    const g = c.getContext('2d');
    g.font = '700 26px "JetBrains Mono", monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = color; g.shadowColor = color; g.shadowBlur = 12;
    g.fillText(text, 128, 34);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    s.scale.set(6, 1.5, 1);
    return s;
  }
  function makeBlob(r) {
    // faint contact shadow even alongside the real shadow map — grounds the feet
    const b = new THREE.Mesh(new THREE.CircleGeometry(r, 14), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: IS_TOUCH ? 0.3 : 0.14, depthWrite: false }));
    b.rotation.x = -Math.PI / 2;
    b.position.y = 0.04;
    return b;
  }

  /* ════════ PROCEDURAL TEXTURES ════════ */
  function noiseCanvas(base, specks, n, w, h) {
    const c = cnv(w || 256, h || 256);
    const g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < n; i++) {
      g.fillStyle = specks[(Math.random() * specks.length) | 0];
      g.globalAlpha = 0.12 + Math.random() * 0.3;
      const s = 1 + Math.random() * 2.4;
      g.fillRect(Math.random() * c.width, Math.random() * c.height, s, s);
    }
    g.globalAlpha = 1;
    return c;
  }

  /* asphalt with lane wear + cracks */
  const asphaltC = noiseCanvas('#43464d', ['#2c2e33', '#55585f', '#393b40', '#606268'], 2600);
  {
    const g = asphaltC.getContext('2d');
    g.strokeStyle = 'rgba(20,20,22,0.35)';
    for (let i = 0; i < 7; i++) {
      g.lineWidth = 0.8 + Math.random();
      g.beginPath();
      let x = Math.random() * 256, y = Math.random() * 256;
      g.moveTo(x, y);
      for (let k = 0; k < 5; k++) { x += rand(-28, 28); y += rand(8, 30); g.lineTo(x, y); }
      g.stroke();
    }
  }
  const asphaltTex = tex(asphaltC, true);

  /* sidewalk concrete with expansion joints */
  const concreteC = noiseCanvas('#bcb8ac', ['#a8a499', '#cac6ba', '#b0aca0'], 1600);
  {
    const g = concreteC.getContext('2d');
    g.strokeStyle = 'rgba(70,68,60,0.4)'; g.lineWidth = 2;
    for (let i = 0; i <= 256; i += 64) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke();
      g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke();
    }
  }
  const concreteTex = tex(concreteC, true);

  const sandTex  = tex(noiseCanvas('#e3cf9e', ['#d6bf88', '#efe0b4', '#cbb37c'], 2200), true);
  const grassTex = tex(noiseCanvas('#6da75c', ['#578c47', '#7fbb6c', '#4e7f40'], 2600), true);

  /* water: color + rolling wave bump */
  const waterColorTex = tex(noiseCanvas('#2a96ac', ['#23869a', '#35a8be', '#1f7d90'], 900), true);
  const waveC = cnv(256, 256);
  {
    const g = waveC.getContext('2d');
    const d = g.createImageData(256, 256);
    for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
      const v = 128 + 60 * Math.sin(x * 0.10 + Math.sin(y * 0.07) * 2.4) * Math.sin(y * 0.085 + Math.sin(x * 0.05) * 1.8);
      const i = (y * 256 + x) * 4;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255;
    }
    g.putImageData(d, 0, 0);
  }
  const waveTex = tex(waveC, false);

  /* cloud puff */
  const cloudC = cnv(128, 64);
  {
    const g = cloudC.getContext('2d');
    [[34, 36, 22], [64, 28, 26], [94, 38, 20], [52, 40, 18], [78, 42, 17]].forEach(([x, y, r]) => {
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(255,255,255,0.85)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 128, 64);
    });
  }
  const cloudTex = new THREE.CanvasTexture(cloudC);

  /* ── building facades: plaster & brick, with frames, sills, slabs, AC units ── */
  function facadeCanvases(style, wallHex) {
    const W = 256, H = 512;
    const c = cnv(W, H), e = cnv(W, H);
    const g = c.getContext('2d'), ge = e.getContext('2d');
    ge.fillStyle = '#000'; ge.fillRect(0, 0, W, H);

    if (style === 'brick') {
      g.fillStyle = '#cfc8bb'; g.fillRect(0, 0, W, H); // mortar
      const bw = 26, bh = 11;
      for (let y = 0; y < H; y += bh) {
        const off = (y / bh) % 2 ? bw / 2 : 0;
        for (let x = -bw; x < W; x += bw) {
          const jitter = (Math.random() - 0.5) * 14;
          g.fillStyle = `rgb(${168 + jitter | 0},${92 + jitter * 0.6 | 0},${70 + jitter * 0.5 | 0})`;
          g.fillRect(x + off + 1, y + 1, bw - 2, bh - 2);
        }
      }
    } else {
      g.fillStyle = wallHex; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(0,0,0,0.05)';
      for (let i = 0; i < 60; i++) g.fillRect(Math.random() * W, Math.random() * H, 2, rand(8, 40));
    }

    const floors = 8, cols = 4;
    const fH = H / floors;
    const winW = 38, winH = 32;
    for (let f = 0; f < floors; f++) {
      const fy = f * fH;
      /* floor slab shadow band */
      g.fillStyle = 'rgba(0,0,0,0.16)';
      g.fillRect(0, fy + fH - 5, W, 3);
      for (let cIdx = 0; cIdx < cols; cIdx++) {
        const wx = 14 + cIdx * ((W - 28) / cols) + ((W - 28) / cols - winW) / 2;
        const wy = fy + 12;
        /* frame */
        g.fillStyle = '#2c2f35';
        g.fillRect(wx - 3, wy - 3, winW + 6, winH + 6);
        /* glass with sky sheen */
        const gl = g.createLinearGradient(wx, wy, wx + winW, wy + winH);
        gl.addColorStop(0, '#5d7d9a'); gl.addColorStop(0.45, '#33495e'); gl.addColorStop(1, '#1f2d3c');
        g.fillStyle = gl;
        g.fillRect(wx, wy, winW, winH);
        g.fillStyle = 'rgba(255,255,255,0.20)';
        g.beginPath(); g.moveTo(wx, wy + winH * 0.55); g.lineTo(wx + winW * 0.5, wy); g.lineTo(wx + winW * 0.78, wy); g.lineTo(wx, wy + winH); g.closePath(); g.fill();
        /* mullion */
        g.fillStyle = '#2c2f35';
        g.fillRect(wx + winW / 2 - 1, wy, 2, winH);
        /* sill + shadow under it */
        g.fillStyle = '#ddd8ca';
        g.fillRect(wx - 5, wy + winH + 3, winW + 10, 4);
        g.fillStyle = 'rgba(0,0,0,0.25)';
        g.fillRect(wx - 5, wy + winH + 7, winW + 10, 2);

        }
      }

  /* ════════ AUDIO ════════ */
  let AC = null, engineOsc = null, engineGain = null, radioOn = false, radioGain = null, radioStep = 0, radioNext = 0;
  function audioInit() {
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const len = 2 * AC.sampleRate;
      const buf = AC.createBuffer(1, len, AC.sampleRate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      const noise = AC.createBufferSource();
      noise.buffer = buf; noise.loop = true;
      const lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 420;
      const og = AC.createGain(); og.gain.value = 0.012;
      const lfo = AC.createOscillator(); lfo.frequency.value = 0.09;
      const lfoG = AC.createGain(); lfoG.gain.value = 0.007;
      lfo.connect(lfoG); lfoG.connect(og.gain);
      noise.connect(lp); lp.connect(og); og.connect(AC.destination);
      noise.start(); lfo.start();
      engineOsc = AC.createOscillator();
      engineOsc.type = 'sawtooth'; engineOsc.frequency.value = 50;
      const elp = AC.createBiquadFilter();
      elp.type = 'lowpass'; elp.frequency.value = 340;
      engineGain = AC.createGain(); engineGain.gain.value = 0;
      engineOsc.connect(elp); elp.connect(engineGain); engineGain.connect(AC.destination);
      engineOsc.start();
      radioGain = AC.createGain(); radioGain.gain.value = 0;
      radioGain.connect(AC.destination);
      radioNext = AC.currentTime + 0.1;
    } catch (e) { AC = null; }
  }
  function beep(f, d, type, g) {
    if (!AC) return;
    try {
      const o = AC.createOscillator(), gn = AC.createGain();
      o.type = type || 'square'; o.frequency.value = f;
      gn.gain.setValueAtTime(g || 0.04, AC.currentTime);
      gn.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (d || 0.09));
      o.connect(gn); gn.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + (d || 0.09) + 0.02);
    } catch (e) {}
  }
  const sfxPickup = () => { beep(660, 0.07); setTimeout(() => beep(990, 0.07), 80); setTimeout(() => beep(1320, 0.1), 160); };
  const sfxBlip   = () => beep(880, 0.05, 'square', 0.025);
  const sfxThud   = () => beep(120, 0.18, 'sawtooth', 0.05);
  let gullT = 8;
  function gull() { beep(1380, 0.12, 'sine', 0.018); setTimeout(() => beep(1050, 0.16, 'sine', 0.015), 140); }

  const BASS = [55, 55, 110, 55, 65.4, 65.4, 130.8, 65.4, 43.65, 43.65, 87.3, 43.65, 49, 49, 98, 98];
  const ARP  = [220, 261.6, 329.6, 440, 523.2, 440, 329.6, 261.6, 174.6, 220, 261.6, 349.2, 196, 246.9, 293.7, 392];
  const STEP = 0.155;
  function radioTick() {
    if (!AC || !radioOn) return;
    while (radioNext < AC.currentTime + 0.18) {
      const s = radioStep % 16;
      try {
        const b = AC.createOscillator(), bg = AC.createGain(), bf = AC.createBiquadFilter();
        b.type = 'sawtooth'; b.frequency.value = BASS[s];
        bf.type = 'lowpass'; bf.frequency.value = 300;
        bg.gain.setValueAtTime(0.05, radioNext);
        bg.gain.exponentialRampToValueAtTime(0.001, radioNext + STEP * 0.9);
        b.connect(bf); bf.connect(bg); bg.connect(radioGain);
        b.start(radioNext); b.stop(radioNext + STEP);
        if (s % 2 === 0) {
          const a = AC.createOscillator(), ag = AC.createGain();
          a.type = 'square'; a.frequency.value = ARP[s];
          ag.gain.setValueAtTime(0.016, radioNext);
          ag.gain.exponentialRampToValueAtTime(0.001, radioNext + STEP * 0.7);
          a.connect(ag); ag.connect(radioGain);
          a.start(radioNext); a.stop(radioNext + STEP);
        }
      } catch (e) {}
      radioNext += STEP;
      radioStep++;
    }
  }
  function toggleRadio() {
    if (!AC) return;
    radioOn = !radioOn;
    radioGain.gain.value = radioOn ? 0.9 : 0;
    if (radioOn) radioNext = AC.currentTime + 0.05;
    toast('SYNTHRIDER FM', radioOn ? 'NOW PLAYING — MIDNIGHT MIRAGE' : 'RADIO OFF');

  function beginChase() {

  /* ════════ INPUT ════════ */
  const keys = new Set();
  const pad = { mx: 0, my: 0, gas: false, brake: false };
  let camYaw = Math.PI, camPitch = 0.46, camDist = 11, camDistT = 11;
  let dragging = false, lastMX = 0, lastMY = 0;

  canvas.addEventListener('mousedown', e => { dragging = true; lastMX = e.clientX; lastMY = e.clientY; });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    camYaw -= (e.clientX - lastMX) * 0.005;
    camPitch = clamp(camPitch + (e.clientY - lastMY) * 0.004, 0.18, 1.05);
    lastMX = e.clientX; lastMY = e.clientY;
  });
  canvas.addEventListener('wheel', e => { camDistT = clamp(camDistT + e.deltaY * 0.012, 7, 22); }, { passive: true });

  function doAction() {
    if (dialogOpen()) return;
    const it = nearestInteract();
    if (it) it.act();
  }
  function doVehicle() {
    if (dialogOpen() || overlayOpen) return;
    if (currentV) exitVehicle();
    else {
      let best = null, bd = 5.5;
      vehicles.forEach(v => {
        const d = dist2D(player.position, v.mesh.position);
        if (d < bd) { bd = d; best = v; }
      });
      if (best) enterVehicle(best);
    }
  }
  function doJump() {
    if (currentV || dialogOpen() || overlayOpen) return;
    if (onGround) { vy = 8.6; onGround = false; }
  }

  function enterVehicle(v) {
    currentV = v;
    camDistT = v.kind === 'bike' ? 13 : 16;
    if (v.kind !== 'bike') player.visible = false;
    el('speedo').style.display = 'block';
    el('btnRadio').style.display = IS_TOUCH ? 'flex' : 'none';
    setTouchMode();
    toast(v.name, 'PRESS F TO EXIT' + (IS_TOUCH ? ' — USE GAS / BRAKE' : ''));
    sfxBlip();
  }
  function exitVehicle() {
    const v = currentV;
    currentV = null;
    const side = new THREE.Vector3(Math.cos(v.heading), 0, -Math.sin(v.heading));
    let ex = v.mesh.position.x + side.x * 2.4, ez = v.mesh.position.z + side.z * 2.4;
    if (hitsBuilding(ex, ez, 0.7)) { ex = v.mesh.position.x - side.x * 2.4; ez = v.mesh.position.z - side.z * 2.4; }
    player.position.set(clamp(ex, BOUND_X[0], BOUND_X[1]), 0, clamp(ez, BOUND_Z[0], BOUND_Z[1]));
    py = 0; vy = 0; onGround = true;
    player.rotation.y = 0;
    playerInner.rotation.y = v.heading;
    player.visible = true;
    camDistT = 11;
    if (engineGain) engineGain.gain.value = 0;
    el('speedo').style.display = 'none';
    el('btnRadio').style.display = 'none';
    setTouchMode();
    sfxBlip();
  }

  document.addEventListener('keydown', e => {
    if (window.OS && OS.paletteOpen) return;
    if (e.target.closest('input, select, textarea')) return;
    audioInit();
    if (cine) {
      if (e.code === 'Enter' || e.code === 'Space' || e.code === 'Escape') endCine();
      return;
    }
    if (e.code === 'Escape') {
      if (dialogOpen()) { closeDialog(); return; }
      if (mState !== 'idle') {
        if (pauseShown) hideOverlay();
        else if (!overlayOpen) showPause();
      }
      return;
    }
    if (dialogOpen()) {
      const opt = dlgOptions.find(o => String(o.n) === e.key);
      if (opt) opt.fn();
      return;
    }
    if (overlayOpen) return;
    if (e.code === 'KeyE') { doAction(); return; }
    if (e.code === 'KeyF') { doVehicle(); return; }
    if (e.code === 'KeyR') { if (currentV) toggleRadio(); return; }
    if (e.code === 'Space') { e.preventDefault(); doJump(); }
    keys.add(e.code);
  });
  document.addEventListener('keyup', e => keys.delete(e.code));
  window.addEventListener('blur', () => keys.clear());

  function showPause() {
    pauseShown = true;
    showOverlay({
      eyebrow: '// PAUSED', title: 'COSTA VISTA',
      body: (IS_TOUCH
        ? 'LEFT THUMB — MOVE / STEER<br/>RIGHT BUTTONS — JUMP, GAS, BRAKE, TALK, RIDE<br/>DRAG EMPTY SPACE — CAMERA'
        : 'WASD — MOVE / DRIVE &nbsp;&middot;&nbsp; SHIFT — RUN &nbsp;&middot;&nbsp; SPACE — JUMP<br/>F — VEHICLE &nbsp;&middot;&nbsp; E — TALK / PICKUP &nbsp;&middot;&nbsp; R — RADIO (IN CAR)<br/>MOUSE DRAG — CAMERA &nbsp;&middot;&nbsp; WHEEL — ZOOM')
        + '<br/><br/>PROGRESS SAVES TO THIS BROWSER AUTOMATICALLY.',
      buttons: [
        { label: 'RESUME', fn: hideOverlay },
        ...(saveData.done && mState === 'done' ? [{ label: 'REPLAY MISSION', fn: () => { hideOverlay(); startMission(); } }] : []),
        { label: 'RETURN TO OS', fn: () => { document.body.classList.add('fade-out'); setTimeout(() => location.href = '/', 180); }, ghost: true },
      ],
    });
  }
  el('btnPause').addEventListener('click', () => { if (!overlayOpen) showPause(); });

  /* touch controls */
  let joyId = null, joyBaseX = 0, joyBaseY = 0, camId = null, camLX = 0, camLY = 0;
  if (IS_TOUCH) {
    el('touchUI').style.display = 'block';
    const joyZone = el('joyZone'), joyBase = el('joyBase'), joyNub = el('joyNub');
    joyZone.addEventListener('touchstart', e => {
      e.preventDefault();
      audioInit();
      const t = e.changedTouches[0];
      joyId = t.identifier;
      const r = wrap.getBoundingClientRect();
      joyBaseX = t.clientX - r.left; joyBaseY = t.clientY - r.top;
      joyBase.style.display = 'block';
      joyBase.style.left = joyBaseX + 'px';
      joyBase.style.top = joyBaseY + 'px';
      joyNub.style.left = '50%'; joyNub.style.top = '50%';
    }, { passive: false });
    joyZone.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier !== joyId) continue;
        const r = wrap.getBoundingClientRect();
        let dx = (t.clientX - r.left) - joyBaseX, dy = (t.clientY - r.top) - joyBaseY;
        const m = Math.hypot(dx, dy), MAX = 44;
        if (m > MAX) { dx = dx / m * MAX; dy = dy / m * MAX; }
        pad.mx = dx / MAX; pad.my = -dy / MAX;
        joyNub.style.left = `calc(50% + ${dx}px)`;
        joyNub.style.top = `calc(50% + ${dy}px)`;
      }
    }, { passive: false });
    const joyEnd = e => {
      for (const t of e.changedTouches) {
        if (t.identifier === joyId) {
          joyId = null; pad.mx = 0; pad.my = 0;
          joyBase.style.display = 'none';
        }
      }
    };
    joyZone.addEventListener('touchend', joyEnd);
    joyZone.addEventListener('touchcancel', joyEnd);

    wrap.addEventListener('touchstart', e => {
      for (const t of e.changedTouches) {
        if (t.target.closest('.tbtn, #joyZone, .dlg-opt, .ov-btn, .cbtn, #dlg, .ov-box')) continue;
        const r = wrap.getBoundingClientRect();
        if (t.clientX - r.left > r.width * 0.45 && camId === null) {
          camId = t.identifier; camLX = t.clientX; camLY = t.clientY;
        }
      }
    }, { passive: true });
    wrap.addEventListener('touchmove', e => {
      for (const t of e.changedTouches) {
        if (t.identifier !== camId) continue;
        camYaw -= (t.clientX - camLX) * 0.006;
        camPitch = clamp(camPitch + (t.clientY - camLY) * 0.005, 0.18, 1.05);
        camLX = t.clientX; camLY = t.clientY;
      }
    }, { passive: true });
    const camEnd = e => { for (const t of e.changedTouches) if (t.identifier === camId) camId = null; };
    wrap.addEventListener('touchend', camEnd);
    wrap.addEventListener('touchcancel', camEnd);

    const bindHold = (id, on, off) => {
      const b = el(id);
      b.addEventListener('touchstart', e => { e.preventDefault(); audioInit(); on(); }, { passive: false });
      b.addEventListener('touchend', e => { e.preventDefault(); off && off(); }, { passive: false });
      b.addEventListener('touchcancel', () => off && off());
    };
    bindHold('btnGas',   () => pad.gas = true,   () => pad.gas = false);
    bindHold('btnBrake', () => pad.brake = true, () => pad.brake = false);
    bindHold('btnJump',  () => doJump());
    bindHold('btnAct',   () => doAction());
    bindHold('btnVeh',   () => doVehicle());
    bindHold('btnRadio', () => toggleRadio());
  }
  function setTouchMode() {
    if (!IS_TOUCH) return;
    const inV = !!currentV;
    el('btnGas').style.display   = inV ? 'flex' : 'none';
    el('btnBrake').style.display = inV ? 'flex' : 'none';
    el('btnJump').style.display  = inV ? 'none' : 'flex';
    el('btnAct').style.display   = inV ? 'none' : 'flex';
    el('btnVeh').textContent     = inV ? 'EXIT' : 'RIDE';
  }
  setTouchMode();

  /* ════════ INTERACTABLES ════════ */
  const interactables = [
    {
      pos: () => rico.position, r: 4.5,
      enabled: () => mState !== 'idle' && !currentV,
      prompt: 'TALK TO RICO', key: 'E',
      act: ricoTalk,
    },
    {
      pos: () => pkg.position, r: 2.6,
      enabled: () => mState === 'pickup' && pkg.visible && !currentV,
      prompt: 'GRAB PACKAGE', key: 'E',
      act: pickupPkg,
    },
  ];
  function nearestInteract() {
    let best = null, bd = 1e9;
    for (const it of interactables) {
      if (!it.enabled()) continue;
      const d = dist2D(player.position, it.pos());
      if (d < it.r && d < bd) { bd = d; best = it; }
    }
    return best;
  }

  /* ════════ MINIMAP ════════ */
  const MAP_PAD = 160, MAP_SCALE = 1.6;
  const mapBase = document.createElement('canvas');
  mapBase.width = mapBase.height = (MAP_PAD * 2) * MAP_SCALE;
  {
    const g = mapBase.getContext('2d');
    const W = mapBase.width, c0 = W / 2;
    g.fillStyle = '#15314a'; g.fillRect(0, 0, W, W);
    g.fillStyle = '#caa86c'; g.fillRect(c0 - 104 * MAP_SCALE, 0, 46 * MAP_SCALE, W);
    g.fillStyle = '#2c3040'; g.fillRect(c0 - 58 * MAP_SCALE, 0, (58 + 126) * MAP_SCALE, W);
    g.strokeStyle = '#1c1f2c'; g.lineWidth = 13 * MAP_SCALE;
    ROADS_X.forEach(x => {
      g.beginPath(); g.moveTo(c0 + x * MAP_SCALE, 0); g.lineTo(c0 + x * MAP_SCALE, W); g.stroke();
    });
    ROADS_Z.forEach(z => {
      g.beginPath(); g.moveTo(c0 - 58 * MAP_SCALE, c0 + z * MAP_SCALE); g.lineTo(W, c0 + z * MAP_SCALE); g.stroke();
    });
    g.fillStyle = '#3e4a66';
    footprints.forEach(b => g.fillRect(c0 + (b.x - b.w / 2) * MAP_SCALE, c0 + (b.z - b.d / 2) * MAP_SCALE, b.w * MAP_SCALE, b.d * MAP_SCALE));
    g.fillStyle = '#8a6a48';
    PIERS.forEach(z => g.fillRect(c0 - 148 * MAP_SCALE, c0 + (z - 3) * MAP_SCALE, 44 * MAP_SCALE, 6 * MAP_SCALE));
  }
  const mmCtx = el('minimap').getContext('2d');
  function drawMinimap() {
    const f = focusPos();
    const VIEW = 95, S = 150 / VIEW;
    const px = (f.x + MAP_PAD) * MAP_SCALE, pz = (f.z + MAP_PAD) * MAP_SCALE;
    const w = VIEW * MAP_SCALE;
    mmCtx.clearRect(0, 0, 150, 150);
    mmCtx.drawImage(mapBase, px - w / 2, pz - w / 2, w, w, 0, 0, 150, 150);
    const blip = (x, z, color, r) => {
      let bx = 75 + (x - f.x) * S, bz = 75 + (z - f.z) * S;
      bx = clamp(bx, 6, 144); bz = clamp(bz, 6, 144);
      mmCtx.fillStyle = color;
      mmCtx.beginPath(); mmCtx.arc(bx, bz, r, 0, 7); mmCtx.fill();
    };
    if (beacon.visible) blip(beacon.position.x, beacon.position.z, '#ff5e8a', 4);
    if (thief.active) blip(thiefCar.position.x, thiefCar.position.z, '#ff2433', 3.5);
    if (mState !== 'idle') blip(rico.position.x, rico.position.z, '#ffb35c', 3);
    vehicles.forEach(v => { if (v !== currentV) blip(v.mesh.position.x, v.mesh.position.z, '#9fb6e8', 2.4); });
    const ang = currentV ? currentV.heading : playerInner.rotation.y;
    mmCtx.save();
    mmCtx.translate(75, 75);
    mmCtx.rotate(-ang + Math.PI);
    mmCtx.fillStyle = '#ffffff';
    mmCtx.beginPath();
    mmCtx.moveTo(0, -7); mmCtx.lineTo(4.5, 5); mmCtx.lineTo(-4.5, 5);
    mmCtx.closePath(); mmCtx.fill();
    mmCtx.restore();
  }
  function focusPos() { return currentV ? currentV.mesh.position : player.position; }

  /* ════════ COLLISION ════════ */
  function hitsBuilding(x, z, m) {
    const r = m === undefined ? 0.6 : m;
    for (const c of colliders) {
      if (x > c.x1 - r && x < c.x2 + r && z > c.z1 - r && z < c.z2 + r) return true;
    }
    return false;
  }
  function onPier(x, z) {
    if (x > -104) return false;
    return PIERS.some(pz => Math.abs(z - pz) < 2.7) && x > -149;
  }
  function groundYAt(x, z) { return onPier(x, z) ? 0.32 : 0; }

  /* moving things are solid too — no more ghost cars */
  function blockedByVehicle(x, z, selfMesh, r, ignorePlayer) {
    for (const tc of trafficCars) {
      if (tc.mesh !== selfMesh && Math.hypot(x - tc.mesh.position.x, z - tc.mesh.position.z) < r) return true;
    }
    for (const v of vehicles) {
      if (v.mesh !== selfMesh && Math.hypot(x - v.mesh.position.x, z - v.mesh.position.z) < r) return true;
    }
    if (thiefCar.visible && thiefCar !== selfMesh && Math.hypot(x - thiefCar.position.x, z - thiefCar.position.z) < r) return true;
    if (!ignorePlayer && !currentV && Math.hypot(x - player.position.x, z - player.position.z) < r * 0.8) return true;
    return false;
  }

  /* ════════ INTRO ════════ */
  showOverlay({
    eyebrow: '// FUNFLIX PRESENTS', title: 'FLY', sub: 'COSTA VISTA — 1986',
    body: `Pastel towers. A sea that drinks the sun every night.<br/><br/>You run packages, favors, and the occasional miracle along the strip.<br/>Tonight, your friend <span class="hl">Rico</span> calls in a debt: a one-of-a-kind <span class="pk">prototype synth chip</span> just got stolen off his dock.<br/><br/>${saveData.done ? '<span class="hl">SAVE FOUND — MISSION ALREADY COMPLETE.</span><br/>' : ''}${IS_TOUCH ? 'TOUCH CONTROLS READY — LEFT THUMB MOVES, RIGHT BUTTONS ACT.' : 'WASD MOVES. F TAKES A CAR. THE REST IS INSTINCT.'}`,
    buttons: saveData.done
      ? [
          { label: 'FREE ROAM', fn: () => { audioInit(); hideOverlay(); startFreeRoam(); } },
          { label: 'REPLAY MISSION', fn: () => { audioInit(); hideOverlay(); startMission(); } },
        ]
      : [{ label: 'START', fn: () => { audioInit(); hideOverlay(); startCinematic(); } }],
  });

  /* ════════ MAIN LOOP ════════ */
  const clock = new THREE.Clock();
  let shake = 0;
  const camPos = new THREE.Vector3(38, 8, 28);
  let fpsAcc = 0, fpsN = 0, slowT = 0, perfStage = 0;

  function tick() {
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    const frozen = overlayOpen || dialogOpen() || cine;

    const sky = updateDayNight(frozen && !cine ? 0 : dt);

    /* signal heads follow the global cycle */
    const sigP = t % 20;
    sigGrn.emissiveIntensity = sigP < 8 ? 1.2 : 0.05;
    sigYel.emissiveIntensity = (sigP >= 8 && sigP < 10) || sigP >= 18 ? 1.2 : 0.05;
    sigRed.emissiveIntensity = sigP >= 10 && sigP < 18 ? 1.2 : 0.05;
    waterMat.map.offset.x += dt * 0.012;
    waterMat.bumpMap.offset.x += dt * 0.02;
    waterMat.bumpMap.offset.y += dt * 0.013;

    /* clouds drift */
    clouds.forEach((c, i) => {
      c.position.x += dt * (1.1 + i * 0.13);
      if (c.position.x > 260) c.position.x = -260;
    });

    /* adaptive quality: shadows first, then resolution */
    fpsAcc += dt; fpsN++;
    if (fpsN >= 40) {
      const avg = fpsAcc / fpsN;
      if (avg > 0.024) slowT += fpsAcc; else slowT = 0;
      if (slowT > 2.5) {
        slowT = 0;
        if (perfStage === 0 && sun.castShadow) {
          sun.castShadow = false; perfStage = 1;
          toast('PERFORMANCE MODE', 'SHADOWS OFF.');
        } else if (perfStage <= 1) {
          renderer.setPixelRatio(Math.max(0.8, renderer.getPixelRatio() - 0.2));
          perfStage = 2;
        }
      }
      fpsAcc = 0; fpsN = 0;
    }

    /* ── on-foot ── */
    let moving = false;
    if (!frozen && !currentV && mState !== 'idle') {
      let mx = pad.mx, my = pad.my;
      if (keys.has('KeyW') || keys.has('ArrowUp')) my += 1;
      if (keys.has('KeyS') || keys.has('ArrowDown')) my -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) mx -= 1;
      const len = Math.hypot(mx, my);
      if (len > 0.08) {
        moving = true;
        mx /= Math.max(1, len); my /= Math.max(1, len);
        const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
        const rx = Math.cos(camYaw),  rz = -Math.sin(camYaw);
        const dx = fx * my + rx * mx, dz = fz * my + rz * mx;
        const run = keys.has('ShiftLeft') || keys.has('ShiftRight') || len > 0.92;
        const speed = (run ? 11.5 : 6.5) * Math.min(1, len);
        const nx = player.position.x + dx * speed * dt;
        const nz = player.position.z + dz * speed * dt;
        if (!hitsBuilding(nx, player.position.z) && !blockedByVehicle(nx, player.position.z, null, 1.6, true)) player.position.x = nx;
        if (!hitsBuilding(player.position.x, nz) && !blockedByVehicle(player.position.x, nz, null, 1.6, true)) player.position.z = nz;
        if (player.position.x < -104 && !onPier(player.position.x, player.position.z)) player.position.x = -104;
        player.position.x = clamp(player.position.x, -148, BOUND_X[1]);
        player.position.z = clamp(player.position.z, BOUND_Z[0], BOUND_Z[1]);
        playerInner.rotation.y = lerpAngle(playerInner.rotation.y, Math.atan2(dx, dz), Math.min(1, dt * 12));
      }
      const gy = groundYAt(player.position.x, player.position.z);
      if (!onGround || py > gy) {
        vy -= 23 * dt;
        py += vy * dt;
        if (py <= gy) { py = gy; vy = 0; onGround = true; }
        else onGround = false;
      } else py = gy;
      player.position.y = py;
    }
    walkAnim(playerInner, t, moving && onGround ? 1 : 0);

    /* ── driving ── */
    let steerVisual = 0;
    if (!frozen && currentV) {
      const v = currentV, K = KINDS[v.kind];
      const gas = pad.gas || keys.has('KeyW') || keys.has('ArrowUp');
      const brk = pad.brake || keys.has('KeyS') || keys.has('ArrowDown');
      if (gas) v.vel = Math.min(K.maxV, v.vel + K.accel * dt);
      else if (brk) v.vel = Math.max(-9, v.vel - 24 * dt);
      else v.vel *= Math.max(0, 1 - 1.3 * dt);
      if (keys.has('Space')) v.vel *= Math.max(0, 1 - 5 * dt);
      let steer = (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0) - (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0);
      steer -= pad.mx;
      steer = clamp(steer, -1, 1);
      steerVisual = steer;
      if (Math.abs(v.vel) > 0.5) {
        v.heading += steer * K.steer * dt * Math.sign(v.vel) * Math.min(1, Math.abs(v.vel) / 9);
      }
      const nx = v.mesh.position.x + Math.sin(v.heading) * v.vel * dt;
      const nz = v.mesh.position.z + Math.cos(v.heading) * v.vel * dt;
      if (hitsBuilding(nx, nz, K.margin)) {
        v.vel *= -0.2;
        shake = Math.min(0.5, Math.abs(v.vel) * 0.04 + 0.12);
        sfxThud();
      } else if (blockedByVehicle(nx, nz, v.mesh, 2.7, true)) {
        v.vel *= -0.25;
        shake = Math.min(0.5, Math.abs(v.vel) * 0.05 + 0.14);
        sfxThud();
      } else {
        v.mesh.position.x = clamp(nx, BOUND_X[0], BOUND_X[1]);
        v.mesh.position.z = clamp(nz, BOUND_Z[0], BOUND_Z[1]);
      }
      v.mesh.rotation.y = v.heading;
      v.spin += (v.vel / 0.42) * dt;
      v.mesh.userData.wheels.forEach(w => {
        w.spin.rotation.x = v.spin;
        if (w.front) w.steer.rotation.y = lerpAngle(w.steer.rotation.y, steer * 0.42, Math.min(1, dt * 8));
      });
      if (v.kind === 'bike') {
        v.mesh.rotation.z = -steer * Math.min(1, Math.abs(v.vel) / 12) * 0.3;
        player.position.copy(v.mesh.position);
        player.position.y = 0.52;
        playerInner.rotation.y = 0;
        player.rotation.y = v.heading;
        player.visible = true;
        ridePose(playerInner);
      } else {
        player.position.copy(v.mesh.position);
      }
      if (mState === 'chase' && thief.active) {
        const dT = dist2D(v.mesh.position, thiefCar.position);
        if (dT < 6.5) {
          thief.ramT += dt * (dT < 4 ? 2 : 1);
          if (thief.ramT > 2.2) bustThief();
        } else thief.ramT = Math.max(0, thief.ramT - dt * 0.6);
      }
      if (engineGain) {
        engineGain.gain.value = 0.026;
        if (engineOsc) {
          engineOsc.type = v.kind === 'bike' ? 'square' : 'sawtooth';
          engineOsc.frequency.value = (v.kind === 'bike' ? 68 : 46) + Math.abs(v.vel) * 5.4;
        }
      }
      el('speedoVal').textContent = Math.round(Math.abs(v.vel) * 3.6);
      if (!dragging && camId === null) camYaw = lerpAngle(camYaw, v.heading + Math.PI, Math.min(1, dt * 1.8));
    } else if (engineGain) {
      engineGain.gain.value = 0;
    }

    /* ── thief AI ── */
    if (!frozen && thief.active) {
      const wp = THIEF_LOOP[thief.target];
      const dx = wp[0] - thiefCar.position.x, dz = wp[1] - thiefCar.position.z;
      const dd = Math.hypot(dx, dz);
      if (dd < 3) thief.target = (thief.target + 1) % THIEF_LOOP.length;
      else {
        const dToPlayer = dist2D(thiefCar.position, focusPos());
        const sp = dToPlayer > 70 ? 12.5 : thief.speed;
        thiefCar.position.x += (dx / dd) * sp * dt;
        thiefCar.position.z += (dz / dd) * sp * dt;
        thiefCar.rotation.y = lerpAngle(thiefCar.rotation.y, Math.atan2(dx, dz), Math.min(1, dt * 4));
        thief.spin += (sp / 0.42) * dt;
        thiefCar.userData.wheels.forEach(w => { w.spin.rotation.x = thief.spin; });
      }
    }

    /* ── traffic & peds ── */
    if (!frozen) {
      const p20 = t % 20;
      trafficCars.forEach(tc => {
        const wp = tc.loop[tc.target];
        const dx = wp[0] - tc.mesh.position.x, dz = wp[1] - tc.mesh.position.z;
        const dd = Math.hypot(dx, dz);
        if (dd < 1.5) { tc.target = (tc.target + 1) % tc.loop.length; return; }
        const ux = dx / dd, uz = dz / dd;
        let desired = tc.speed;
        /* red light ahead → stop at the line */
        const movingX = Math.abs(ux) > 0.7;
        const green = movingX ? (p20 >= 10 && p20 < 18) : (p20 < 8);
        if (!green) {
          for (const s of SIGNALS) {
            const rx = s[0] - tc.mesh.position.x, rz = s[1] - tc.mesh.position.z;
            const ahead = ux * rx + uz * rz;
            const lat = Math.abs(movingX ? rz : rx);
            if (ahead > 2.5 && ahead < 10 && lat < 5) { desired = 0; break; }
          }
        }
        /* something on the road ahead → brake (cars, the player, the lot) */
        if (desired > 0) {
          const lx2 = tc.mesh.position.x + ux * 5.5, lz2 = tc.mesh.position.z + uz * 5.5;
          if (blockedByVehicle(lx2, lz2, tc.mesh, 3.4, false)) desired = 0;
        }
        tc.cur += (desired - tc.cur) * Math.min(1, dt * 3.2);
        if (tc.cur > 0.05) {
          tc.mesh.position.x += ux * tc.cur * dt;
          tc.mesh.position.z += uz * tc.cur * dt;
          tc.mesh.rotation.y = lerpAngle(tc.mesh.rotation.y, Math.atan2(ux, uz), Math.min(1, dt * 5));
          tc.spin += (tc.cur / 0.42) * dt;
          tc.mesh.userData.wheels.forEach(w => { w.spin.rotation.x = tc.spin; });
        }
      });
      peds.forEach(pd => {
        if (pd.mode === 'pause') {
          pd.pauseT -= dt;
          walkAnim(pd.mesh, t + pd.phase, 0);
          if (pd.pauseT <= 0) { pd.mode = 'walk'; pd.nextPause = rand(6, 14); }
          return;
        }
        if (!pd.jogger) {
          pd.nextPause -= dt;
          if (pd.nextPause <= 0) {
            // stop and look at a shopfront for a moment
            pd.mode = 'pause';
            pd.pauseT = rand(2, 4.5);
            pd.mesh.rotation.y += (Math.random() < 0.5 ? 1 : -1) * Math.PI / 2;
            return;
          }
        }
        const axis = pd.horizontal ? 'x' : 'z';
        const spd = pd.jogger ? 4.2 : pd.speed;
        pd.mesh.position[axis] += pd.dir * spd * dt;
        if (pd.mesh.position[axis] > pd.to) pd.dir = -1;
        if (pd.mesh.position[axis] < pd.from) pd.dir = 1;
        const ang = pd.horizontal ? (pd.dir > 0 ? Math.PI / 2 : -Math.PI / 2) : (pd.dir > 0 ? 0 : Math.PI);
        pd.mesh.rotation.y = lerpAngle(pd.mesh.rotation.y, ang, Math.min(1, dt * 6));
        walkAnim(pd.mesh, t + pd.phase, pd.jogger ? 1.3 : 0.8);
      });
    }

    /* anims */
    walkAnim(rico, t, 0);
    rico.userData.parts.armR.rotation.x = Math.sin(t * 1.6) * 0.12 - 0.1;
    ricoMark.material.opacity = (mState === 'drive' || mState === 'return') ? 0.6 + Math.sin(t * 4) * 0.35 : 0;
    if (pkg.visible) {
      pkgCore.rotation.y += dt * 2.2;
      pkgCore.position.y = 0.9 + Math.sin(t * 2.4) * 0.16;
    }
    beaconRing.scale.setScalar(1 + Math.sin(t * 3) * 0.12);
    beacon.material.opacity = 0.11 + Math.sin(t * 2.5) * 0.04;

    if (AC && !frozen) {
      gullT -= dt;
      if (gullT <= 0) { if (sky.nightF < 0.4) gull(); gullT = 9 + Math.random() * 14; }
    }
    radioTick();

    /* mission triggers */
    if (!frozen) {
      if (mState === 'drive') {
        setBeacon(rico.position.x, rico.position.z, true);
      } else if (mState === 'chase') {
        setBeacon(thiefCar.position.x, thiefCar.position.z, true);
      } else if (mState === 'pickup') {
        setBeacon(pkg.position.x, pkg.position.z, true);
        if (!currentV && pkg.visible && dist2D(player.position, pkg.position) < 2.4) pickupPkg();
      } else if (mState === 'return') {
        setBeacon(rico.position.x, rico.position.z, true);
      }
    }

    /* hint */
    if (!frozen && mState !== 'idle') {
      if (currentV) {
        const showExit = Math.abs(currentV.vel) < 1;
        el('hudHint').style.display = showExit ? 'block' : 'none';
        el('hudHintKey').textContent = '[F]';
        el('hudHintText').textContent = 'EXIT ' + currentV.name;
      } else {
        const it = nearestInteract();
        let nearV = null, bd = 5.5;
        vehicles.forEach(v => { const d = dist2D(player.position, v.mesh.position); if (d < bd) { bd = d; nearV = v; } });
        if (it) {
          el('hudHint').style.display = 'block';
          el('hudHintKey').textContent = `[${it.key}]`;
          el('hudHintText').textContent = it.prompt;
        } else if (nearV) {
          el('hudHint').style.display = 'block';
          el('hudHintKey').textContent = '[F]';
          el('hudHintText').textContent = 'DRIVE ' + nearV.name;
        } else el('hudHint').style.display = 'none';
      }
    } else el('hudHint').style.display = 'none';

    if (mState !== 'idle') drawMinimap();

    /* ── camera + sun follow ── */
    const f = focusPos();
    if (cine) {
      /* scripted establishing orbit over the plaza */
      cineT += dt;
      const a = cineT * 0.3;
      camera.position.set(36 + Math.cos(a) * 26, 13 - Math.min(6, cineT * 0.55), Math.sin(a) * 26);
      camera.lookAt(36, 3.5, 0);
      camPos.copy(camera.position);
      if (cineT > 9.6) endCine();
    } else {
      camDist += (camDistT - camDist) * Math.min(1, dt * 5);
      const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
      const desired = new THREE.Vector3(
        f.x + Math.sin(camYaw) * cp * camDist,
        f.y + sp * camDist + 1.5,
        f.z + Math.cos(camYaw) * cp * camDist
      );
      camPos.lerp(desired, Math.min(1, dt * 6));
      if (shake > 0.003) {
        camPos.x += (Math.random() - 0.5) * shake;
        camPos.y += (Math.random() - 0.5) * shake;
        shake *= Math.pow(0.01, dt);
      }
      camera.position.copy(camPos);
      camera.lookAt(f.x, f.y + 1.6, f.z);
    }

    sun.position.set(f.x + sky.sx * 165, Math.max(34, sky.elev * 165 + 12), f.z + 62);
    sun.target.position.set(f.x, 0, f.z);

    renderer.render(scene, camera);
  }
  tick();
})();
</script>
