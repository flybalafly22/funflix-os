    el('btnGas').style.display   = inV ? 'flex' : 'none';
    el('btnBrake').style.display = inV ? 'flex' : 'none';
    el('btnJump').style.display  = inV ? 'none' : 'flex';
    el('btnAct').style.display   = inV ? 'none' : 'flex';
    el('btnVeh').textContent     = inV ? 'EXIT' : 'RIDE';
  }
  setTouchMode();

  /* ════════ INTERACTABLES ════════ */
  const interactables = [
    {
      pos: () => rico.position, r: 4.5,
      enabled: () => mState !== 'idle' && !currentV,
      prompt: 'TALK TO RICO', key: 'E',
      act: ricoTalk,
    },
    {
      pos: () => pkg.position, r: 2.6,
      enabled: () => mState === 'pickup' && pkg.visible && !currentV,
      prompt: 'GRAB PACKAGE', key: 'E',
      act: pickupPkg,
    },
    {
      pos: () => marisol.position, r: 4.5,
      enabled: () => mState !== 'idle' && curAct === 2 && !currentV,
      prompt: 'TALK TO MARISOL', key: 'E',
      act: marisolTalk,
    },
  ];
  function nearestInteract() {
    let best = null, bd = 1e9;
    for (const it of interactables) {
      if (!it.enabled()) continue;
      const d = dist2D(player.position, it.pos());
      if (d < it.r && d < bd) { bd = d; best = it; }
    }
    return best;
  }

  /* ════════ MINIMAP ════════ */
  const MAP_PAD = 210, MAP_SCALE = 1.6;
  const mapBase = document.createElement('canvas');
  mapBase.width = mapBase.height = (MAP_PAD * 2) * MAP_SCALE;
  {
    const g = mapBase.getContext('2d');
    const W = mapBase.width, c0 = W / 2;
    g.fillStyle = '#15314a'; g.fillRect(0, 0, W, W);
    g.fillStyle = '#caa86c'; g.fillRect(c0 - 104 * MAP_SCALE, 0, 46 * MAP_SCALE, W);
    g.fillStyle = '#2c3040'; g.fillRect(c0 - 58 * MAP_SCALE, 0, 250 * MAP_SCALE, W);
    g.fillStyle = '#15314a'; g.fillRect(c0 - 58 * MAP_SCALE, c0 + 140 * MAP_SCALE, W, W); // south sea
    g.fillStyle = '#8a6a48'; g.fillRect(c0 + (20 - 55) * MAP_SCALE, c0 + 117 * MAP_SCALE, 110 * MAP_SCALE, 18 * MAP_SCALE); // boardwalk
    g.strokeStyle = '#1c1f2c'; g.lineWidth = 13 * MAP_SCALE;
    ROADS_X.forEach(x => {
      g.beginPath(); g.moveTo(c0 + x * MAP_SCALE, 0); g.lineTo(c0 + x * MAP_SCALE, W); g.stroke();
    });
    ROADS_Z.forEach(z => {
      g.beginPath(); g.moveTo(c0 - 58 * MAP_SCALE, c0 + z * MAP_SCALE); g.lineTo(W, c0 + z * MAP_SCALE); g.stroke();
    });
    g.fillStyle = '#3e4a66';
    footprints.forEach(b => g.fillRect(c0 + (b.x - b.w / 2) * MAP_SCALE, c0 + (b.z - b.d / 2) * MAP_SCALE, b.w * MAP_SCALE, b.d * MAP_SCALE));
    g.fillStyle = '#8a6a48';
    PIERS.forEach(z => g.fillRect(c0 - 148 * MAP_SCALE, c0 + (z - 3) * MAP_SCALE, 44 * MAP_SCALE, 6 * MAP_SCALE));
  }
  const mmCtx = el('minimap').getContext('2d');
  function drawMinimap() {
    const f = focusPos();
    const VIEW = 95, S = 150 / VIEW;
    const px = (f.x + MAP_PAD) * MAP_SCALE, pz = (f.z + MAP_PAD) * MAP_SCALE;
    const w = VIEW * MAP_SCALE;
    mmCtx.clearRect(0, 0, 150, 150);
    mmCtx.drawImage(mapBase, px - w / 2, pz - w / 2, w, w, 0, 0, 150, 150);
    const blip = (x, z, color, r) => {
      let bx = 75 + (x - f.x) * S, bz = 75 + (z - f.z) * S;
      bx = clamp(bx, 6, 144); bz = clamp(bz, 6, 144);
      mmCtx.fillStyle = color;
      mmCtx.beginPath(); mmCtx.arc(bx, bz, r, 0, 7); mmCtx.fill();
    };
    if (beacon.visible) blip(beacon.position.x, beacon.position.z, '#ff5e8a', 4);
    if (hunt.active) blip(hunt.car.position.x, hunt.car.position.z, '#ff2433', 3.5);
    pursuers.forEach(pu => { if (pu.active) blip(pu.mesh.position.x, pu.mesh.position.z, '#ff2433', 3); });
    if (mState !== 'idle') blip(rico.position.x, rico.position.z, '#ffb35c', 3);
    if (mState !== 'idle' && curAct === 2) blip(marisol.position.x, marisol.position.z, '#ffb35c', 3);
    vehicles.forEach(v => { if (v !== currentV) blip(v.mesh.position.x, v.mesh.position.z, '#9fb6e8', 2.4); });
    const ang = currentV ? currentV.heading : playerInner.rotation.y;
    mmCtx.save();
    mmCtx.translate(75, 75);
    mmCtx.rotate(-ang + Math.PI);
    mmCtx.fillStyle = '#ffffff';
    mmCtx.beginPath();
    mmCtx.moveTo(0, -7); mmCtx.lineTo(4.5, 5); mmCtx.lineTo(-4.5, 5);
    mmCtx.closePath(); mmCtx.fill();
    mmCtx.restore();
  }
  function focusPos() { return currentV ? currentV.mesh.position : player.position; }

  /* ════════ COLLISION ════════ */
  function hitsBuilding(x, z, m) {
    const r = m === undefined ? 0.6 : m;
    for (const c of colliders) {
      if (x > c.x1 - r && x < c.x2 + r && z > c.z1 - r && z < c.z2 + r) return true;
    }
    return false;
  }
  function onPier(x, z) {
    if (x > -104) return false;
    return PIERS.some(pz => Math.abs(z - pz) < 2.7) && x > -149;
  }
  function groundYAt(x, z) { return onPier(x, z) ? 0.32 : 0; }

  /* moving things are solid too — no more ghost cars.
     Returns distance to nearest blocker (Infinity if clear) so movers
     can always ESCAPE: a move that increases the distance is allowed. */
  function vehProximity(x, z, selfMesh, r, ignorePlayer) {
    let m = Infinity;
    const test = (mesh) => {
      if (mesh === selfMesh || !mesh.visible) return;
      const d = Math.hypot(x - mesh.position.x, z - mesh.position.z);
      if (d < r && d < m) m = d;
    };
    for (const tc of trafficCars) test(tc.mesh);
    for (const v of vehicles) test(v.mesh);
    test(thiefCar); test(enforcerCar);
    pursuers.forEach(p => test(p.mesh));
    if (!ignorePlayer && !currentV) {
      const d = Math.hypot(x - player.position.x, z - player.position.z);
      if (d < r * 0.8 && d < m) m = d;
    }
    return m;
  }
  function blockedByVehicle(x, z, selfMesh, r, ignorePlayer) {
    return vehProximity(x, z, selfMesh, r, ignorePlayer) !== Infinity;
  }

  /* ════════ TITLE ════════ */
  showTitleMenu();

  /* ════════ MAIN LOOP ════════ */
  const clock = new THREE.Clock();
  let shake = 0;
  const camPos = new THREE.Vector3(38, 8, 28);
  let fpsAcc = 0, fpsN = 0, slowT = 0, perfStage = 0;

  function tick() {
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    const frozen = overlayOpen || dialogOpen() || cine;

    const sky = updateDayNight(frozen && !cine ? 0 : dt);
    updateFX(dt);
    /* a badly wrecked car you're driving trails smoke from the crumpled hood */
    if (!frozen && currentV) {
      const c = currentV.mesh.userData.crash;
      if (c && c.damage > 0.55 && Math.random() < 0.5) {
        const fw = vForward(currentV);
        spawnSmoke(currentV.mesh.position.x + fw.x * 2.2, 0.9, currentV.mesh.position.z + fw.z * 2.2, c.damage > 0.8);
      }
    }

    /* signal heads follow the global cycle */
    const sigP = t % 20;
    sigGrn.emissiveIntensity = sigP < 8 ? 1.2 : 0.05;
    sigYel.emissiveIntensity = (sigP >= 8 && sigP < 10) || sigP >= 18 ? 1.2 : 0.05;
    sigRed.emissiveIntensity = sigP >= 10 && sigP < 18 ? 1.2 : 0.05;
    waterMat.map.offset.x += dt * 0.012;
    waterMat.bumpMap.offset.x += dt * 0.02;
    waterMat.bumpMap.offset.y += dt * 0.013;

    /* clouds drift */
    clouds.forEach((c, i) => {
      c.position.x += dt * (1.1 + i * 0.13);
      if (c.position.x > 260) c.position.x = -260;
    });

    /* adaptive quality: shadows first, then resolution */
    fpsAcc += dt; fpsN++;
    if (fpsN >= 40) {
      const avg = fpsAcc / fpsN;
      if (avg > 0.024) slowT += fpsAcc; else slowT = 0;
      if (slowT > 2.5) {
        slowT = 0;
        if (perfStage === 0 && composer) {
          composer = null; perfStage = 1;
          toast('PERFORMANCE MODE', 'BLOOM OFF.');
        } else if (perfStage <= 1 && sun.castShadow) {
          sun.castShadow = false; perfStage = 2;
          toast('PERFORMANCE MODE', 'SHADOWS OFF.');
        } else if (perfStage <= 2) {
          renderer.setPixelRatio(Math.max(0.8, renderer.getPixelRatio() - 0.2));
          perfStage = 3;
        }
      }
      fpsAcc = 0; fpsN = 0;
    }

    /* ── on-foot ── */
    let moving = false;
    if (!frozen && !currentV && mState !== 'idle') {
      let mx = pad.mx, my = pad.my;
      if (keys.has('KeyW') || keys.has('ArrowUp')) my += 1;
      if (keys.has('KeyS') || keys.has('ArrowDown')) my -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) mx -= 1;
      const len = Math.hypot(mx, my);
      if (len > 0.08) {
        moving = true;
        mx /= Math.max(1, len); my /= Math.max(1, len);
        const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
        const rx = Math.cos(camYaw),  rz = -Math.sin(camYaw);
        const dx = fx * my + rx * mx, dz = fz * my + rz * mx;
        const run = keys.has('ShiftLeft') || keys.has('ShiftRight') || len > 0.92;
        const speed = (run ? 11.5 : 6.5) * Math.min(1, len);
        const nx = player.position.x + dx * speed * dt;
        const nz = player.position.z + dz * speed * dt;
        const fpCur = vehProximity(player.position.x, player.position.z, null, 1.6, true);
        const okV = (x2, z2) => { const p2 = vehProximity(x2, z2, null, 1.6, true); return p2 === Infinity || p2 > fpCur + 0.001; };
        if (!hitsBuilding(nx, player.position.z) && okV(nx, player.position.z)) player.position.x = nx;
        if (!hitsBuilding(player.position.x, nz) && okV(player.position.x, nz)) player.position.z = nz;
        if (player.position.x < -104 && !onPier(player.position.x, player.position.z)) player.position.x = -104;
        player.position.x = clamp(player.position.x, -148, BOUND_X[1]);
        player.position.z = clamp(player.position.z, BOUND_Z[0], BOUND_Z[1]);
        playerInner.rotation.y = lerpAngle(playerInner.rotation.y, Math.atan2(dx, dz), Math.min(1, dt * 12));
      }
      const gy = groundYAt(player.position.x, player.position.z);
      if (!onGround || py > gy) {
        vy -= 23 * dt;
        py += vy * dt;
        if (py <= gy) { py = gy; vy = 0; onGround = true; }
        else onGround = false;
      } else py = gy;
      player.position.y = py;
    }
    walkAnim(playerInner, t, moving && onGround ? 1 : 0);

    /* ── driving ── */
    let steerVisual = 0;
    if (!frozen && currentV) {
      const v = currentV, K = KINDS[v.kind];
      const dmg = (v.mesh.userData.crash && v.mesh.userData.crash.damage) || 0;
      const maxV = K.maxV * (1 - dmg * 0.4);   // a wrecked car limps
      const accel = K.accel * (1 - dmg * 0.35);
      const gas = pad.gas || keys.has('KeyW') || keys.has('ArrowUp');
      const brk = pad.brake || keys.has('KeyS') || keys.has('ArrowDown');
      if (gas) v.vel = Math.min(maxV, v.vel + accel * dt);
      else if (brk) v.vel = Math.max(-9, v.vel - 24 * dt);
      else v.vel *= Math.max(0, 1 - 1.3 * dt);
      if (keys.has('Space')) v.vel *= Math.max(0, 1 - 5 * dt);
      let steer = (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0) - (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0);
      steer -= pad.mx;
      steer = clamp(steer, -1, 1);
      steerVisual = steer;
      if (Math.abs(v.vel) > 0.5) {
        v.heading += steer * K.steer * dt * Math.sign(v.vel) * Math.min(1, Math.abs(v.vel) / 9);
      }
      const nx = v.mesh.position.x + Math.sin(v.heading) * v.vel * dt;
      const nz = v.mesh.position.z + Math.cos(v.heading) * v.vel * dt;
      /* escape-aware: never trap the player — moving AWAY from what you hit always works */
      const cX = v.mesh.position.x, cZ = v.mesh.position.z;
      const bNew = hitsBuilding(nx, nz, K.margin), bCur = hitsBuilding(cX, cZ, K.margin);
      const pNew = vehProximity(nx, nz, v.mesh, 2.7, true);
      const pCur = vehProximity(cX, cZ, v.mesh, 2.7, true);
      const bldBlocked = bNew && !bCur;
      const vehBlocked = pNew !== Infinity && pNew <= pCur + 0.001;
      if (bldBlocked || vehBlocked) {
        const impactSpeed = Math.abs(v.vel);
        if (impactSpeed > 5) {
          /* a real crash: crumple, spark, shake, crunch — and shove what you hit */
          const norm = Math.min(1, (impactSpeed - 5) / 22);
          damageVehicle(v, norm * 0.6);
          shake = Math.min(0.85, impactSpeed * 0.05 + 0.2);
          sfxCrash(norm);
          if (vehBlocked) shoveTraffic(nx, nz, v.mesh, vForward(v), 0.6 + norm * 1.4);
          v.vel *= -0.28;
        } else {
          if (impactSpeed > 2) { shake = Math.min(0.5, impactSpeed * 0.045 + 0.12); sfxThud(); }
          v.vel *= -0.2;
        }
      } else {
        v.mesh.position.x = clamp(nx, BOUND_X[0], BOUND_X[1]);
        v.mesh.position.z = clamp(nz, BOUND_Z[0], BOUND_Z[1]);
      }
      v.mesh.rotation.y = v.heading;
      v.spin += (v.vel / 0.42) * dt;
      v.mesh.userData.wheels.forEach(w => {
        w.spin.rotation.x = v.spin;
        if (w.front) w.steer.rotation.y = lerpAngle(w.steer.rotation.y, steer * 0.42, Math.min(1, dt * 8));
      });
      if (v.kind === 'bike') {
        v.mesh.rotation.z = -steer * Math.min(1, Math.abs(v.vel) / 12) * 0.3;
        player.position.copy(v.mesh.position);
        player.position.y = 0.52;
        playerInner.rotation.y = 0;
        player.rotation.y = v.heading;
        player.visible = true;
        ridePose(playerInner);
      } else {
        player.position.copy(v.mesh.position);
      }
      if (mState === 'chase' && hunt.active) {
        const dT = dist2D(v.mesh.position, hunt.car.position);
        if (dT < 6.5) {
          hunt.ramT += dt * (dT < 4 ? 2 : 1);
          if (hunt.ramT > 2.2) hunt.onBust();
        } else hunt.ramT = Math.max(0, hunt.ramT - dt * 0.6);
      }
      if (engineGain) {
        engineGain.gain.value = 0.026;
        if (engineOsc) {
          engineOsc.type = v.kind === 'bike' ? 'square' : 'sawtooth';
          engineOsc.frequency.value = (v.kind === 'bike' ? 68 : 46) + Math.abs(v.vel) * 5.4;
        }
      }
      el('speedoVal').textContent = Math.round(Math.abs(v.vel) * 3.6);
      if (!dragging && camId === null) camYaw = lerpAngle(camYaw, v.heading + Math.PI, Math.min(1, dt * 1.8));
    } else if (engineGain) {
      engineGain.gain.value = 0;
    }

    /* ── chase AI (whichever act's car) ── */
    if (!frozen && hunt.active) {
      const wp = hunt.loop[hunt.target];
      const dx = wp[0] - hunt.car.position.x, dz = wp[1] - hunt.car.position.z;
      const dd = Math.hypot(dx, dz);
      if (dd < 3) hunt.target = (hunt.target + 1) % hunt.loop.length;
      else {
        const dToPlayer = dist2D(hunt.car.position, focusPos());
        const sp = dToPlayer > 70 ? hunt.speed * 0.72 : hunt.speed;
        hunt.car.position.x += (dx / dd) * sp * dt;
        hunt.car.position.z += (dz / dd) * sp * dt;
        hunt.car.rotation.y = lerpAngle(hunt.car.rotation.y, Math.atan2(dx, dz), Math.min(1, dt * 4));
        hunt.spin += (sp / 0.42) * dt;
        hunt.car.userData.wheels.forEach(w => { w.spin.rotation.x = hunt.spin; });
      }
    }

    /* ── Act III pursuers: they want the tape back ── */
    if (!frozen) pursuers.forEach(pu => {
      if (!pu.active) return;
      const tgt = focusPos();
      const dx = tgt.x - pu.mesh.position.x, dz = tgt.z - pu.mesh.position.z;
      const dd = Math.hypot(dx, dz) || 1;
      pu.heading = lerpAngle(pu.heading, Math.atan2(dx, dz), Math.min(1, dt * 2.0));
      const sp = dd > 9 ? 18.5 : 12;
      const nx2 = pu.mesh.position.x + Math.sin(pu.heading) * sp * dt;
      const nz2 = pu.mesh.position.z + Math.cos(pu.heading) * sp * dt;
      if (!hitsBuilding(nx2, nz2, 1.5)) {
        pu.mesh.position.x = clamp(nx2, BOUND_X[0], BOUND_X[1]);
        pu.mesh.position.z = clamp(nz2, BOUND_Z[0], BOUND_Z[1]);
      }
      pu.mesh.rotation.y = pu.heading;
      pu.spin += sp / 0.42 * dt;
      pu.mesh.userData.wheels.forEach(w => { w.spin.rotation.x = pu.spin; });
      if (dd < 2.9) {
        if (currentV) { currentV.vel *= 0.45; shake = Math.max(shake, 0.38); }
        else {
          player.position.x += (dx / dd) * -1.8;
          player.position.z += (dz / dd) * -1.8;
          shake = Math.max(shake, 0.32);
        }
        sfxThud();
      }
    });

    /* ── traffic & peds ── */
    if (!frozen) {
      const p20 = t % 20;
      trafficCars.forEach(tc => {
        const wp = tc.loop[tc.target];
        const dx = wp[0] - tc.mesh.position.x, dz = wp[1] - tc.mesh.position.z;
        const dd = Math.hypot(dx, dz);
        if (dd < 1.5) { tc.target = (tc.target + 1) % tc.loop.length; return; }
        const ux = dx / dd, uz = dz / dd;
        let desired = tc.speed;
        /* red light ahead → stop at the line */
        const movingX = Math.abs(ux) > 0.7;
        const green = movingX ? (p20 >= 10 && p20 < 18) : (p20 < 8);
        if (!green) {
          for (const s of SIGNALS) {
            const rx = s[0] - tc.mesh.position.x, rz = s[1] - tc.mesh.position.z;
            const ahead = ux * rx + uz * rz;
            const lat = Math.abs(movingX ? rz : rx);
            if (ahead > 2.5 && ahead < 10 && lat < 5) { desired = 0; break; }
          }
        }
        /* something on the road ahead → brake (cars, the player, the lot) */
        if (desired > 0) {
          const lx2 = tc.mesh.position.x + ux * 5.5, lz2 = tc.mesh.position.z + uz * 5.5;
          if (blockedByVehicle(lx2, lz2, tc.mesh, 3.4, false)) desired = 0;
        }
        tc.cur += (desired - tc.cur) * Math.min(1, dt * 3.2);
        if (tc.cur > 0.05) {
          tc.mesh.position.x += ux * tc.cur * dt;
          tc.mesh.position.z += uz * tc.cur * dt;
          tc.mesh.rotation.y = lerpAngle(tc.mesh.rotation.y, Math.atan2(ux, uz), Math.min(1, dt * 5));
          tc.spin += (tc.cur / 0.42) * dt;
          tc.mesh.userData.wheels.forEach(w => { w.spin.rotation.x = tc.spin; });
        }
      });
      peds.forEach(pd => {
        if (pd.mode === 'pause') {
          pd.pauseT -= dt;
          walkAnim(pd.mesh, t + pd.phase, 0);
          if (pd.pauseT <= 0) { pd.mode = 'walk'; pd.nextPause = rand(6, 14); }
          return;
        }
        if (!pd.jogger) {
          pd.nextPause -= dt;
          if (pd.nextPause <= 0) {
            // stop and look at a shopfront for a moment
            pd.mode = 'pause';
            pd.pauseT = rand(2, 4.5);
            pd.mesh.rotation.y += (Math.random() < 0.5 ? 1 : -1) * Math.PI / 2;
            return;
          }
        }
        const axis = pd.horizontal ? 'x' : 'z';
        const spd = pd.jogger ? 4.2 : pd.speed;
        pd.mesh.position[axis] += pd.dir * spd * dt;
        if (pd.mesh.position[axis] > pd.to) pd.dir = -1;
        if (pd.mesh.position[axis] < pd.from) pd.dir = 1;
        const ang = pd.horizontal ? (pd.dir > 0 ? Math.PI / 2 : -Math.PI / 2) : (pd.dir > 0 ? 0 : Math.PI);
        pd.mesh.rotation.y = lerpAngle(pd.mesh.rotation.y, ang, Math.min(1, dt * 6));
        walkAnim(pd.mesh, t + pd.phase, pd.jogger ? 1.3 : 0.8);
      });
    }

    /* anims */
    walkAnim(rico, t, 0);
    rico.userData.parts.armR.rotation.x = Math.sin(t * 1.6) * 0.12 - 0.1;
    ricoMark.material.opacity = (mState === 'drive' || mState === 'return') ? 0.6 + Math.sin(t * 4) * 0.35 : 0;
    if (pkg.visible) {
      pkgCore.rotation.y += dt * 2.2;
      pkgCore.position.y = 0.9 + Math.sin(t * 2.4) * 0.16;
    }
    beaconRing.scale.setScalar(1 + Math.sin(t * 3) * 0.12);
    beacon.material.opacity = 0.11 + Math.sin(t * 2.5) * 0.04;

    if (AC && !frozen) {
      gullT -= dt;
      if (gullT <= 0) { if (sky.nightF < 0.4) gull(); gullT = 9 + Math.random() * 14; }
    }
    radioTick();

    /* mission triggers — act aware */
    if (!frozen) {
      const npcPos = curAct === 2 ? marisol.position : rico.position;
      if (mState === 'drive') {
        setBeacon(npcPos.x, npcPos.z, true);
      } else if (mState === 'chase') {
        setBeacon(hunt.car.position.x, hunt.car.position.z, true);
      } else if (mState === 'pickup') {
        setBeacon(pkg.position.x, pkg.position.z, true);
        if (!currentV && pkg.visible && dist2D(player.position, pkg.position) < 2.4) pickupPkg();
      } else if (mState === 'return') {
        setBeacon(npcPos.x, npcPos.z, true);
      } else if (mState === 'a3_drive') {
        setBeacon(TOWER.x, TOWER.z + 14, true);
        if (!intercomDone && dist2D(focusPos(), { x: TOWER.x, z: TOWER.z + 14 }) < 7) towerIntercom();
      } else if (mState === 'a3_grab') {
        setBeacon(TAPE.x, TAPE.z, true);
        a3Timer -= dt;
        el('hudObjSub').textContent = `STORAGE B SEALS IN ${Math.max(0, Math.ceil(a3Timer))}S — THEY'RE ON YOU`;
        if (a3Timer <= 0) failAct3();
        else if (!currentV && dist2D(player.position, { x: TAPE.x, z: TAPE.z }) < 2.6) grabTape();
      } else if (mState === 'a3_escape') {
        setBeacon(rico.position.x, rico.position.z, true);
      }
    }

    /* hint */
    if (!frozen && mState !== 'idle') {
      if (currentV) {
        const showExit = Math.abs(currentV.vel) < 1;
        el('hudHint').style.display = showExit ? 'block' : 'none';
        el('hudHintKey').textContent = '[F]';
        el('hudHintText').textContent = 'EXIT ' + currentV.name;
      } else {
        const it = nearestInteract();
        let nearV = null, bd = 5.5;
        vehicles.forEach(v => { const d = dist2D(player.position, v.mesh.position); if (d < bd) { bd = d; nearV = v; } });
        if (it) {
          el('hudHint').style.display = 'block';
          el('hudHintKey').textContent = `[${it.key}]`;
          el('hudHintText').textContent = it.prompt;
        } else if (nearV) {
          el('hudHint').style.display = 'block';
          el('hudHintKey').textContent = '[F]';
          el('hudHintText').textContent = 'DRIVE ' + nearV.name;
        } else el('hudHint').style.display = 'none';
      }
    } else el('hudHint').style.display = 'none';

    if (mState !== 'idle') drawMinimap();

    /* ── waypoint pin + screen-edge arrow ── */
    if (beacon.visible) {
      wayPin.position.y = 6.5 + Math.sin(t * 2.5) * 0.5;
      const f0 = focusPos();
      const dpix = Math.round(dist2D(f0, beacon.position));
      const v = new THREE.Vector3(beacon.position.x, 2.5, beacon.position.z).project(camera);
      const onScreen = v.z < 1 && Math.abs(v.x) < 0.92 && Math.abs(v.y) < 0.92;
      const arrow = el('wayArrow');
      if (onScreen) { arrow.style.display = 'none'; }
      else {
        arrow.style.display = 'block';
        const W = wrap.clientWidth, H = wrap.clientHeight;
        let sx = v.x, sy = v.y;
        if (v.z > 1) { sx = -sx; sy = -sy; } // behind camera: flip
        const ang = Math.atan2(sy, sx);
        const mrg = 64;
        const px = clamp(W / 2 + Math.cos(ang) * (W / 2 - mrg), mrg, W - mrg);
        const py = clamp(H / 2 - Math.sin(ang) * (H / 2 - mrg), mrg, H - mrg);
        arrow.style.left = px + 'px'; arrow.style.top = py + 'px';
        el('wayChevron').style.transform = `rotate(${-ang}rad)`;
        el('wayDist').textContent = dpix + 'm';
      }
    } else el('wayArrow').style.display = 'none';

    /* ── camera + sun follow ── */
    const f = focusPos();
    if (cine) {
      /* scripted establishing orbit over the plaza */
      cineT += dt;
      const a = cineT * 0.3;
      camera.position.set(36 + Math.cos(a) * 26, 13 - Math.min(6, cineT * 0.55), Math.sin(a) * 26);
      camera.lookAt(36, 3.5, 0);
      camPos.copy(camera.position);
      if (cineT > 9.6) endCine();
    } else {
      camDist += (camDistT - camDist) * Math.min(1, dt * 5);
      /* on foot, ease the camera behind the direction you're facing so you always see ahead */
      if (!currentV && !dragging && camId === null && moving) {
        camYaw = lerpAngle(camYaw, playerInner.rotation.y + Math.PI, Math.min(1, dt * 1.4));
      }
      const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
      const pivotY = f.y + (currentV ? 1.3 : 1.7);
      /* collision-aware: shorten the boom if a building sits between target and camera */
      let useDist = camDist;
      const dirx = Math.sin(camYaw) * cp, diry = sp, dirz = Math.cos(camYaw) * cp;
      for (let s = 1.2; s < camDist; s += 1.0) {
        if (hitsBuilding(f.x + dirx * s, f.z + dirz * s, 0.8)) { useDist = Math.max(3.4, s - 0.8); break; }
      }
      const desired = new THREE.Vector3(f.x + dirx * useDist, pivotY + diry * useDist * 0.5 + 1.0, f.z + dirz * useDist);
      camPos.lerp(desired, Math.min(1, dt * (useDist < camDist - 0.5 ? 14 : 7)));
      if (shake > 0.003) {
        camPos.x += (Math.random() - 0.5) * shake;
        camPos.y += (Math.random() - 0.5) * shake;
        shake *= Math.pow(0.01, dt);
      }
      camera.position.copy(camPos);
      camera.lookAt(f.x, pivotY, f.z);
    }

    sun.position.set(f.x + sky.sx * 165, Math.max(34, sky.elev * 165 + 12), f.z + 62);
    sun.target.position.set(f.x, 0, f.z);

    /* headlight beams */
    if (currentV && sky.nightF > 0.25) {
      const fw = new THREE.Vector3(Math.sin(currentV.heading), 0, Math.cos(currentV.heading));
      const rt = new THREE.Vector3(fw.z, 0, -fw.x);
      headLamps.forEach((sl, i) => {
        const side = i === 0 ? -0.7 : 0.7;
        sl.intensity = 2.4 * sky.nightF;
        sl.position.set(
          currentV.mesh.position.x + fw.x * 2.2 + rt.x * side,
          0.75,
          currentV.mesh.position.z + fw.z * 2.2 + rt.z * side
        );
        sl.target.position.set(sl.position.x + fw.x * 14, 0.2, sl.position.z + fw.z * 14);
      });
    } else headLamps.forEach(sl => sl.intensity = 0);

    if (composer) composer.render();
    else renderer.render(scene, camera);
  }
  tick();
})();
</script>
