<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Synthesis — FUNFLIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/os.css">
  <style>
    .stage {
      flex: 1; width: 100%;
      max-width: 1060px; margin: 0 auto;
      padding: 54px 28px 70px;
      display: flex; flex-direction: column;
    }

    .mod-head { text-align: center; margin-bottom: 44px; }
    .mod-over {
      font-family: var(--sans); font-size: 9px; font-weight: 600;
      letter-spacing: 0.5em; text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    .mod-title {
      font-family: var(--serif); font-weight: 300;
      font-size: clamp(40px, 6vw, 62px);
      letter-spacing: 0.04em; color: var(--ivory);
    }
    .mod-sub {
      margin-top: 10px;
      font-family: var(--serif); font-style: italic;
      font-size: 14px; color: var(--ivory-faint);
    }

    .grid {
      display: grid; grid-template-columns: 320px 1fr; gap: 26px;
      flex: 1; align-items: start;
    }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

    .panel {
      border: 1px solid var(--hairline-2);
      background: rgba(255,255,255,0.012);
      padding: 30px 28px;
    }

    .ctl { display: flex; flex-direction: column; gap: 26px; }

    .tpl-row { display: flex; gap: 12px; align-items: flex-end; }
    .tpl-row .os-select-wrap { flex: 1; }

    .dice-btn {
      width: 40px; height: 40px; flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--hairline-2);
      color: var(--ivory-dim);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s;
    }
    .dice-btn:hover { border-color: var(--gold-dim); color: var(--gold-bright); transform: rotate(90deg); }
    .dice-btn svg { width: 16px; height: 16px; }

    /* ── the framed piece ── */
    .gallery {
      display: flex; flex-direction: column;
      min-height: 480px;
    }
    .frame-mat {
      flex: 1;
      border: 1px solid var(--hairline-2);
      padding: 13px;
      background: rgba(255,255,255,0.012);
      display: flex; flex-direction: column;
    }
    .frame-inner {
      flex: 1;
      border: 1px solid var(--hairline);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      min-height: 400px;
      background: rgba(0,0,0,0.25);
    }
    .frame-inner img {
      max-width: 100%; max-height: 520px;
      display: none;
      animation: pieceIn 0.7s cubic-bezier(0.22,1,0.36,1);
    }
    .frame-inner img.loaded { display: block; }
    @keyframes pieceIn { from { opacity: 0; transform: scale(1.015); filter: brightness(1.6) saturate(0.4); } to { opacity: 1; filter: none; } }

    .plaque {
      margin-top: 13px;
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 14px;
    }
    .plaque-title {
      font-family: var(--serif); font-style: italic;
      font-size: 13px; color: var(--ivory-dim);
    }
    .plaque-meta {
      font-family: var(--sans); font-size: 8.5px; font-weight: 600;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--ivory-faint);
    }

    .empty {
      text-align: center; padding: 30px;
      font-family: var(--serif); font-style: italic;
      font-size: 15px; font-weight: 300;
      color: var(--ivory-faint);
      line-height: 2.2;
    }
    .empty .e-rule {
      width: 60px; height: 1px;
      background: var(--gold-dim);
      margin: 0 auto 18px;
    }

    .spinner {
      display: none; width: 34px; height: 34px;
      border: 1px solid var(--hairline-2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      position: absolute;
    }
    .spinner.show { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="stage">
    <div class="mod-head rise" style="animation-delay:0.05s">
      <div class="mod-over">Atelier No. II</div>
      <h1 class="mod-title">Synthesis</h1>
      <div class="mod-sub">an atelier for the manufacture of jokes</div>
    </div>

    <div class="grid">
      <div class="panel ctl rise" style="animation-delay:0.18s">
        <div>
          <label class="os-label">The Canvas</label>
          <div class="tpl-row">
            <div class="os-select-wrap">
              <select class="os-select" id="templateSelect"><option value="">Consulting the archive&hellip;</option></select>
            </div>
            <button class="dice-btn" onclick="shuffle()" title="Chance">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M3 7h4c2 0 3 1 4.2 2.8L13 13c1.2 1.8 2.2 3 4.2 3H21"/>
                <path d="M3 16h4c1.2 0 2.1-.4 2.9-1.2M21 7h-3.8c-1.2 0-2.1.4-2.9 1.2"/>
                <path d="M18.5 4.5L21 7l-2.5 2.5M18.5 13.5L21 16l-2.5 2.5"/>
              </svg>
            </button>
          </div>
        </div>
        <div>
          <label class="os-label">Inscription &mdash; Upper</label>
          <input class="os-input" type="text" id="topText" placeholder="the first line&hellip;"/>
        </div>
        <div>
          <label class="os-label">Inscription &mdash; Lower</label>
          <input class="os-input" type="text" id="bottomText" placeholder="the punchline&hellip;"/>
        </div>
        <button class="os-btn-primary" onclick="generate()">Compose</button>
        <a class="os-btn-ghost" id="dlBtn" download="funflix-synthesis.png" target="_blank" style="display:none">Acquire &mdash; PNG</a>
      </div>

      <div class="gallery rise" style="animation-delay:0.3s">
        <div class="frame-mat">
          <div class="frame-inner" id="viewport">
            <div class="spinner" id="spinner"></div>
            <div class="empty" id="emptyState">
              <div class="e-rule"></div>
              The frame stands empty.<br/>Choose a canvas, add your inscriptions,<br/>and compose.
            </div>
            <img id="memeImg" alt="the composed piece"/>
          </div>
          <div class="plaque">
            <span class="plaque-title" id="plaqueTitle">Untitled</span>
            <span class="plaque-meta">Mixed pixels on screen &middot; MMXXVI</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/os.js"></script>
<script>
  let templates = [];

  async function loadTemplates() {
    try {
      const res = await fetch('/api/meme-templates');
      templates = await res.json();
      const sel = document.getElementById('templateSelect');
      sel.innerHTML = templates.map((t, i) => `<option value="${i}">${t.name}</option>`).join('');
      sel.value = Math.floor(Math.random() * templates.length);
    } catch (e) {
      document.getElementById('templateSelect').innerHTML = '<option value="">The archive is unreachable</option>';
    }
  }

  function shuffle() {
    if (!templates.length) return;
    const sel = document.getElementById('templateSelect');
    let next = sel.value;
    while (next === sel.value && templates.length > 1)
      next = String(Math.floor(Math.random() * templates.length));
    sel.value = next;
  }

  function encode(text) {
    return encodeURIComponent(text.trim() || '_').replace(/%20/g, '_').replace(/\?/g, '~q');
  }

  function generate() {
    const idx = document.getElementById('templateSelect').value;
    if (idx === '' || !templates[idx]) return;

    const top    = document.getElementById('topText').value;
    const bottom = document.getElementById('bottomText').value;
    const tmpl   = templates[idx];
    const url    = `https://api.memegen.link/images/${tmpl.id}/${encode(top)}/${encode(bottom)}.png`;

    const img     = document.getElementById('memeImg');
    const spinner = document.getElementById('spinner');
    const empty   = document.getElementById('emptyState');
    const dlBtn   = document.getElementById('dlBtn');

    img.classList.remove('loaded');
    empty.style.display = 'none';
    spinner.classList.add('show');
    dlBtn.style.display = 'none';

    img.onload = () => {
      spinner.classList.remove('show');
      img.classList.add('loaded');
      dlBtn.href = url;
      dlBtn.style.display = 'block';
      document.getElementById('plaqueTitle').textContent = `“${tmpl.name}”`;
    };
    img.onerror = () => {
      spinner.classList.remove('show');
      empty.style.display = 'block';
      empty.innerHTML = '<div class="e-rule"></div>The composition failed to arrive.<br/>Do try again.';
    };
    img.src = url;
  }

  document.addEventListener('keydown', e => {
    if (window.OS && OS.paletteOpen) return;
    if (e.key === 'Enter' && !e.target.closest('select')) generate();
  });

  loadTemplates();
</script>
</body>
</html>
