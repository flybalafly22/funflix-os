<!DOCTYPE html>
<!-- THE FLY — the town (hand-authored, playable courier game). Bootstrap + HUD. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>THE FLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #5fc0b2;
               font-family: 'Patrick Hand', ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: #2c261c; }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ── loading — white page, tiny envelope, handwritten (the Messenger loader) ── */
  #load { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center;
          background: #faf7ee; color: #2c261c; transition: opacity .6s; }
  #load.hide { opacity: 0; pointer-events: none; }
  #load .t { font-size: 20px; letter-spacing: .18em; font-weight: 400; }
  #load .t::before { content: '✉'; display: block; font-size: 34px; margin-bottom: 8px; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-4deg); } }
  #load .b { margin-top: 12px; width: 150px; height: 3px; border-radius: 2px; background: rgba(44,38,28,.14); overflow: hidden; }
  #load .b i { display: block; height: 100%; width: 30%; background: #2c261c; border-radius: 2px; animation: ld 1.1s ease-in-out infinite; }
  @keyframes ld { 0%{margin-left:-30%} 100%{margin-left:100%} }

  /* ── HUD ── */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  /* paper cards: warm white, ink border, tiny drop — hand-lettered */
  .paper, #task, #score, #dist, #hint {
    background: rgba(250,247,238,.95); color: #2c261c;
    border: 2px solid #2c261c; box-shadow: 0 3px 0 rgba(44,38,28,.22); }
  #task { position: absolute; left: 16px; top: 14px; min-width: 220px;
          border-radius: 12px 14px 11px 13px; padding: 9px 14px; transform: rotate(-.4deg); }
  #task .lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #c04434; }
  #task .dst { font-size: 21px; margin-top: 1px; line-height: 1.05; }
  #task .sub { font-size: 13px; opacity: .72; margin-top: 2px; }
  #score { position: absolute; right: 16px; top: 14px; text-align: right;
           border-radius: 13px 11px 14px 12px; padding: 8px 15px; transform: rotate(.4deg); }
  #score .n { font-size: 26px; line-height: 1; color: #4d8a52; }
  #score .l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .6; margin-top: 2px; }
  #compass { position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
             width: 52px; height: 52px; border-radius: 50%; background: rgba(250,247,238,.95);
             border: 2px solid #2c261c; display: grid; place-items: center;
             box-shadow: 0 3px 0 rgba(44,38,28,.22); }
  #needle { font-size: 20px; color: #c04434; transition: transform .08s linear; }
  #dist { position: absolute; left: 50%; top: 76px; transform: translateX(-50%); font-size: 13px;
          padding: 1px 10px; border-radius: 9px 8px 9px 8px; }
  #hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
          font-size: 14px; opacity: .92; padding: 4px 14px; border-radius: 10px 9px 11px 9px; white-space: nowrap; }
  #toast { position: absolute; left: 50%; top: 36%; transform: translate(-50%,-50%) scale(.8);
           font-size: 30px; color: #2c261c; opacity: 0;
           text-shadow: -1.5px 0 0 #faf7ee, 1.5px 0 0 #faf7ee, 0 -1.5px 0 #faf7ee, 0 2px 0 #faf7ee, 0 4px 0 rgba(44,38,28,.2);
           transition: opacity .25s, transform .25s; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  /* touch controls (mobile only) */
  #touch { position: absolute; inset: 0; pointer-events: none; }
  .tpad { position: absolute; pointer-events: auto; -webkit-user-select: none; user-select: none; touch-action: none; }
  #stick { left: 20px; bottom: 22px; width: 128px; height: 128px; border-radius: 50%;
           background: rgba(250,247,238,.3); border: 2px solid rgba(44,38,28,.55); }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
          border-radius: 50%; background: rgba(250,247,238,.75); border: 2px solid #2c261c; }
  #btnUp, #btnDn { right: 24px; width: 64px; height: 64px; border-radius: 50%;
                   background: rgba(250,247,238,.75); border: 2px solid #2c261c;
                   font-size: 26px; display: grid; place-items: center; }
  #btnUp { bottom: 96px; } #btnDn { bottom: 22px; }
  #btnAct, #btnMap, #btnLog { pointer-events: auto; width: 54px; height: 54px; border-radius: 50%;
    background: rgba(250,247,238,.75); border: 2px solid #2c261c; color: #2c261c;
    font-size: 22px; display: grid; place-items: center; -webkit-user-select: none; user-select: none; touch-action: none; }
  #btnAct { right: 100px; bottom: 40px; font-weight: 800; }
  #btnMap { right: 100px; bottom: 104px; }
  #btnLog { right: 24px; bottom: 168px; }
  @media (hover: hover) and (pointer: fine) { #touch { display: none; } }
</style>
</head>
<body>
<div id="wrap"></div>
<div id="hud">
  <div id="task"><div class="lbl">Loading</div><div class="dst">THE FLY</div><div class="sub">building the town…</div></div>
  <div id="score"><div class="n">0</div><div class="l">delivered</div></div>
  <div id="compass"><div id="needle">▲</div></div>
  <div id="dist">—</div>
  <div id="toast"></div>
  <div id="hint">W/S throttle · A/D turn · Space ascend · Shift descend</div>
  <div id="touch">
    <div id="stick" class="tpad"><div id="knob"></div></div>
    <div id="btnUp" class="tpad">▲</div>
    <div id="btnDn" class="tpad">▼</div>
    <div id="btnAct" class="tpad">E</div>
    <div id="btnMap" class="tpad">🗺</div>
    <div id="btnLog" class="tpad">📋</div>
  </div>
</div>
<div id="load"><div style="text-align:center"><div class="t">THE FLY</div><div class="b"><i></i></div></div></div>

<!-- THREE r128 (classic global build) + post stack -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<!-- screen-space AO (SAO) + its shader deps; wrapped in try/catch at use site -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/UnpackDepthRGBAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/DepthLimitedBlurShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>

<!-- THE FLY town modules (load order matters: lib → assets → world → game) -->
<script src="{{ url_for('static', filename='town/lib.js') }}"></script>
<script src="{{ url_for('static', filename='town/buildings.js') }}"></script>
<script src="{{ url_for('static', filename='town/props.js') }}"></script>
<script src="{{ url_for('static', filename='town/characters.js') }}"></script>
<script src="{{ url_for('static', filename='town/world.js') }}"></script>
<script src="{{ url_for('static', filename='town/game.js') }}"></script>

<script>
/* ═══════════════ BOOTSTRAP ═══════════════ */
(function () {
'use strict';
const T = THREE, wrap = document.getElementById('wrap');

const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;   // open a touch; the value range is wider now
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.fog = new T.FogExp2(0xa8dcd4, 0.0015);   // thin teal paper haze — distance stays flat, not murky
const camera = new T.PerspectiveCamera(54, 1, 0.1, 900);

/* lighting rig — golden-hour / dusk: warm low key light raking long shadows */
const sun = new T.DirectionalLight(0xfff3e0, 1.45);  // a REAL directional key — defines a lit side and a shade side
sun.position.set(62, 74, 44); sun.castShadow = true;   // angled key: clear lit/shade split + grounded contact shadows
// 2048 map + a TIGHT frustum that follows the player each frame (see tick): only
// casters near the camera render into the shadow map → sharp + cheap.
sun.shadow.mapSize.set(2048, 2048);
{ const c = sun.shadow.camera; c.near = 1; c.far = 280; c.left = -70; c.right = 70; c.top = 70; c.bottom = -70; }
sun.shadow.radius = 4; sun.shadow.bias = -0.00018; sun.shadow.normalBias = 0.35;   // crisper contact shadows for grounding
scene.add(sun, sun.target);
const hemi = new T.HemisphereLight(0xcfe4de, 0x8a8474, 0.72); scene.add(hemi);  // cool sky fill — supports the sun, doesn't drown it
const fill = new T.DirectionalLight(0xcfe0e8, 0.35); fill.position.set(-34, 22, -30); scene.add(fill);
const bounce = new T.DirectionalLight(0xefe6d2, 0.18); bounce.position.set(0, -8, 22); scene.add(bounce);

/* sky dome — Messenger look: flat painterly teal, softly lighter toward the
   horizon, with sparse soft-edged brushy clouds (value/fbm noise, 4 octaves). */
const skyMat = new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uTop:   { value: new T.Color(0x53bcae) },  // zenith teal — saturated, flat (the sky IS a color field)
    uHorz:  { value: new T.Color(0x6cc8ba) },  // horizon — barely lighter
    uCloud: { value: new T.Color(0xbfe8dc) },  // clouds are LIGHTER TEAL blobs, not white fluff
    uCShad: { value: new T.Color(0x8fd4c6) },  // cloud underside
    uTime:  { value: 0.0 }
  },
  vertexShader: 'varying vec3 vd; void main(){ vd=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `
    uniform vec3 uTop,uHorz,uCloud,uCShad; uniform float uTime; varying vec3 vd;
    float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
    float vnoise(vec2 p){
      vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
      float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
      return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
    }
    float fbm(vec2 p){
      float v=0.0, a=0.55;
      for(int i=0;i<4;i++){ v+=a*vnoise(p); p*=2.03; a*=0.5; }
      return v;
    }
    void main(){
      // FLAT teal base: only a gentle horizon lift, painterly not gradient-y
      float h=clamp(vd.y,0.0,1.0);
      vec3 sky=mix(uHorz,uTop,smoothstep(0.02,0.55,h));
      // project the upper hemisphere onto a plane for cloud sampling (sparse, drifting)
      float fade=smoothstep(0.06,0.30,vd.y);          // no clouds at the horizon line
      vec2 cp=vd.xz/(vd.y+0.55);
      cp=cp*1.7+vec2(uTime*0.012,uTime*0.004);
      float n=fbm(cp);
      // harder cutout edges → confident flat paper-cloud shapes (Messenger sky)
      float cloud=smoothstep(0.55,0.63,n)*fade;
      float wisp =smoothstep(0.48,0.68,n)*fade*0.25;  // faint feathered edges
      vec3 cc=mix(uCShad,uCloud,smoothstep(0.56,0.72,n));
      vec3 col=mix(sky,cc,cloud);
      col=mix(col,uCloud,wisp);
      gl_FragColor=vec4(col,1.0);
    }`
});
scene.add(new T.Mesh(new T.SphereGeometry(640, 24, 14), skyMat));

/* simple drifting clouds — flat off-white to match the painted sky (no shading) */
const clouds = new T.Group(); scene.add(clouds);
(function makeClouds() {
  const cMat = new T.MeshBasicMaterial({ color: 0xbfe8dc, transparent: true, opacity: 0.95, fog: false });
  for (let i = 0; i < 10; i++) {
    const g = new T.Group();
    const n = 3 + (Math.random() * 3 | 0);
    for (let k = 0; k < n; k++) {
      const puff = new T.Mesh(new T.SphereGeometry(6 + Math.random() * 8, 8, 6), cMat);
      puff.position.set((Math.random() - 0.5) * 22, Math.random() * 4, (Math.random() - 0.5) * 12);
      puff.scale.y = 0.48; g.add(puff);   // flatter puffs → cutout paper look
    }
    g.position.set((Math.random() - 0.5) * 500, 90 + Math.random() * 60, (Math.random() - 0.5) * 500);
    g.userData.drift = 0.6 + Math.random() * 0.8; clouds.add(g);
  }
})();

/* env reflections */
{
  const envS = new T.Scene();
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, '#6f9fd0'); gr.addColorStop(0.55, '#e9dcc2'); gr.addColorStop(1, '#c9b48c');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const tx = new T.CanvasTexture(c); tx.encoding = T.sRGBEncoding;
  envS.add(new T.Mesh(new T.SphereGeometry(50, 16, 10), new T.MeshBasicMaterial({ map: tx, side: T.BackSide })));
  const pm = new T.PMREMGenerator(renderer); scene.environment = pm.fromScene(envS).texture; pm.dispose();
}

/* post: bloom + grade + gamma */
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, uVig: { value: 0.16 }, uCon: { value: 1.13 }, uSat: { value: 1.14 },
    uLift: { value: new T.Vector3(0.018, 0.016, 0.012) }, uGain: { value: new T.Vector3(1.05, 1.02, 0.96) },
    uHatch: { value: 0.07 }, uRes: { value: new T.Vector2(1280, 720) }, uSpeed: { value: 0.0 }, uSpeedCol: { value: new T.Color(0xffffff) } },
  vertexShader: 'varying vec2 v; void main(){ v=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uVig,uCon,uSat,uHatch,uSpeed; uniform vec3 uLift,uGain,uSpeedCol; uniform vec2 uRes; varying vec2 v;
    float hash1(float n){ return fract(sin(n)*43758.5453); }
    void main(){ vec3 c=texture2D(tDiffuse,v).rgb; c=(c-0.5)*uCon+0.5; float l=dot(c,vec3(0.299,0.587,0.114));
      c=mix(vec3(l),c,uSat); float lum=clamp(l,0.0,1.0);
      c+=uLift*(1.0-smoothstep(0.0,0.5,lum)); c*=mix(vec3(1.0),uGain,smoothstep(0.4,1.0,lum));
      // hand-drawn crosshatch: 45-degree pencil lines fade in through the shadows,
      // the cross direction only in the deepest darks (the Messenger paper feel)
      vec2 px=v*uRes;
      float hm=smoothstep(0.52,0.18,lum)*uHatch;
      if(hm>0.001){
        float l1=smoothstep(0.55,0.95,0.5+0.5*sin((px.x+px.y)*0.85));
        float l2=smoothstep(0.55,0.95,0.5+0.5*sin((px.x-px.y)*0.85))*smoothstep(0.34,0.10,lum);
        c*=1.0-hm*(l1*0.55+l2*0.55);
      }
      // faint paper tooth — the page the town is drawn on
      float pg=fract(sin(dot(floor(px*0.5),vec2(127.1,311.7)))*43758.5453);
      c*=0.988+0.024*pg;
      // SPEED LINES — radial ink streaks rushing in from the edges when fast
      if(uSpeed>0.001){
        vec2 rd=v-0.5; float rr2=length(rd); float ang=atan(rd.y,rd.x);
        float lines=sin(ang*46.0+hash1(floor(ang*46.0))*6.28)*0.5+0.5;
        lines=pow(lines,7.0);
        float edge=smoothstep(0.28,0.52,rr2);              // only near the frame edge
        float sl=lines*edge*uSpeed;
        c=mix(c,uSpeedCol,clamp(sl,0.0,0.85));
      }
      vec2 d=v-0.5; float r=dot(d,d)*2.0; c*=mix(1.0,smoothstep(0.95,0.26,r),uVig);
      gl_FragColor=vec4(max(c,0.0),1.0); }`
};
let composer = null, saoPass = null, gradePass = null;
try {
  if (T.EffectComposer && T.UnrealBloomPass && T.GammaCorrectionShader) {
    composer = new T.EffectComposer(renderer);
    composer.addPass(new T.RenderPass(scene, camera));
    composer.addPass(new T.UnrealBloomPass(new T.Vector2(800, 600), 0.14, 0.55, 0.9));
    gradePass = new T.ShaderPass(GradeShader);
    composer.addPass(gradePass);
    composer.addPass(new T.ShaderPass(T.GammaCorrectionShader));
    // (SAO removed — incompatible with the curvature shader, and the cel-shade +
    //  ink outlines already carry the form read; saves a heavy fullscreen pass.)
  }
} catch (e) { composer = null; }

/* ── INK OUTLINES (the Messenger look) ──────────────────────────────────────
   Render the world's view-space normals + depth to an offscreen target, then a
   final post pass edge-detects normal/depth discontinuities into black ink.
   FX/HUD markers live on layer 1 and are excluded from the normal pass so the
   objective beam etc. don't get outlined. */
let normalRT = null, outlinePass = null;
const _normalMat = new T.MeshNormalMaterial();
FLY.lib.curve(_normalMat);   // bend the normal/depth pass identically so ink aligns with the curved world
const LAYER_FX = 1;
if (composer) {
  try {
    normalRT = new T.WebGLRenderTarget(2, 2, { minFilter: T.NearestFilter, magFilter: T.NearestFilter });
    normalRT.depthTexture = new T.DepthTexture();
    const OutlineShader = {
      uniforms: { tDiffuse: { value: null }, tNormal: { value: null }, tDepth: { value: null },
        uTexel: { value: new T.Vector2(1 / 1280, 1 / 720) }, uNear: { value: camera.near }, uFar: { value: camera.far },
        uNStr: { value: 1.0 }, uDStr: { value: 34.0 }, uThick: { value: 0.85 }, uColor: { value: new T.Color(0x241d18) } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader: `uniform sampler2D tDiffuse,tNormal,tDepth; uniform vec2 uTexel; uniform float uNear,uFar,uNStr,uDStr,uThick; uniform vec3 uColor; varying vec2 vUv;
        float rd(vec2 uv){ float z=texture2D(tDepth,uv).x; return (2.0*uNear)/(uFar+uNear-z*(uFar-uNear)); }
        void main(){ vec3 base=texture2D(tDiffuse,vUv).rgb;
          // CLEAN INK: a whisper of wobble only (steady lines read as defined, not
          // scribbled), gentle thickness variation.
          vec2 wUv=vUv+uTexel*vec2(sin(vUv.y*317.0+vUv.x*57.0),cos(vUv.x*291.0-vUv.y*43.0))*0.12;
          float tvar=0.9+0.2*(0.5+0.5*sin(wUv.x*231.0)*sin(wUv.y*187.0));
          // DISTANCE-AWARE: interior creases are a CLOSE-UP privilege and vanish
          // fast with distance so mid/far read as clean shaded shapes, not a line
          // tangle. Silhouettes persist to keep objects separated.
          float dHere=rd(wUv);
          float distF=smoothstep(0.0035, 0.014, dHere);
          float creaseF=smoothstep(0.0025, 0.007, dHere);   // creases die even faster
          vec2 o=uTexel*uThick*tvar;
          vec3 nC=texture2D(tNormal,wUv).xyz*2.0-1.0;
          vec3 nR=texture2D(tNormal,wUv+vec2(o.x,0.0)).xyz*2.0-1.0;
          vec3 nL=texture2D(tNormal,wUv-vec2(o.x,0.0)).xyz*2.0-1.0;
          vec3 nU=texture2D(tNormal,wUv+vec2(0.0,o.y)).xyz*2.0-1.0;
          vec3 nD=texture2D(tNormal,wUv-vec2(0.0,o.y)).xyz*2.0-1.0;
          // normal creases: strongest neighbour difference (sharper than a sum); a
          // dead-zone floor in the smoothstep kills micro-jitter speckle on flat walls
          float ne=max(max(1.0-dot(nC,nR),1.0-dot(nC,nL)),max(1.0-dot(nC,nU),1.0-dot(nC,nD)));
          ne=smoothstep(0.30, 0.9, ne)*uNStr*creaseF;   // only strong, near creases draw
          // depth silhouettes: relative depth break, scaled so distant edges stay solid
          float dC=rd(wUv);
          float de=(abs(dC-rd(wUv+vec2(o.x,0.0)))+abs(dC-rd(wUv-vec2(o.x,0.0)))
                   +abs(dC-rd(wUv+vec2(0.0,o.y)))+abs(dC-rd(wUv-vec2(0.0,o.y))))/(dC+0.04);
          de=smoothstep(0.02, 0.10, de)*(uDStr*0.04)*mix(0.55, 1.0, distF);   // clean object silhouettes
          // bias toward depth-silhouette + strong creases → one clean confident edge
          float edge=clamp(max(de, ne), 0.0, 1.0);
          // ink density breathes a little along the stroke (pen pressure)
          edge=smoothstep(0.5, 0.88, edge)*mix(0.7, 1.0, distF);   // steady, no jitter
          gl_FragColor=vec4(mix(base, uColor, edge), 1.0); }`
    };
    outlinePass = new T.ShaderPass(OutlineShader);
    composer.addPass(outlinePass);
  } catch (e) { outlinePass = null; }
}

/* shared context handed to every module */
const root = new T.Group(); scene.add(root);
const ctx = { THREE: T, lib: FLY.lib, scene, root, renderer, camera, composer, sun, hemi, fill, bounce, fog: scene.fog, skyMat };

/* build the world, then start the game */
let world = null, game = null, fatal = null;
try {
  world = FLY.world.build(ctx);
  game = FLY.game.start(ctx, world);
} catch (e) {
  fatal = e; console.error('FLY boot error:', e);
  document.querySelector('#task .dst').textContent = 'Boot error';
  document.querySelector('#task .sub').textContent = String(e.message || e);
}

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false); if (composer) composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (gradePass) { const pr = renderer.getPixelRatio(); gradePass.uniforms.uRes.value.set(w * pr, h * pr); }
  if (normalRT) {
    const pr = renderer.getPixelRatio(), ns = 1.0;   // FULL device res → crisp, even ink (static-batching covers the cost)
    const nw = Math.max(2, Math.floor(w * pr * ns)), nh = Math.max(2, Math.floor(h * pr * ns));
    normalRT.setSize(nw, nh);
    if (outlinePass) outlinePass.uniforms.uTexel.value.set(1 / nw, 1 / nh);
  }
}
window.addEventListener('resize', resize); resize();

const loadEl = document.getElementById('load');
let started = false, last = performance.now();
let perfFrames = 0, perfAccum = 0, perfTier = 0;
const _sunBase = new T.Vector3(62, 74, 44);    // angled key direction (matches the rig above)
function tick() {
  requestAnimationFrame(tick);
  const now = performance.now(); let dt = (now - last) / 1000; last = now; dt = Math.min(dt, 0.05);
  clouds.children.forEach(c => { c.position.x += c.userData.drift * dt; if (c.position.x > 280) c.position.x = -280; });
  skyMat.uniforms.uTime.value = now * 0.001;   // slow painterly cloud drift
  if (world && world.update) world.update(dt, now);
  if (game && game.update) game.update(dt, now);
  // shadow frustum follows the player so only nearby casters render (cheap + sharp)
  if (ctx.player) {
    const p = ctx.player.pos;
    sun.target.position.set(p.x, 0, p.z);
    sun.position.set(p.x + _sunBase.x, _sunBase.y, p.z + _sunBase.z);
    sun.target.updateMatrixWorld();
  }
  // adaptive governor: if FPS is low, drop pixel-ratio, then disable SAO
  perfFrames++; perfAccum += dt;
  if (perfAccum >= 2.0) {
    const fps = perfFrames / perfAccum; perfFrames = 0; perfAccum = 0;
    if (fps < 44 && perfTier < 1) { perfTier = 1; renderer.setPixelRatio(1); resize(); }
    else if (fps < 28 && perfTier < 2) { perfTier = 2; if (outlinePass) outlinePass.enabled = false; }  // last resort: drop ink
  }
  // ink-outline: render world-only normals+depth offscreen, feed the outline pass
  if (outlinePass && outlinePass.enabled) {
    camera.layers.disableAll(); camera.layers.enable(0);     // world only (FX on layer 1 excluded)
    scene.overrideMaterial = _normalMat;
    renderer.setRenderTarget(normalRT); renderer.clear(); renderer.render(scene, camera);
    renderer.setRenderTarget(null); scene.overrideMaterial = null;
    camera.layers.enableAll();                                // beauty sees everything
    outlinePass.uniforms.tNormal.value = normalRT.texture;
    outlinePass.uniforms.tDepth.value = normalRT.depthTexture;
    outlinePass.uniforms.uNear.value = camera.near; outlinePass.uniforms.uFar.value = camera.far;
  }
  if (composer) composer.render(); else renderer.render(scene, camera);
  if (!started) { started = true; loadEl.classList.add('hide'); }
}
requestAnimationFrame(tick);

// expose for QA / debugging
window.__fly = { ctx, world, game, scene, camera, renderer };
})();
</script>
