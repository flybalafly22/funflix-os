<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Press — FUNFLIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/os.css">
  <style>
    .stage {
      flex: 1; width: 100%;
      max-width: 780px; margin: 0 auto;
      padding: 64px 28px 90px;
      display: flex; flex-direction: column; gap: 32px;
    }

    .mod-head { text-align: center; }
    .mod-over {
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--gray-2);
      margin-bottom: 16px;
    }
    .mod-title {
      font-family: var(--serif); font-weight: 400;
      font-size: clamp(44px, 6vw, 68px);
      letter-spacing: -0.02em; line-height: 0.95;
      color: var(--black);
    }
    .mod-sub {
      margin-top: 12px;
      font-family: var(--serif); font-style: italic;
      font-size: 17px; color: var(--gray);
    }

    .desk {
      background: #fff;
      border: 1px solid var(--rule-2);
      border-radius: 28px;
      padding: 32px 34px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.05);
    }

    .query-row { display: flex; gap: 18px; align-items: flex-end; }
    .query-row .os-input { flex: 1; }
    .query-row .os-btn-primary { width: auto; flex-shrink: 0; padding-left: 28px; padding-right: 28px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 22px; }
    .chip {
      background: none; border: none;
      color: var(--gray-2);
      font-family: var(--sans); font-size: 10px; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase;
      padding: 6px 0;
      position: relative;
      transition: color 0.22s;
    }
    .chip::after {
      content: ''; position: absolute; left: 0; bottom: 2px;
      width: 0; height: 1px; background: var(--black);
      transition: width 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .chip:hover { color: var(--black); }
    .chip:hover::after { width: 100%; }

    /* dispatch sequence */
    .uplink {
      display: none;
      font-family: var(--serif); font-style: italic;
      font-size: 18px;
      line-height: 2.2; color: var(--gray);
    }
    .uplink.show { display: block; }
    .uplink .ul-black { color: var(--black); }

    /* ── the article ── */
    .wire { display: none; }
    .wire.show { display: block; }

    .wire-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      margin-bottom: 26px;
      border-bottom: 1px solid var(--rule-2);
    }
    .wire-meta {
      display: flex; align-items: baseline; gap: 14px;
      font-family: var(--sans); font-size: 10px; font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--gray-2);
    }
    .wire-live { color: var(--black); }
    .copy-btn {
      background: none;
      border: none; border-bottom: 1px solid var(--rule-2);
      color: var(--gray-2);
      font-family: var(--sans); font-size: 10px; font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase;
      padding: 4px 2px;
      transition: all 0.22s;
      display: none;
    }
    .copy-btn.show { display: block; }
    .copy-btn:hover { color: var(--black); border-bottom-color: var(--black); }

    .wire-headline {
      display: none;
      font-family: var(--serif); font-weight: 400;
      font-size: clamp(30px, 4.6vw, 44px);
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: var(--black);
      margin-bottom: 24px;
    }
    .wire-headline.show { display: block; }

    .wire-body {
      font-family: var(--serif);
      font-size: 19px; line-height: 1.9;
      color: #222220;
      white-space: pre-wrap;
      min-height: 40px;
    }
    .wire-body::first-letter {
      font-size: 3.1em;
      float: left;
      line-height: 0.82;
      padding: 8px 12px 0 0;
      color: var(--black);
    }

    .stream-caret {
      display: inline-block; width: 1px; height: 1.05em;
      background: var(--black);
      vertical-align: text-bottom; margin-left: 2px;
      animation: cBlink 0.8s steps(1) infinite;
    }
    @keyframes cBlink { 50% { opacity: 0; } }

    .fault {
      display: none;
      margin-top: 18px;
      border-left: 2px solid var(--rule-2);
      padding: 6px 0 6px 20px;
      font-family: var(--serif); font-style: italic;
      font-size: 17px; color: var(--gray);
      line-height: 1.9;
    }
    .fault.show { display: block; }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="stage">
    <div class="mod-head fade-rise">
      <div class="mod-over">Bureau No. III</div>
      <h1 class="mod-title">The Press</h1>
      <div class="mod-sub">a newsroom staffed by one tireless machine</div>
    </div>

    <div class="desk fade-rise-d1">
      <label class="os-label">Subject of Inquiry</label>
      <div class="query-row">
        <input class="os-input" type="text" id="topicInput" placeholder="what should the world know&hellip;" autocomplete="off"/>
        <button class="os-btn-primary" id="goBtn" onclick="fetchStory()">Commission</button>
      </div>
      <div class="chips">
        <button class="chip" onclick="quickTopic('Artificial Intelligence')">Artificial Intelligence</button>
        <button class="chip" onclick="quickTopic('Quantum Computing')">Quantum Computing</button>
        <button class="chip" onclick="quickTopic('Space Exploration')">Space Exploration</button>
        <button class="chip" onclick="quickTopic('Climate Change')">Climate Change</button>
        <button class="chip" onclick="quickTopic('Global Economy')">Global Economy</button>
        <button class="chip" onclick="quickTopic('Biotech')">Biotech</button>
      </div>
    </div>

    <div class="desk fade-rise-d2" id="outPanel" style="display:none">
      <div class="uplink" id="uplink"></div>

      <div class="wire" id="wire">
        <div class="wire-head">
          <div class="wire-meta">
            <span class="wire-live">The Wire</span>
            <span id="wireStamp">&mdash;</span>
          </div>
          <button class="copy-btn" id="copyBtn" onclick="copyArticle()">Copy Text</button>
        </div>
        <h2 class="wire-headline" id="wireHeadline"></h2>
        <div class="wire-body" id="wireBody"></div>
      </div>

      <div class="fault" id="faultBox"></div>
    </div>
  </div>
</div>

<script src="/static/os.js"></script>
<script>
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let articleText = '';

  function quickTopic(t) {
    document.getElementById('topicInput').value = t;
    fetchStory();
  }

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  async function playUplink(topic) {
    const ul = document.getElementById('uplink');
    ul.innerHTML = '';
    ul.classList.add('show');
    const lines = [
      `Commissioning our correspondent&hellip;`,
      `Subject: <span class="ul-black">${esc(topic)}</span>.`,
      `Consulting sources. A moment of patience&hellip;`,
    ];
    for (const l of lines) {
      const d = document.createElement('div');
      d.innerHTML = l;
      ul.appendChild(d);
      await sleep(340);
    }
  }

  async function fetchStory() {
    const topic = document.getElementById('topicInput').value.trim();
    if (!topic) return;

    const panel    = document.getElementById('outPanel');
    const uplink   = document.getElementById('uplink');
    const wire     = document.getElementById('wire');
    const headline = document.getElementById('wireHeadline');
    const bodyEl   = document.getElementById('wireBody');
    const fault    = document.getElementById('faultBox');
    const btn      = document.getElementById('goBtn');
    const copyBtn  = document.getElementById('copyBtn');

    panel.style.display = 'block';
    wire.classList.remove('show');
    fault.classList.remove('show');
    headline.classList.remove('show');
    headline.textContent = '';
    bodyEl.textContent = '';
    copyBtn.classList.remove('show');
    articleText = '';
    btn.disabled = true;

    const uplinkDone = playUplink(topic);

    try {
      const res = await fetch('/api/journalist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic }),
      });
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.error || 'a fault at the bureau');
      }
      await uplinkDone;

      uplink.classList.remove('show');
      wire.classList.add('show');
      const now = new Date();
      document.getElementById('wireStamp').textContent =
        now.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });

      const caret = document.createElement('span');
      caret.className = 'stream-caret';
      bodyEl.appendChild(caret);

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '', headlineDone = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        articleText += chunk;

        if (!headlineDone) {
          buf += chunk;
          const nl = buf.indexOf('\n');
          headline.classList.add('show');
          if (nl === -1) {
            headline.textContent = cleanLine(buf);
          } else {
            headline.textContent = cleanLine(buf.slice(0, nl));
            headlineDone = true;
            caret.insertAdjacentText('beforebegin', buf.slice(nl + 1).replace(/^\n+/, ''));
          }
        } else {
          caret.insertAdjacentText('beforebegin', chunk);
        }
      }
      caret.remove();

      if (articleText.startsWith('ERROR:')) {
        wire.classList.remove('show');
        fault.textContent = articleText.replace(/^ERROR:\s*/, 'Regrettably — ');
        fault.classList.add('show');
        return;
      }
      copyBtn.classList.add('show');
    } catch (err) {
      uplink.classList.remove('show');
      wire.classList.remove('show');
      fault.textContent = 'Regrettably, the dispatch was lost in transit — ' + err.message;
      fault.classList.add('show');
    } finally {
      btn.disabled = false;
    }
  }

  function cleanLine(s) {
    return s.replace(/^#+\s*/, '').replace(/\*\*/g, '').trim();
  }

  function copyArticle() {
    navigator.clipboard.writeText(articleText).then(() => {
      const b = document.getElementById('copyBtn');
      b.textContent = 'Copied';
      setTimeout(() => b.textContent = 'Copy Text', 1800);
    });
  }

  document.getElementById('topicInput').addEventListener('keydown', e => {
    if (window.OS && OS.paletteOpen) return;
    if (e.key === 'Enter') fetchStory();
  });
</script>
</body>
</html>
