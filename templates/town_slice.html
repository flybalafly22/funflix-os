<!DOCTYPE html>
<!-- THE FLY — town calibration slice: one detailed city block (flat, Messenger-density target) -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>THE FLY — town slice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #cde0ee; }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #tag { position: absolute; left: 14px; bottom: 12px; z-index: 5; font: 500 11px ui-monospace, Menlo, monospace;
         color: #fff; background: rgba(10,14,22,0.5); padding: 6px 10px; border-radius: 8px; backdrop-filter: blur(6px); letter-spacing: .04em; }
</style>
</head>
<body>
<div id="wrap"><div id="tag">THE FLY · town calibration slice — drag to orbit</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
  const wrap = document.getElementById('wrap');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const TAU = Math.PI * 2;

  /* ════════ RENDERER / SCENE / CAMERA ════════ */
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.80;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  wrap.appendChild(renderer.domElement);
  const canvas = renderer.domElement;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xdfe6ea, 0.0042);
  const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 600);

  /* ════════ LIGHTING — warm golden hour ════════ */
  const sun = new THREE.DirectionalLight(0xffe2b0, 1.5);
  sun.position.set(34, 46, 22);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  { const c = sun.shadow.camera; c.near = 6; c.far = 160; c.left = -50; c.right = 50; c.top = 50; c.bottom = -50; }
  sun.shadow.radius = 6; sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.4;
  scene.add(sun); scene.add(sun.target);
  scene.add(new THREE.HemisphereLight(0xcfe2f4, 0x6a5b46, 0.55));
  const fill = new THREE.DirectionalLight(0xbcd0f0, 0.22); fill.position.set(-30, 20, -24); scene.add(fill);

  /* gradient sky dome */
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uZ: { value: new THREE.Color(0x6fa6d6) }, uM: { value: new THREE.Color(0xcfe2ee) }, uH: { value: new THREE.Color(0xf3dcb6) } },
    vertexShader: 'varying vec3 vd; void main(){ vd = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 uZ,uM,uH; varying vec3 vd; void main(){ float h=clamp(vd.y*0.5+0.5,0.0,1.0); vec3 c = h<0.5 ? mix(uH,uM,smoothstep(0.0,0.5,h)) : mix(uM,uZ,smoothstep(0.5,1.0,h)); gl_FragColor=vec4(c,1.0); }'
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), skyMat);
  sky.renderOrder = -1; scene.add(sky);

  /* env reflections (small) */
  {
    const envS = new THREE.Scene();
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 64); gr.addColorStop(0, '#8fb8e0'); gr.addColorStop(0.6, '#e7eef2'); gr.addColorStop(1, '#cabf9c');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
    envS.add(new THREE.Mesh(new THREE.SphereGeometry(50, 16, 10), new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide })));
    const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(envS).texture; pm.dispose();
  }

  /* ════════ POST: grade + bloom ════════ */
  const GradeShader = {
    uniforms: { tDiffuse: { value: null }, uVig: { value: 0.22 }, uCon: { value: 1.05 }, uSat: { value: 1.07 },
      uLift: { value: new THREE.Vector3(0.012, 0.008, 0.0) }, uGain: { value: new THREE.Vector3(1.03, 1.0, 0.95) } },
    vertexShader: 'varying vec2 v; void main(){ v=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform float uVig,uCon,uSat; uniform vec3 uLift,uGain; varying vec2 v;
      void main(){ vec3 c=texture2D(tDiffuse,v).rgb; c=(c-0.5)*uCon+0.5; float l=dot(c,vec3(0.299,0.587,0.114)); c=mix(vec3(l),c,uSat);
        float lum=clamp(l,0.0,1.0); c += uLift*(1.0-smoothstep(0.0,0.5,lum)); c *= mix(vec3(1.0),uGain,smoothstep(0.4,1.0,lum));
        vec2 d=v-0.5; float r=dot(d,d)*2.0; c*=mix(1.0,smoothstep(0.95,0.30,r),uVig);
        gl_FragColor=vec4(max(c,0.0),1.0); }`
  };
  let composer = null, gradePass = null;
  if (THREE.EffectComposer && THREE.UnrealBloomPass && THREE.GammaCorrectionShader) {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(800, 600), 0.16, 0.5, 0.92));
    gradePass = new THREE.ShaderPass(GradeShader); composer.addPass(gradePass);
    composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  }

  /* ════════ SHARED MATERIALS + TEXTURE HELPERS ════════ */
  const cnv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  function noiseTex(base, spec) {
    const c = cnv(128, 128), g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`; g.fillRect(Math.random() * 128, Math.random() * 128, 1, 1); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; return t;
  }
  const matAsphalt = new THREE.MeshStandardMaterial({ map: (() => { const t = noiseTex('#3b3f47'); t.repeat.set(8, 8); return t; })(), roughness: 0.92, metalness: 0.0 });
  const matSidewalk = new THREE.MeshStandardMaterial({ color: 0xb9b2a3, roughness: 0.95 });
  const matCurb = new THREE.MeshStandardMaterial({ color: 0xd8d2c4, roughness: 0.9 });
  const matKerbEdge = new THREE.MeshStandardMaterial({ color: 0x9a9486, roughness: 0.9 });
  const matMetalDark = new THREE.MeshStandardMaterial({ color: 0x2a2e36, roughness: 0.5, metalness: 0.6 });
  const matGlass = new THREE.MeshStandardMaterial({ color: 0x20303e, roughness: 0.08, metalness: 0.9, envMapIntensity: 1.3 });
  const matGlassLit = new THREE.MeshStandardMaterial({ color: 0xffe6b0, emissive: 0xffd28a, emissiveIntensity: 0.7, roughness: 0.3 });
  const wallCols = [0xd9a06a, 0xc77f63, 0xa8b894, 0x8fa6be, 0xd8bb7e, 0xc095a6, 0xe0c389, 0x9aac95, 0xcf8f72, 0x86a0ad];
  const roofCols = [0x8a5d4e, 0x5c6b78, 0x7d6e86, 0xb08a52, 0x6f7d5e];
  const trimCols = [0xfbf6ea, 0xeadfce, 0xf2e7d2];

  const root = new THREE.Group(); scene.add(root);

  /* global window instancing — collected across all buildings, drawn in 2 calls */
  const winGlass = [], winLit = [], winFrame = [];

  /* ════════ GROUND: street + sidewalks + curbs + crossing + markings ════════ */
  const STREET_HALF = 7;       // half street width (asphalt)
  const SIDEWALK_W = 4.2;      // sidewalk depth each side
  const CURB_H = 0.22;
  const BLOCK_LEN = 76;        // length of the block along x
  {
    const road = new THREE.Mesh(new THREE.PlaneGeometry(BLOCK_LEN, STREET_HALF * 2), matAsphalt);
    road.rotation.x = -Math.PI / 2; road.receiveShadow = true; root.add(road);

    // lane dashes (centre line)
    const dashGeo = new THREE.PlaneGeometry(1.6, 0.16);
    const dashMat = new THREE.MeshStandardMaterial({ color: 0xd8cfae, roughness: 0.8 });
    for (let x = -BLOCK_LEN / 2 + 2; x < BLOCK_LEN / 2; x += 4) {
      const d = new THREE.Mesh(dashGeo, dashMat); d.rotation.x = -Math.PI / 2; d.position.set(x, 0.02, 0); root.add(d);
    }
    // crossing (zebra) near one end
    for (let i = 0; i < 7; i++) {
      const s = new THREE.Mesh(new THREE.PlaneGeometry(0.55, STREET_HALF * 2 - 0.6), new THREE.MeshStandardMaterial({ color: 0xeae3cd, roughness: 0.85 }));
      s.rotation.x = -Math.PI / 2; s.position.set(-BLOCK_LEN / 2 + 6 + i * 1.0, 0.025, 0); root.add(s);
    }

    [1, -1].forEach(side => {
      const z0 = side * (STREET_HALF + SIDEWALK_W / 2);
      // sidewalk slab (raised)
      const sw = new THREE.Mesh(new THREE.BoxGeometry(BLOCK_LEN, CURB_H, SIDEWALK_W), matSidewalk);
      sw.position.set(0, CURB_H / 2, z0); sw.receiveShadow = true; root.add(sw);
      // curb edge facing the street
      const curb = new THREE.Mesh(new THREE.BoxGeometry(BLOCK_LEN, CURB_H + 0.04, 0.18), matCurb);
      curb.position.set(0, (CURB_H + 0.04) / 2, side * (STREET_HALF + 0.09)); curb.castShadow = true; curb.receiveShadow = true; root.add(curb);
      // expansion-joint lines on the sidewalk
      const jMat = new THREE.MeshStandardMaterial({ color: 0x8f897b, roughness: 0.95 });
      for (let x = -BLOCK_LEN / 2 + 3; x < BLOCK_LEN / 2; x += 3) {
        const j = new THREE.Mesh(new THREE.PlaneGeometry(0.05, SIDEWALK_W - 0.2), jMat);
        j.rotation.x = -Math.PI / 2; j.position.set(x, CURB_H + 0.011, z0); root.add(j);
      }
    });
  }

  /* ════════ DETAIL FACTORIES ════════ */
  // shop signage texture
  const SHOP_NAMES = ['CAFÉ MOTT', 'LIBRERÍA', 'FLORERÍA', 'PANADERÍA', 'EL BUZÓN', 'BOTÁNICA', 'RELOJERÍA', 'HELADOS', 'SASTRE', 'FERRETERÍA', 'PESCADERÍA', 'TABACOS'];
  const SIGN_BG = ['#b5453f', '#2f6f5e', '#3b5a8a', '#c8853a', '#7a4f86', '#456b3a'];
  function signTex(name, bg) {
    const c = cnv(256, 64), g = c.getContext('2d');
    g.fillStyle = bg; g.fillRect(0, 0, 256, 64);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(0, 0, 256, 8);
    g.fillStyle = '#fdf3df'; g.font = 'bold 30px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(name, 128, 36);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
  }

  // a striped awning canvas
  function awningTex(a, b) {
    const c = cnv(64, 32), g = c.getContext('2d');
    for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? a : b; g.fillRect(i * 8, 0, 8, 32); }
    const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; return t;
  }
  const AWNING_PAIRS = [['#c44a44', '#f4ecd8'], ['#2f7060', '#f4ecd8'], ['#3a5d92', '#f4ecd8'], ['#c8893f', '#f6efdc'], ['#7a4f86', '#f4ecd8']];

  // collect window quad transforms onto the front face of a building
  const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(1, 1, 1), _p = new THREE.Vector3();
  function addWindows(x, z, w, h, faceZ, floors, groundOffset) {
    const cols = Math.max(2, Math.floor(w / 2.2));
    const winW = 0.9, winH = 1.2;
    const colGap = w / cols;
    const floorH = 3.0;
    for (let f = 0; f < floors; f++) {
      const wy = groundOffset + 1.6 + f * floorH;
      if (wy + winH / 2 > h - 0.5) break;
      for (let cI = 0; cI < cols; cI++) {
        const wx = x - w / 2 + colGap * (cI + 0.5);
        const wz = z + faceZ * 0.06;
        _p.set(wx, wy, wz); _q.identity();
        _s.set(winW, winH, 1); _m.compose(_p, _q, _s);
        (Math.random() < 0.22 ? winLit : winGlass).push(_m.clone());
        // frame slightly larger, behind
        _s.set(winW + 0.18, winH + 0.18, 1); _p.set(wx, wy, z + faceZ * 0.045); _m.compose(_p, _q, _s);
        winFrame.push(_m.clone());
      }
    }
  }

  function makeRooftop(g, x, z, w, d, h, wallMat) {
    // parapet
    const pp = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.5, d + 0.1), wallMat);
    pp.position.set(x, h + 0.25, z); pp.castShadow = true; g.add(pp);
    const inner = new THREE.Mesh(new THREE.BoxGeometry(w - 0.5, 0.55, d - 0.5), new THREE.MeshStandardMaterial({ color: 0x4a4640, roughness: 1 }));
    inner.position.set(x, h + 0.28, z); g.add(inner);
    // water tank
    if (Math.random() < 0.6) {
      const tk = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.1, 10), new THREE.MeshStandardMaterial({ color: 0x7e6a52, roughness: 0.85 }));
      tk.position.set(x + rand(-w / 4, w / 4), h + 1.05, z + rand(-d / 4, d / 4)); tk.castShadow = true; g.add(tk);
      const legs = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.9), matMetalDark); legs.position.set(tk.position.x, h + 0.4, tk.position.z); g.add(legs);
    }
    // AC / vents
    for (let i = 0; i < 2 + (Math.random() * 2 | 0); i++) {
      const ac = new THREE.Mesh(new THREE.BoxGeometry(rand(0.6, 1.0), rand(0.4, 0.6), rand(0.6, 0.9)), new THREE.MeshStandardMaterial({ color: 0x9a9488, roughness: 0.7 }));
      ac.position.set(x + rand(-w / 3, w / 3), h + 0.55, z + rand(-d / 3, d / 3)); ac.castShadow = true; g.add(ac);
    }
  }

  // one building facing the street (+z faces toward street center for near side -> faceZ +1)
  function makeBuilding(x, z, w, d, floors, faceZ) {
    const g = new THREE.Group();
    const h = 2.2 + floors * 3.0;
    const wallMat = new THREE.MeshStandardMaterial({ color: pick(wallCols), roughness: 0.9 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    body.position.set(x, h / 2, z); body.castShadow = true; body.receiveShadow = true; g.add(body);

    // string-course bands between floors (cornice lines)
    const trimMat = new THREE.MeshStandardMaterial({ color: pick(trimCols), roughness: 0.85 });
    for (let f = 1; f <= floors; f++) {
      const band = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, 0.18, d + 0.12), trimMat);
      band.position.set(x, 2.2 + f * 3.0 - 0.2, z); g.add(band);
    }
    // top cornice
    const cor = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.35, d + 0.3), trimMat);
    cor.position.set(x, h - 0.1, z); cor.castShadow = true; g.add(cor);

    // windows on the street-facing side
    addWindows(x, z + faceZ * (d / 2), w - 0.6, h, faceZ, floors, 0);

    // ground-floor shopfront: dark recessed glass + door + awning + sign
    const sfH = 2.0, sfZ = z + faceZ * (d / 2 + 0.02);
    const shop = new THREE.Mesh(new THREE.BoxGeometry(w - 0.5, sfH, 0.1), matGlass);
    shop.position.set(x, sfH / 2 + 0.05, sfZ); g.add(shop);
    // door
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.9, 0.12), new THREE.MeshStandardMaterial({ color: pick([0x5a3b2a, 0x35506a, 0x3a5e4a]), roughness: 0.7 }));
    door.position.set(x + rand(-w / 4, w / 4), 0.97, sfZ + faceZ * 0.04); g.add(door);
    // sign board above shopfront
    const sgT = signTex(pick(SHOP_NAMES), pick(SIGN_BG));
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(Math.min(w - 0.6, 4.2), 0.95), new THREE.MeshStandardMaterial({ map: sgT, roughness: 0.6 }));
    sign.position.set(x, 2.5, sfZ + faceZ * 0.08); if (faceZ < 0) sign.rotation.y = Math.PI; g.add(sign);
    // awning
    const [ac1, ac2] = pick(AWNING_PAIRS);
    const awMat = new THREE.MeshStandardMaterial({ map: awningTex(ac1, ac2), roughness: 0.85, side: THREE.DoubleSide });
    awMat.map.repeat.set(Math.max(2, (w - 0.6) / 1.0), 1);
    const aw = new THREE.Mesh(new THREE.BoxGeometry(w - 0.6, 0.08, 1.3), awMat);
    aw.position.set(x, 2.05, sfZ + faceZ * 0.7); aw.rotation.x = faceZ * 0.32; aw.castShadow = true; g.add(aw);
    // awning valance (hanging frill)
    const val = new THREE.Mesh(new THREE.BoxGeometry(w - 0.6, 0.28, 0.04), awMat);
    val.position.set(x, 1.78, sfZ + faceZ * 1.28); g.add(val);

    makeRooftop(g, x, z, w, d, h, wallMat);
    g.castShadow = true;
    return g;
  }

  /* ── place a row of buildings on each sidewalk ── */
  function buildRow(side) {
    const faceZ = -side;  // buildings sit beyond the sidewalk; faces point toward street (toward z=0)
    const zBack = side * (STREET_HALF + SIDEWALK_W);
    let x = -BLOCK_LEN / 2 + 3;
    while (x < BLOCK_LEN / 2 - 6) {
      const w = rand(6, 10), d = rand(7, 9);
      const floors = 1 + (Math.random() * 4 | 0);
      const cx = x + w / 2;
      const z = zBack + side * (d / 2);   // building footprint sits behind the sidewalk
      root.add(makeBuilding(cx, z, w, d, floors, faceZ));
      x += w + rand(0.4, 1.0);
    }
  }
  buildRow(1); buildRow(-1);

  // build the two big instanced window meshes
  function instMesh(list, geo, mat) { if (!list.length) return; const im = new THREE.InstancedMesh(geo, mat, list.length); list.forEach((m, i) => im.setMatrixAt(i, m)); im.instanceMatrix.needsUpdate = true; root.add(im); }
  const winGeo = new THREE.PlaneGeometry(1, 1);
  instMesh(winFrame, winGeo, new THREE.MeshStandardMaterial({ color: 0x2c2b29, roughness: 0.8 }));
  instMesh(winGlass, winGeo, matGlass);
  instMesh(winLit, winGeo, matGlassLit);

  /* ════════ STREET FURNITURE ════════ */
  function makeLamp() {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 4.2, 8), matMetalDark); pole.position.y = 2.1; pole.castShadow = true; g.add(pole);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.8, 6), matMetalDark); arm.rotation.z = Math.PI / 2; arm.position.set(0.35, 4.1, 0); g.add(arm);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 8), new THREE.MeshStandardMaterial({ color: 0xfff2cf, emissive: 0xffe6a0, emissiveIntensity: 0.5, roughness: 0.4 }));
    head.position.set(0.7, 4.0, 0); g.add(head);
    return g;
  }
  function makeBench() {
    const g = new THREE.Group();
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x8a5a38, roughness: 0.85 });
    const seat = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.5), woodMat); seat.position.y = 0.45; seat.castShadow = true; g.add(seat);
    const back = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 0.1), woodMat); back.position.set(0, 0.7, -0.2); g.add(back);
    [-0.8, 0.8].forEach(dx => { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.45, 0.45), matMetalDark); leg.position.set(dx, 0.22, 0); g.add(leg); });
    return g;
  }
  function makeBin() {
    const g = new THREE.Group();
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.22, 0.8, 10), new THREE.MeshStandardMaterial({ color: 0x3f5d46, roughness: 0.7, metalness: 0.3 }));
    b.position.y = 0.4; b.castShadow = true; g.add(b); return g;
  }
  function makePlanter() {
    const g = new THREE.Group();
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.8), new THREE.MeshStandardMaterial({ color: 0xb8a386, roughness: 0.9 })); box.position.y = 0.25; box.castShadow = true; g.add(box);
    const bush = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 1), new THREE.MeshStandardMaterial({ color: pick([0x6f9a55, 0x7faa60]), roughness: 0.95 })); bush.position.y = 0.7; bush.scale.y = 0.8; bush.castShadow = true; g.add(bush);
    return g;
  }
  function makeHydrant() {
    const g = new THREE.Group();
    const m = new THREE.MeshStandardMaterial({ color: 0xc23a32, roughness: 0.6 });
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.5, 8), m); b.position.y = 0.25; b.castShadow = true; g.add(b);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 6), m); cap.position.y = 0.52; g.add(cap);
    [-0.16, 0.16].forEach(dx => { const a = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.14, 6), m); a.rotation.z = Math.PI / 2; a.position.set(dx, 0.4, 0); g.add(a); });
    return g;
  }
  function makeTree() {
    const g = new THREE.Group();
    const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.2, 1.6, 7), new THREE.MeshStandardMaterial({ color: 0x7a5a3c, roughness: 0.95 })); tr.position.y = 0.8; tr.castShadow = true; g.add(tr);
    [[0, 2.3, 0, 1.0], [0.4, 2.6, 0.2, 0.72], [-0.35, 2.55, -0.2, 0.66]].forEach(([px, py, pz, r]) => {
      const lobe = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), new THREE.MeshStandardMaterial({ color: pick([0x6f9a55, 0x80a862, 0x638c4c]), roughness: 0.95 }));
      lobe.position.set(px, py, pz); lobe.castShadow = true; g.add(lobe);
    });
    return g;
  }

  // scatter furniture along both sidewalks
  [1, -1].forEach(side => {
    const z = side * (STREET_HALF + 1.1);   // just inside the curb
    let x = -BLOCK_LEN / 2 + 4;
    let i = 0;
    while (x < BLOCK_LEN / 2 - 4) {
      const r = (i + (side > 0 ? 0 : 2)) % 5;
      let obj;
      if (r === 0) obj = makeLamp();
      else if (r === 1) obj = makeTree();
      else if (r === 2) obj = makeBench();
      else if (r === 3) obj = makePlanter();
      else obj = Math.random() < 0.5 ? makeBin() : makeHydrant();
      obj.position.set(x, CURB_H, z);
      if (side < 0) obj.rotation.y = Math.PI;
      root.add(obj);
      x += rand(5, 8); i++;
    }
  });

  /* ════════ PARKED VEHICLES ════════ */
  const carBodyCols = [0xcf4b46, 0x3f6fae, 0x2f8f6f, 0xe0c24a, 0xded6cc, 0x40444c, 0xc77b3a];
  function makeCar() {
    const g = new THREE.Group();
    const col = pick(carBodyCols);
    const bodyMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.35, metalness: 0.4, envMapIntensity: 1.2 });
    const lower = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.7, 1.7), bodyMat); lower.position.y = 0.65; lower.castShadow = true; g.add(lower);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.7, 1.55), bodyMat); cabin.position.set(-0.1, 1.25, 0); cabin.castShadow = true; g.add(cabin);
    const glass = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.6, 1.45), matGlass); glass.position.set(-0.1, 1.27, 0); g.add(glass);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x14151a, roughness: 0.9 });
    [[1.2, 0.85], [1.2, -0.85], [-1.2, 0.85], [-1.2, -0.85]].forEach(([wx, wz]) => {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.26, 12), wheelMat); wheel.rotation.x = Math.PI / 2; wheel.position.set(wx, 0.34, wz); wheel.castShadow = true; g.add(wheel);
    });
    // headlights / tail
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.18, 0.3), new THREE.MeshStandardMaterial({ color: 0xfff6da, emissive: 0xfff0c0, emissiveIntensity: 0.3 }));
    hl.position.set(2.0, 0.7, 0.55); g.add(hl); const hl2 = hl.clone(); hl2.position.z = -0.55; g.add(hl2);
    return g;
  }
  // park a few along the near curb
  [-26, -8, 12, 30].forEach((x, i) => {
    const side = i % 2 ? -1 : 1;
    const car = makeCar();
    car.position.set(x, 0, side * (STREET_HALF - 1.2));
    car.rotation.y = side > 0 ? 0 : Math.PI;
    root.add(car);
  });

  /* ════════ NPCS (pedestrians) ════════ */
  const npcCols = [0xd96f8a, 0x6fae9f, 0xe0b25a, 0x8f8fc4, 0x70a0d0, 0xd98f6a];
  const npcs = [];
  function makeNPC() {
    const g = new THREE.Group();
    const col = pick(npcCols);
    const bodyGeo = THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.22, 0.5, 4, 8) : new THREE.CylinderGeometry(0.22, 0.24, 0.95, 8);
    const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: col, roughness: 0.85 }));
    body.position.y = 0.7; body.castShadow = true; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), new THREE.MeshStandardMaterial({ color: 0xf0c9a0, roughness: 0.7 })); head.position.y = 1.25; head.castShadow = true; g.add(head);
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.19, 10, 8), new THREE.MeshStandardMaterial({ color: pick([0x2a1d14, 0x4a3322, 0x6b4a2c, 0x1a1a1f]), roughness: 0.9 })); hair.position.y = 1.32; hair.scale.y = 0.7; g.add(hair);
    const legs = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.5, 0.26), new THREE.MeshStandardMaterial({ color: 0x394050, roughness: 0.9 })); legs.position.y = 0.3; g.add(legs);
    return g;
  }
  [1, -1].forEach(side => {
    for (let k = 0; k < 3; k++) {
      const n = makeNPC();
      const x = rand(-BLOCK_LEN / 2 + 6, BLOCK_LEN / 2 - 6);
      n.position.set(x, CURB_H, side * (STREET_HALF + rand(1.4, 3.2)));
      n.userData = { speed: rand(1.0, 1.8) * (Math.random() < 0.5 ? 1 : -1), z: n.position.z, phase: rand(0, TAU) };
      n.rotation.y = n.userData.speed > 0 ? Math.PI / 2 : -Math.PI / 2;
      root.add(n); npcs.push(n);
    }
  });

  /* ════════ CAMERA ORBIT + LOOP ════════ */
  let yaw = -1.12, pitch = 0.12, dist = 23, drag = false, lx = 0, ly = 0;
  const target = new THREE.Vector3(3, 2.6, 0);
  canvas.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
  addEventListener('pointerup', () => drag = false);
  addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX - lx) * 0.005; pitch = clamp(pitch + (e.clientY - ly) * 0.004, 0.08, 1.2); lx = e.clientX; ly = e.clientY; });
  addEventListener('wheel', e => { dist = clamp(dist + e.deltaY * 0.02, 14, 70); });

  function resize() { const w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h, false); if (composer) composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();

  let last = performance.now();
  function tick() {
    requestAnimationFrame(tick);
    const now = performance.now(); let dt = (now - last) / 1000; last = now; dt = Math.min(dt, 0.05);
    // gentle auto-orbit when idle
    if (!drag) yaw += dt * 0.012;
    const cp = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(dist);
    camera.position.copy(target).add(cp); camera.lookAt(target);
    // NPC stroll
    npcs.forEach(n => {
      n.position.x += n.userData.speed * dt;
      if (n.position.x > BLOCK_LEN / 2 - 5) n.userData.speed = -Math.abs(n.userData.speed);
      if (n.position.x < -BLOCK_LEN / 2 + 5) n.userData.speed = Math.abs(n.userData.speed);
      n.rotation.y = n.userData.speed > 0 ? Math.PI / 2 : -Math.PI / 2;
      n.position.y = CURB_H + Math.abs(Math.sin(now * 0.006 + n.userData.phase)) * 0.05;
    });
    if (composer) composer.render(); else renderer.render(scene, camera);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
