<!DOCTYPE html>
<!-- THE FLY — town slice v2: hand-authored street, Messenger-density -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>THE FLY — town</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #c8d8e8; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ── HUD ── */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  #task {
    position: absolute; left: 16px; top: 14px; min-width: 210px;
    background: rgba(14,20,30,0.62); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
    padding: 11px 15px; color: #fff; box-shadow: 0 8px 28px rgba(0,0,0,.28);
  }
  #task .lbl { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #ffd27a; font-weight: 700; }
  #task .dst { font-size: 19px; font-weight: 800; margin-top: 2px; letter-spacing: .01em; }
  #task .sub { font-size: 11px; opacity: .7; margin-top: 3px; }
  #score {
    position: absolute; right: 16px; top: 14px; text-align: right;
    background: rgba(14,20,30,0.62); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
    padding: 10px 16px; color: #fff; box-shadow: 0 8px 28px rgba(0,0,0,.28);
  }
  #score .n { font-size: 26px; font-weight: 800; line-height: 1; color: #7fe0a0; }
  #score .l { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .65; margin-top: 3px; }
  /* compass needle to the target */
  #compass {
    position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(14,20,30,0.55); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.16); display: grid; place-items: center;
    box-shadow: 0 6px 22px rgba(0,0,0,.28);
  }
  #needle { font-size: 22px; color: #ffd27a; transition: transform .08s linear; text-shadow: 0 0 8px rgba(255,200,90,.7); }
  #dist { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); font-size: 11px; color: #fff;
          background: rgba(14,20,30,0.5); padding: 2px 9px; border-radius: 8px; font-weight: 700; }
  #hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 600 11px ui-monospace, Menlo, monospace; color: #fff; opacity: .82;
    background: rgba(10,14,22,0.5); padding: 7px 13px; border-radius: 10px;
    backdrop-filter: blur(6px); letter-spacing: .03em; text-align: center; white-space: nowrap;
  }
  #toast {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%) scale(.8);
    font-size: 30px; font-weight: 900; color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,.5);
    opacity: 0; transition: opacity .25s, transform .25s; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  /* touch controls */
  #touch { position: absolute; inset: 0; pointer-events: none; }
  .tpad { position: absolute; pointer-events: auto; -webkit-user-select: none; user-select: none; touch-action: none; }
  #stick { left: 20px; bottom: 22px; width: 128px; height: 128px; border-radius: 50%;
           background: rgba(255,255,255,.10); border: 1.5px solid rgba(255,255,255,.25); }
  #knob  { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
           border-radius: 50%; background: rgba(255,255,255,.32); border: 1.5px solid rgba(255,255,255,.5); }
  #btnUp, #btnDn { right: 24px; width: 64px; height: 64px; border-radius: 50%;
                   background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.3);
                   color: #fff; font-size: 26px; display: grid; place-items: center; font-weight: 800; }
  #btnUp { bottom: 96px; } #btnDn { bottom: 22px; }
  @media (hover: hover) and (pointer: fine) { #touch { display: none; } }
</style>
</head>
<body>
<div id="wrap"></div>
<div id="hud">
  <div id="task"><div class="lbl">Pick up letter</div><div class="dst">—</div><div class="sub"></div></div>
  <div id="score"><div class="n">0</div><div class="l">delivered</div></div>
  <div id="compass"><div id="needle">▲</div></div>
  <div id="dist">—</div>
  <div id="toast"></div>
  <div id="hint">W/S throttle · A/D turn · Space ascend · Shift descend</div>
  <div id="touch">
    <div id="stick" class="tpad"><div id="knob"></div></div>
    <div id="btnUp" class="tpad">▲</div>
    <div id="btnDn" class="tpad">▼</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
'use strict';
const wrap = document.getElementById('wrap');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const pick  = arr => arr[(Math.random() * arr.length) | 0];
const TAU   = Math.PI * 2;

/* ═══════════════════════════════════════════════
   RENDERER
═══════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding  = THREE.sRGBEncoding;
renderer.toneMapping     = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
renderer.shadowMap.enabled   = true;
renderer.shadowMap.type      = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene  = new THREE.Scene();
scene.fog    = new THREE.FogExp2(0xd8e4ed, 0.0036);
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 700);

/* ═══════════════════════════════════════════════
   LIGHTING
═══════════════════════════════════════════════ */
const sun = new THREE.DirectionalLight(0xffe4b8, 1.8);
sun.position.set(28, 50, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
{ const c = sun.shadow.camera; c.near = 5; c.far = 220; c.left = -70; c.right = 70; c.top = 70; c.bottom = -70; }
sun.shadow.radius = 5; sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.3;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xc8dcf2, 0x7a6850, 0.65));
const fill = new THREE.DirectionalLight(0xb8d0f4, 0.28); fill.position.set(-30, 18, -28); scene.add(fill);
const bounce = new THREE.DirectionalLight(0xffe0a0, 0.18); bounce.position.set(0, -10, 20); scene.add(bounce);

/* sky dome */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uZ: { value: new THREE.Color(0x4a8cc8) },
    uM: { value: new THREE.Color(0xa8c8e4) },
    uH: { value: new THREE.Color(0xf0d8a8) }
  },
  vertexShader:   'varying vec3 vd; void main(){ vd=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 uZ,uM,uH; varying vec3 vd; void main(){ float h=clamp(vd.y*0.5+0.5,0.0,1.0); vec3 c=h<0.5?mix(uH,uM,smoothstep(0.0,0.5,h)):mix(uM,uZ,smoothstep(0.5,1.0,h)); gl_FragColor=vec4(c,1.0); }'
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 24, 14), skyMat));

/* env map */
{
  const envS = new THREE.Scene();
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, '#6aa4d4'); gr.addColorStop(0.55, '#d8eaf4'); gr.addColorStop(1, '#c8b890');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  envS.add(new THREE.Mesh(new THREE.SphereGeometry(50, 16, 10), new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide })));
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(envS).texture; pm.dispose();
}

/* post: bloom + grade */
const GradeShader = {
  uniforms: { tDiffuse: { value: null }, uVig: { value: 0.25 }, uCon: { value: 1.04 }, uSat: { value: 1.10 },
    uLift: { value: new THREE.Vector3(0.010, 0.007, 0.0) }, uGain: { value: new THREE.Vector3(1.04, 1.01, 0.94) } },
  vertexShader: 'varying vec2 v; void main(){ v=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uVig,uCon,uSat; uniform vec3 uLift,uGain; varying vec2 v;
    void main(){ vec3 c=texture2D(tDiffuse,v).rgb; c=(c-0.5)*uCon+0.5; float l=dot(c,vec3(0.299,0.587,0.114));
      c=mix(vec3(l),c,uSat); float lum=clamp(l,0.0,1.0);
      c+=uLift*(1.0-smoothstep(0.0,0.5,lum)); c*=mix(vec3(1.0),uGain,smoothstep(0.4,1.0,lum));
      vec2 d=v-0.5; float r=dot(d,d)*2.0; c*=mix(1.0,smoothstep(0.95,0.28,r),uVig);
      gl_FragColor=vec4(max(c,0.0),1.0); }`
};
let composer = null;
if (THREE.EffectComposer && THREE.UnrealBloomPass && THREE.GammaCorrectionShader) {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(800, 600), 0.22, 0.45, 0.88));
  const gp = new THREE.ShaderPass(GradeShader); composer.addPass(gp);
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
}

/* ═══════════════════════════════════════════════
   TEXTURE / CANVAS HELPERS
═══════════════════════════════════════════════ */
const cnv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const tex = (c, opts = {}) => {
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...opts.repeat); }
  if (opts.aniso) t.anisotropy = opts.aniso;
  return t;
};

/* painted plaster wall — base color + subtle noise + stain lines */
function plasterTex(hex, w=256, h=256) {
  const c = cnv(w, h), g = c.getContext('2d');
  g.fillStyle = hex; g.fillRect(0, 0, w, h);
  // noise grain
  for (let i = 0; i < 3000; i++) {
    const a = Math.random() * 0.06;
    g.fillStyle = `rgba(0,0,0,${a})`; g.fillRect(Math.random()*w, Math.random()*h, 1+(Math.random()|0), 1+(Math.random()|0));
  }
  // subtle horizontal stain
  for (let i = 0; i < 3; i++) {
    const y0 = Math.random()*h; const ht = rand(1, 4);
    g.fillStyle = `rgba(0,0,0,${rand(0.02,0.07)})`; g.fillRect(0, y0, w, ht);
  }
  return tex(c, { repeat: [2, 4], aniso: 4 });
}

function awningTex(a, b, slantCount=10) {
  const c = cnv(80, 32), g = c.getContext('2d');
  for (let i = 0; i < slantCount; i++) { g.fillStyle = i%2?a:b; g.fillRect(i*(80/slantCount), 0, 80/slantCount+1, 32); }
  return tex(c, { repeat: [3, 1] });
}

function signTex(name, bg, accent='#fdf3df') {
  const c = cnv(320, 80), g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, 320, 80);
  // bottom highlight strip
  g.fillStyle = 'rgba(255,255,255,0.15)'; g.fillRect(0, 72, 320, 8);
  // shadow text
  g.fillStyle = 'rgba(0,0,0,0.4)'; g.font = 'bold 32px Georgia,serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(name, 162, 44);
  // main text
  g.fillStyle = accent; g.fillText(name, 160, 42);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}

function neonTex(text, glowCol, textCol='#ffffff') {
  const c = cnv(280, 60), g = c.getContext('2d');
  g.fillStyle = '#0a0a10'; g.fillRect(0, 0, 280, 60);
  g.shadowColor = glowCol; g.shadowBlur = 12;
  g.fillStyle = textCol; g.font = 'bold 28px Arial,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 140, 32);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}

/* wall mural — painted graphic */
function muralTex(type) {
  const c = cnv(256, 256), g = c.getContext('2d');
  if (type === 'circle') {
    // concentric wave design
    g.fillStyle = '#c25a3a'; g.fillRect(0,0,256,256);
    for (let r = 110; r > 10; r -= 18) {
      const alpha = 0.5 + (110-r)/110*0.5;
      g.strokeStyle = `rgba(250,240,200,${alpha})`; g.lineWidth = 6; g.beginPath(); g.arc(128,128,r,0,TAU); g.stroke();
    }
    g.fillStyle = 'rgba(250,240,200,0.9)'; g.font = 'bold 22px Georgia,serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('MOTT', 128, 128);
  } else if (type === 'bird') {
    g.fillStyle = '#1a2a3a'; g.fillRect(0,0,256,256);
    // simple bird silhouette via arcs
    g.fillStyle = '#e8d8a0';
    const drawBird = (x,y,s) => { g.beginPath(); g.ellipse(x,y,s*1.4,s*0.6,0,0,TAU); g.fill(); g.beginPath(); g.ellipse(x+s*1.1,y-s*0.2,s*0.9,s*0.4,-0.3,0,TAU); g.fill(); };
    drawBird(80, 90, 16); drawBird(160, 70, 12); drawBird(200, 100, 10); drawBird(50, 150, 9);
    g.fillStyle = 'rgba(232,216,160,0.3)';
    g.font = 'italic 18px Georgia,serif'; g.textAlign = 'center'; g.textBaseline = 'bottom'; g.fillText('FLY FREE', 128, 240);
  } else {
    // abstract stripes
    g.fillStyle = '#2f4f7a'; g.fillRect(0,0,256,256);
    const cols = ['#e85a4f','#f0a830','#5ab87a','#e8d870','#7ac0e8'];
    for (let i = 0; i < 7; i++) {
      g.fillStyle = cols[i%cols.length]; g.fillRect(0, i*38, 256, 28);
    }
    g.fillStyle = 'rgba(255,255,255,0.8)'; g.font = 'bold 28px Arial,sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('VIVE MOTT', 128, 128);
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}

function posterTex(type) {
  const c = cnv(128, 192), g = c.getContext('2d');
  if (type === 0) {
    g.fillStyle = '#e8e0cc'; g.fillRect(0,0,128,192);
    g.fillStyle = '#3a3018'; g.font = 'bold 14px Georgia,serif'; g.textAlign = 'center'; g.fillText('GRAN', 64, 40); g.fillText('CONCIERTO', 64, 58);
    g.strokeStyle = '#8a7040'; g.lineWidth = 3; g.strokeRect(8, 6, 112, 180);
    g.fillStyle = '#c04030'; g.font = 'bold 18px Georgia,serif'; g.fillText('★ MOTT ★', 64, 110);
    g.fillStyle = '#3a3018'; g.font = '11px Arial'; g.fillText('PLAZA CENTRAL', 64, 145); g.fillText('SÁBADO 8PM', 64, 162);
  } else if (type === 1) {
    g.fillStyle = '#1a1a2a'; g.fillRect(0,0,128,192);
    g.fillStyle = '#e0c840'; g.font = 'bold 28px Arial,sans-serif'; g.textAlign = 'center'; g.fillText('OPEN', 64, 70); g.fillText('TODAY', 64, 100);
    g.fillStyle = '#404060'; g.fillRect(0,130,128,62);
    g.fillStyle = '#a0c0e0'; g.font = '11px monospace'; g.fillText('10AM — MIDNIGHT', 64, 158);
  } else {
    g.fillStyle = '#e04040'; g.fillRect(0,0,128,192);
    g.fillStyle = '#ffffff'; g.font = 'bold 22px Arial,sans-serif'; g.textAlign = 'center';
    g.fillText('🎉', 64, 50); g.fillText('FIESTA', 64, 85); g.fillText('DE', 64, 108); g.fillText('BARRIO', 64, 131);
    g.font = '11px Arial'; g.fillText('CALLE MOTT · HOY', 64, 165);
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}

function roadTex() {
  const c = cnv(256, 256), g = c.getContext('2d');
  g.fillStyle = '#363a42'; g.fillRect(0,0,256,256);
  for (let i = 0; i < 4000; i++) {
    const a = Math.random()*0.08;
    g.fillStyle = `rgba(${Math.random()<0.5?'255,255,255':'0,0,0'},${a})`;
    g.fillRect(Math.random()*256, Math.random()*256, 1, 1);
  }
  return tex(c, { repeat: [8, 20], aniso: 4 });
}

function sidewalkTex() {
  const c = cnv(128, 128), g = c.getContext('2d');
  g.fillStyle = '#b8b0a0'; g.fillRect(0,0,128,128);
  g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 1.5;
  for (let x = 0; x < 128; x += 32) { g.beginPath(); g.moveTo(x,0); g.lineTo(x,128); g.stroke(); }
  for (let y = 0; y < 128; y += 32) { g.beginPath(); g.moveTo(0,y); g.lineTo(128,y); g.stroke(); }
  for (let i = 0; i < 500; i++) { g.fillStyle = `rgba(0,0,0,${Math.random()*0.04})`; g.fillRect(Math.random()*128, Math.random()*128, 1,1); }
  return tex(c, { repeat: [10, 5], aniso: 4 });
}

/* ═══════════════════════════════════════════════
   BASE MATERIALS
═══════════════════════════════════════════════ */
const matAsphalt  = new THREE.MeshStandardMaterial({ map: roadTex(), roughness: 0.94, metalness: 0 });
const matSidewalk = new THREE.MeshStandardMaterial({ map: sidewalkTex(), roughness: 0.96 });
const matCurb     = new THREE.MeshStandardMaterial({ color: 0xcac4b4, roughness: 0.9 });
const matMetalDark= new THREE.MeshStandardMaterial({ color: 0x252830, roughness: 0.55, metalness: 0.65 });
const matGlass    = new THREE.MeshStandardMaterial({ color: 0x18283a, roughness: 0.06, metalness: 0.92, envMapIntensity: 1.6 });
const matGlassLit = new THREE.MeshStandardMaterial({ color: 0xffe8a0, emissive: 0xffd060, emissiveIntensity: 1.2, roughness: 0.25 });
const matGlassTint= new THREE.MeshStandardMaterial({ color: 0x28503a, roughness: 0.08, metalness: 0.9, envMapIntensity: 1.3 });
const matChrome   = new THREE.MeshStandardMaterial({ color: 0xc0c4cc, roughness: 0.18, metalness: 0.88, envMapIntensity: 2 });

/* ═══════════════════════════════════════════════
   SCENE ROOT + INSTANCING ARRAYS
═══════════════════════════════════════════════ */
const root = new THREE.Group(); scene.add(root);
const winGlass = [], winLit = [], winFrame = [];
const ADDR = [];   // delivery anchors: { name, pos }
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3();

/* ═══════════════════════════════════════════════
   GROUND — road / sidewalk / curbs / markings
═══════════════════════════════════════════════ */
const SW = 7.4;   // half street width
const SDW = 5.2;  // sidewalk depth
const CH = 0.24;  // curb / raised sidewalk height
const BL = 88;    // block length

// big base ground beneath everything (so nothing reads as void from the air)
const baseGroundTex = (() => {
  const c = cnv(128,128), g = c.getContext('2d');
  g.fillStyle = '#9aa18c'; g.fillRect(0,0,128,128);
  for (let i=0;i<2400;i++){ g.fillStyle = `rgba(0,0,0,${Math.random()*0.05})`; g.fillRect(Math.random()*128,Math.random()*128,1,1); }
  return tex(c, { repeat: [22,22], aniso: 4 });
})();
const base = new THREE.Mesh(new THREE.PlaneGeometry(420, 420), new THREE.MeshStandardMaterial({ map: baseGroundTex, roughness: 1 }));
base.rotation.x = -Math.PI/2; base.position.y = -0.04; base.receiveShadow = true; root.add(base);

const road = new THREE.Mesh(new THREE.PlaneGeometry(BL, SW*2), matAsphalt);
road.rotation.x = -Math.PI/2; road.receiveShadow = true; root.add(road);

// centre dashes
const dashMat = new THREE.MeshStandardMaterial({ color: 0xd4c890, roughness: 0.8 });
for (let x = -BL/2+2; x < BL/2; x += 3.8) {
  const d = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.18), dashMat);
  d.rotation.x = -Math.PI/2; d.position.set(x, 0.012, 0); root.add(d);
}
// edge lines
[-SW+0.5, SW-0.5].forEach(z => {
  const line = new THREE.Mesh(new THREE.PlaneGeometry(BL, 0.14), new THREE.MeshStandardMaterial({ color: 0xd8d0a0, roughness: 0.8 }));
  line.rotation.x = -Math.PI/2; line.position.set(0, 0.013, z); root.add(line);
});
// zebra crossing
for (let i = 0; i < 8; i++) {
  const s = new THREE.Mesh(new THREE.PlaneGeometry(0.6, SW*2-0.8), new THREE.MeshStandardMaterial({ color: 0xe8e0ca, roughness: 0.88 }));

/* ═══════════════════════════════════════════════
   WINDOW INSTANCING HELPER
═══════════════════════════════════════════════ */
function addWindows(bx, faceZ_world, w, h, floors, groundOff) {
  const cols = Math.max(2, Math.floor(w/2.4));
  const gap = w/cols;
  const fH = 3.0;
  for (let f = 0; f < floors; f++) {
    const wy = groundOff + 1.7 + f*fH;
    if (wy + 0.7 > h - 0.5) break;
    for (let ci = 0; ci < cols; ci++) {
      const wx = bx - w/2 + gap*(ci+0.5);
      const lit = Math.random() < 0.25;
      _p.set(wx, wy, faceZ_world + (faceZ_world > 0 ? 0.07 : -0.07));
      _q.identity(); _s.set(0.88, 1.15, 1); _m.compose(_p, _q, _s);
      (lit ? winLit : winGlass).push(_m.clone());
      _s.set(1.10, 1.38, 1); _p.set(wx, wy, faceZ_world + (faceZ_world > 0 ? 0.05 : -0.05));
      _m.compose(_p, _q, _s); winFrame.push(_m.clone());
    }
  }
}

function makeRooftop(g, cx, cz, w, d, topY, wallMat) {
  // parapet
  const pp = new THREE.Mesh(new THREE.BoxGeometry(w+0.14, 0.5, d+0.14), wallMat);
  pp.position.set(cx, topY+0.25, cz); pp.castShadow = true; g.add(pp);
  // inner roof surface
  const rf = new THREE.Mesh(new THREE.BoxGeometry(w-0.3, 0.08, d-0.3), new THREE.MeshStandardMaterial({ color: 0x48443e, roughness: 1 }));
  rf.position.set(cx, topY+0.04, cz); g.add(rf);
  // water tank
  if (Math.random() < 0.65) {
    const tkH = rand(1.0,1.6), tkR = rand(0.55,0.75);
    const tk = new THREE.Mesh(new THREE.CylinderGeometry(tkR,tkR,tkH,10), new THREE.MeshStandardMaterial({ color: 0x8a6e50, roughness: 0.85 }));
    const tx = cx+rand(-w/4,w/4), tz = cz+rand(-d/4,d/4);
    tk.position.set(tx, topY+tkH/2+0.04, tz); tk.castShadow = true; g.add(tk);
    const legs = new THREE.Mesh(new THREE.BoxGeometry(tkR*1.5,0.6,tkR*1.5), matMetalDark);
    legs.position.set(tx, topY+0.3+0.04, tz); g.add(legs);
    // tank ring bands
    for (let bi = 0; bi < 3; bi++) {
      const band = new THREE.Mesh(new THREE.TorusGeometry(tkR+0.04, 0.04, 5, 14), matMetalDark);
      band.rotation.x = Math.PI/2; band.position.set(tx, topY+0.2+bi*tkH/3, tz); g.add(band);
    }
  }
  // AC units
  const acCount = 1 + (Math.random()*3|0);
  for (let i = 0; i < acCount; i++) {
    const acW = rand(0.7,1.2), acH = rand(0.4,0.6), acD = rand(0.5,0.8);
    const ac = new THREE.Mesh(new THREE.BoxGeometry(acW,acH,acD), new THREE.MeshStandardMaterial({ color: 0x9a9488, roughness: 0.7 }));
    ac.position.set(cx+rand(-w/3,w/3), topY+acH/2+0.06, cz+rand(-d/3,d/3)); ac.castShadow = true; g.add(ac);
    // grill slats
    const grill = new THREE.Mesh(new THREE.BoxGeometry(acW-0.1,acH*0.6,0.06), new THREE.MeshStandardMaterial({ color: 0x707068, roughness: 0.5, metalness: 0.4 }));
    grill.position.copy(ac.position).add(new THREE.Vector3(0,0,acD/2+0.03)); g.add(grill);
  }
  // vent pipes
  if (Math.random() < 0.5) {
    const vp = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.8,7), new THREE.MeshStandardMaterial({ color: 0x5a5650, roughness: 0.7, metalness: 0.4 }));
    vp.position.set(cx+rand(-w/3,w/3), topY+0.4+0.04, cz+rand(-d/3,d/3)); g.add(vp);
  }
}

function makeBuilding(cx, cz, w, d, floors, faceSign, wallHex, shopName, signBg, awA, awB, extra) {
  const g = new THREE.Group();
  const h = 2.4 + floors * 3.0;
  const wallTex = plasterTex(wallHex);
  const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  body.position.set(cx, h/2, cz); body.castShadow = true; body.receiveShadow = true; g.add(body);

  // string-course bands
  const trimHex = pick([0xf8f4ea, 0xeee5d0, 0xf4ebd8]);
  const trimMat = new THREE.MeshStandardMaterial({ color: trimHex, roughness: 0.85 });
  for (let f = 1; f <= floors; f++) {
    const band = new THREE.Mesh(new THREE.BoxGeometry(w+0.16, 0.2, d+0.16), trimMat);
    band.position.set(cx, 2.4+f*3.0-0.2, cz); g.add(band);
  }
  // top cornice
  const cor = new THREE.Mesh(new THREE.BoxGeometry(w+0.36, 0.42, d+0.36), trimMat);
  cor.position.set(cx, h-0.08, cz); cor.castShadow = true; g.add(cor);
  // cornice drip detail
  const drip = new THREE.Mesh(new THREE.BoxGeometry(w+0.5, 0.12, d+0.5), new THREE.MeshStandardMaterial({ color: trimHex, roughness: 0.8 }));
  drip.position.set(cx, h+0.18, cz); g.add(drip);

  // windows
  const faceZ = cz + faceSign*(d/2);
  addWindows(cx, faceZ, w-0.8, h, floors, 0);

  // register this shop as a delivery address (anchor a bit out toward the street)
  ADDR.push({ name: shopName, pos: new THREE.Vector3(cx, 2.2, faceZ + faceSign*1.2) });

  // side-wall windows (rough)
  if (Math.random() < 0.5) {
    const sideX = cx + w/2 + 0.04;
    const sFloors = Math.floor(floors*0.7);
    for (let f = 0; f < sFloors; f++) {
      const wy = 2.0 + f*3.0;
      _p.set(sideX, wy, cz); _q.setFromEuler(new THREE.Euler(0, -Math.PI/2, 0));
      _s.set(0.88, 1.15, 1); _m.compose(_p, _q, _s);
      winGlass.push(_m.clone());
    }
  }

  // ground-floor shopfront
  const sfZ = faceZ + faceSign*0.03;
  const sfH = 2.1;
  const shop = new THREE.Mesh(new THREE.BoxGeometry(w-0.6, sfH, 0.1), matGlass);
  shop.position.set(cx, sfH/2+0.08, sfZ); g.add(shop);
  // shop frame
  const sfFrame = new THREE.Mesh(new THREE.BoxGeometry(w-0.4, sfH+0.15, 0.14), new THREE.MeshStandardMaterial({ color: 0x282c30, roughness: 0.5, metalness: 0.5 }));
  sfFrame.position.set(cx, sfH/2+0.08, sfZ-faceSign*0.04); g.add(sfFrame);
  // door
  const doorCol = pick([0x4a3020, 0x2a4050, 0x303828, 0x4a3840]);
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.0, 0.15), new THREE.MeshStandardMaterial({ color: doorCol, roughness: 0.65 }));
  door.position.set(cx+rand(-w/5, w/5), 1.02, sfZ+faceSign*0.06); g.add(door);
  // door handle
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.4,5), matChrome);
  handle.rotation.z = Math.PI/2; handle.position.set(door.position.x+0.35, 1.0, sfZ+faceSign*0.14); g.add(handle);

  // signboard
  const sgT = signTex(shopName, signBg);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(Math.min(w-0.8,4.0), 0.9), new THREE.MeshStandardMaterial({ map: sgT, roughness: 0.55 }));
  sign.position.set(cx, 2.6, sfZ+faceSign*0.1); if (faceSign > 0) sign.rotation.y = Math.PI; g.add(sign);

  // awning
  const awMat = new THREE.MeshStandardMaterial({ map: awningTex(awA, awB), roughness: 0.82, side: THREE.DoubleSide });
  const aw = new THREE.Mesh(new THREE.BoxGeometry(w-0.7, 0.1, 1.5), awMat);
  aw.position.set(cx, 2.1, sfZ+faceSign*0.8); aw.rotation.x = faceSign*0.28; aw.castShadow = true; g.add(aw);
  const val = new THREE.Mesh(new THREE.BoxGeometry(w-0.7, 0.32, 0.05), awMat);
  val.position.set(cx, 1.82, sfZ+faceSign*1.44); g.add(val);

  /* extras */
  if (extra === 'balcony') {
    // balconies on floors 2+
    const floorCount = Math.min(floors, 3);
    for (let f = 1; f <= floorCount; f++) {
      const by = 2.4 + f*3.0 + 0.6;
      if (by > h - 1) break;
      // slab
      const bslab = new THREE.Mesh(new THREE.BoxGeometry(w*0.55, 0.14, 0.9), trimMat);
      bslab.position.set(cx, by, faceZ+faceSign*0.5); bslab.castShadow = true; g.add(bslab);
      // railing posts
      const railMat = new THREE.MeshStandardMaterial({ color: 0x303438, roughness: 0.5, metalness: 0.6 });
      const railN = 5;
      for (let ri = 0; ri < railN; ri++) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.7, 0.06), railMat);
        post.position.set(cx - w*0.55/2 + (w*0.55/(railN-1))*ri, by+0.35, faceZ+faceSign*0.95); g.add(post);
      }
      const rail = new THREE.Mesh(new THREE.BoxGeometry(w*0.55+0.1, 0.06, 0.06), railMat);
      rail.position.set(cx, by+0.72, faceZ+faceSign*0.95); g.add(rail);
      // laundry line occasional
      if (Math.random() < 0.4) {
        const colors = ['#e04040','#4080c0','#f0e030','#f0f0f0'];
        for (let li = 0; li < 3; li++) {
          const cloth = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.55), new THREE.MeshStandardMaterial({ color: pick(colors), roughness: 0.9, side: THREE.DoubleSide }));
          cloth.position.set(cx + rand(-w/4,w/4), by+0.6, faceZ+faceSign*0.7);
          cloth.rotation.y = rand(-0.2, 0.2); g.add(cloth);
        }
      }
    }
  } else if (extra && extra.startsWith('neon:')) {
    const parts = extra.split(':');
    const nText = parts[1], nCol = parts[2];
    const nT = neonTex(nText, nCol);
    const nSign = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 0.6), new THREE.MeshStandardMaterial({ map: nT, emissive: new THREE.Color(nCol), emissiveMap: nT, emissiveIntensity: 1.8, roughness: 0.2, transparent: true }));
    nSign.position.set(cx, 3.4, sfZ+faceSign*0.15); if (faceSign > 0) nSign.rotation.y = Math.PI; g.add(nSign);
  } else if (extra && extra.startsWith('mural:')) {
    const mType = extra.split(':')[1];
    const mT = muralTex(mType);
    const mW = rand(4, w*0.7), mH = rand(3.5, 5.0);
    const mY = 2.4 + floors*1.2;
    const mural = new THREE.Mesh(new THREE.PlaneGeometry(mW, mH), new THREE.MeshStandardMaterial({ map: mT, roughness: 0.85 }));
    mural.position.set(cx+rand(-1,1), mY, faceZ+faceSign*0.05); if (faceSign > 0) mural.rotation.y = Math.PI; g.add(mural);
  }

  /* posters scattered on wall */
  const posterCount = 1 + (Math.random()*2|0);
  for (let pi = 0; pi < posterCount; pi++) {
    const pT = posterTex(Math.random()*3|0);
    const pw = 0.55, ph = 0.82;
    const poster = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), new THREE.MeshStandardMaterial({ map: pT, roughness: 0.85 }));
    const px = cx + rand(-w/3, w/3), py = CH + 0.5 + rand(0.5, 1.8);
    poster.position.set(px, py, faceZ+faceSign*0.06); if (faceSign > 0) poster.rotation.y = Math.PI;
    g.add(poster);
  }

  makeRooftop(g, cx, cz, w, d, h, wallMat);
  root.add(g);
}

BDATA_NEAR.forEach(([cx,cz,w,d,fl,wall,shop,bg,awA,awB,ex]) => makeBuilding(cx,cz,w,d,fl,-1,wall,shop,bg,awA,awB,ex));

function instMesh(list, geo, mat) {

  list.forEach((m,i) => im.setMatrixAt(i,m)); im.instanceMatrix.needsUpdate = true; root.add(im);
}

function makeOutdoorCafe(cx, side) {
  const z0 = side*(SW+1.2);
  const tableMat = new THREE.MeshStandardMaterial({ color: 0xf0ece0, roughness: 0.7 });
  const chairMat = new THREE.MeshStandardMaterial({ color: 0x3a3028, roughness: 0.8 });
  for (let t = 0; t < 3; t++) {
    const tx = cx + (t-1)*2.4;
    // table top + post
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.48,0.48,0.06,10), tableMat);
    top.position.set(tx, CH+0.76, z0); top.castShadow = true; root.add(top);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.76,6), new THREE.MeshStandardMaterial({ color: 0x4a3828, roughness: 0.7 }));
    post.position.set(tx, CH+0.38, z0); root.add(post);
    // chairs
    [[0.6,0],[  -0.6,0],[0,0.6],[0,-0.6]].slice(0,Math.random()<0.5?4:2).forEach(([dx,dz]) => {
      const ch = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.04,0.42), chairMat);
      ch.position.set(tx+dx, CH+0.47, z0+dz); root.add(ch);
      const back = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.45,0.04), chairMat);
      back.position.set(tx+dx, CH+0.7, z0+dz-0.19); root.add(back);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x3a3028, roughness: 0.8 });
      [[0.18,0.18],[0.18,-0.18],[-0.18,0.18],[-0.18,-0.18]].forEach(([ldx,ldz]) => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.47,5), legMat);
        leg.position.set(tx+dx+ldx, CH+0.24, z0+dz+ldz); root.add(leg);
      });
    });
  }
  // parasol
  const px = cx, pz = z0;
  const poleM = new THREE.MeshStandardMaterial({ color: 0x5a3818, roughness: 0.7 });
  const ppole = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,2.0,7), poleM);
  ppole.position.set(px, CH+1.0, pz); root.add(ppole);
  const umbrCol = pick([0xe84040,0xf0a030,0x3870c0,0x40a058]);
  for (let pi = 0; pi < 8; pi++) {
    const ang = (pi/8)*TAU;
    const prib = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,1.05,5), poleM);
    prib.rotation.z = 0.42; prib.rotation.y = ang; prib.position.set(px+Math.cos(ang)*0.45, CH+2.0-0.2, pz+Math.sin(ang)*0.45); root.add(prib);
    const seg = new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.08), new THREE.MeshStandardMaterial({ color: umbrCol, roughness: 0.8, side: THREE.DoubleSide }));
    seg.rotation.x = 0.42; seg.rotation.z = -ang; seg.position.set(px+Math.cos(ang)*0.45, CH+1.95, pz+Math.sin(ang)*0.45); root.add(seg);
  }
  const top2 = new THREE.Mesh(new THREE.ConeGeometry(1.05,0.25,8), new THREE.MeshStandardMaterial({ color: umbrCol, roughness: 0.8 }));
  top2.position.set(px, CH+2.05, pz); root.add(top2);
}

  flap.position.set(0.32, 0.04, -0.05); g.add(flap);
  // wings
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xeaf4ff, transparent: true, opacity: 0.5, roughness: 0.2, metalness: 0.1, side: THREE.DoubleSide, emissive: 0x88b0d0, emissiveIntensity: 0.15 });
  const wingShape = new THREE.Shape();
  wingShape.moveTo(0,0); wingShape.quadraticCurveTo(0.5, 0.5, 1.0, 0.18);
  wingShape.quadraticCurveTo(0.85,-0.05, 0.55,-0.2); wingShape.quadraticCurveTo(0.25,-0.2, 0,0);
  const wingGeo = new THREE.ShapeGeometry(wingShape);
  const wingL = new THREE.Mesh(wingGeo, wingMat); wingL.position.set(-0.18, 0.25, -0.05); g.add(wingL);
  const wingR = new THREE.Mesh(wingGeo, wingMat); wingR.position.set(0.18, 0.25, -0.05); wingR.scale.x = -1; g.add(wingR);
  g.userData.wingL = wingL; g.userData.wingR = wingR;
  return g;
}
const fly = makeFly(); scene.add(fly);

// soft shadow blob under the fly (always reads even when high)
const blob = new THREE.Mesh(new THREE.CircleGeometry(0.8, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.26, depthWrite: false }));
blob.rotation.x = -Math.PI/2; scene.add(blob);

// carried letter (shown on the fly while carrying)
const letterMat = new THREE.MeshStandardMaterial({ color: 0xf4ecd6, roughness: 0.7 });
const carriedLetter = new THREE.Group();
{
  const env = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.28, 0.05), letterMat);
  const stamp = new THREE.Mesh(new THREE.PlaneGeometry(0.1,0.1), new THREE.MeshStandardMaterial({ color: 0xc0463e, roughness: 0.7 }));
  stamp.position.set(0.12, 0.07, 0.027); env.add(stamp);
  carriedLetter.add(env);
}
carriedLetter.visible = false; fly.add(carriedLetter); carriedLetter.position.set(0, 0.45, 0.15);

/* ═══════════════════════════════════════════════
   GAME STATE — delivery loop
═══════════════════════════════════════════════ */
const PLAY = { minX: -BL/2+5, maxX: BL/2-5, minZ: -(SW+SDW+2.5), maxZ: SW+SDW+2.5, minY: 2.0, maxY: 30 };
const P = { pos: new THREE.Vector3(0, 7, -4), yaw: 0, speed: 0, vy: 0, bank: 0, pitch: 0 };
const MAXF = 17, MAXB = 6, ACCEL = 3.2, YAWRATE = 2.0, CLIMB = 9;

let carrying = false, pickup = null, dropoff = null, delivered = 0;
const elTaskLbl = document.querySelector('#task .lbl');
const elTaskDst = document.querySelector('#task .dst');
const elTaskSub = document.querySelector('#task .sub');
const elScore   = document.querySelector('#score .n');
const elNeedle  = document.getElementById('needle');
const elDist    = document.getElementById('dist');
const elToast   = document.getElementById('toast');

// marker beam shown over the current objective
const beamMat = new THREE.MeshBasicMaterial({ color: 0xffd060, transparent: true, opacity: 0.28, depthWrite: false, side: THREE.DoubleSide });
const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.4, 26, 16, 1, true), beamMat);
scene.add(beam);
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.12, 8, 28), new THREE.MeshBasicMaterial({ color: 0xffd060, transparent: true, opacity: 0.8, depthWrite: false }));
ring.rotation.x = -Math.PI/2; scene.add(ring);
// floating envelope at the objective
const objLetter = new THREE.Group();
{
  const env = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.62, 0.1), letterMat);
  env.castShadow = true;
  const fold = new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.34), new THREE.MeshStandardMaterial({ color: 0xdcd0b0, roughness: 0.7 }));
  fold.position.set(0,0.05,0.052); env.add(fold);
  const stamp = new THREE.Mesh(new THREE.PlaneGeometry(0.22,0.22), new THREE.MeshStandardMaterial({ color: 0xc0463e, roughness: 0.7, emissive: 0x802820, emissiveIntensity: 0.2 }));
  stamp.position.set(0.26,0.13,0.053); env.add(stamp);
  objLetter.add(env);
}
scene.add(objLetter);

function showToast(txt, col) { elToast.textContent = txt; elToast.style.color = col || '#fff'; elToast.classList.add('show'); clearTimeout(showToast._t); showToast._t = setTimeout(() => elToast.classList.remove('show'), 1100); }

function setObjective() {
  const target = carrying ? dropoff : pickup;
  beamMat.color.set(carrying ? 0x7fe0a0 : 0xffd060);
  ring.material.color.set(carrying ? 0x7fe0a0 : 0xffd060);
  beam.position.set(target.pos.x, 13, target.pos.z);
  ring.position.set(target.pos.x, 0.3, target.pos.z);
  objLetter.position.set(target.pos.x, 3.4, target.pos.z);
  objLetter.visible = !carrying;
  elTaskLbl.textContent = carrying ? 'Deliver to' : 'Pick up at';
  elTaskDst.textContent = target.name;
  elTaskSub.textContent = carrying ? 'fly to the glowing shop' : 'grab the floating letter';
}
function newTask() {
  pickup = pick(ADDR);
  do { dropoff = pick(ADDR); } while (dropoff === pickup);
  carrying = false; carriedLetter.visible = false;
  setObjective();
}
newTask();

/* ═══════════════════════════════════════════════
   INPUT — keyboard + touch
═══════════════════════════════════════════════ */
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',   e => { keys[e.code] = false; });

// touch joystick
let tThrottle = 0, tYaw = 0, tVert = 0;
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickId = null, sCx = 0, sCy = 0;
stick.addEventListener('pointerdown', e => { stickId = e.pointerId; const r = stick.getBoundingClientRect(); sCx = r.left+r.width/2; sCy = r.top+r.height/2; stick.setPointerCapture(e.pointerId); });
stick.addEventListener('pointermove', e => {
  if (e.pointerId !== stickId) return;
  let dx = e.clientX - sCx, dy = e.clientY - sCy;
  const R = 50, len = Math.hypot(dx,dy); if (len > R) { dx*=R/len; dy*=R/len; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  tYaw = -dx / R; tThrottle = -dy / R;
});
const stickEnd = e => { if (e.pointerId !== stickId) return; stickId = null; tYaw = 0; tThrottle = 0; knob.style.transform = 'translate(0,0)'; };
stick.addEventListener('pointerup', stickEnd); stick.addEventListener('pointercancel', stickEnd);
const bindBtn = (id, val) => { const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); tVert = val; });
  el.addEventListener('pointerup',   () => tVert = 0); el.addEventListener('pointercancel', () => tVert = 0); };
bindBtn('btnUp', 1); bindBtn('btnDn', -1);

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w,h,false); if(composer) composer.setSize(w,h);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

/* ═══════════════════════════════════════════════
   LOOP
═══════════════════════════════════════════════ */
const camPos = new THREE.Vector3(0, 12, -16);
let last = performance.now();
function tick() {
  requestAnimationFrame(tick);
  const now = performance.now(); let dt = (now-last)/1000; last = now; dt = Math.min(dt, 0.05);

  /* ── input → intents ── */
  let thr = tThrottle, turn = tYaw, vert = tVert;
  if (keys['KeyW'] || keys['ArrowUp'])    thr += 1;
  if (keys['KeyS'] || keys['ArrowDown'])  thr -= 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  turn += 1;
  if (keys['KeyD'] || keys['ArrowRight']) turn -= 1;
  if (keys['Space'])      vert += 1;
  if (keys['ShiftLeft'] || keys['ShiftRight']) vert -= 1;
  thr = clamp(thr,-1,1); turn = clamp(turn,-1,1); vert = clamp(vert,-1,1);

  /* ── flight physics ── */
  const targetSpeed = thr >= 0 ? thr*MAXF : thr*MAXB;
  P.speed = lerp(P.speed, targetSpeed, 1 - Math.exp(-ACCEL*dt));
  // turn rate scales a little with speed for a nicer feel
  P.yaw += turn * YAWRATE * dt * (0.45 + 0.55*Math.min(1, Math.abs(P.speed)/MAXF));
  const fwd = new THREE.Vector3(Math.sin(P.yaw), 0, Math.cos(P.yaw));
  P.pos.x += fwd.x * P.speed * dt;
  P.pos.z += fwd.z * P.speed * dt;
  P.vy = lerp(P.vy, vert*CLIMB, 1 - Math.exp(-6*dt));
  P.pos.y += P.vy * dt;
  // bounds
  P.pos.x = clamp(P.pos.x, PLAY.minX, PLAY.maxX);
  P.pos.z = clamp(P.pos.z, PLAY.minZ, PLAY.maxZ);
  P.pos.y = clamp(P.pos.y, PLAY.minY, PLAY.maxY);
  // visual bank + pitch
  P.bank  = lerp(P.bank, -turn*0.5, 1 - Math.exp(-8*dt));
  P.pitch = lerp(P.pitch, -P.speed/MAXF*0.18 - P.vy*0.02, 1 - Math.exp(-6*dt));

  fly.position.copy(P.pos);
  fly.rotation.set(0,0,0);
  fly.rotateY(P.yaw); fly.rotateX(P.pitch); fly.rotateZ(P.bank);
  // wing flap
  const flap = Math.sin(now*0.03) * (0.5 + Math.min(1,Math.abs(P.speed)/MAXF)*0.6);
  fly.userData.wingL.rotation.z = 0.3 + flap;
  fly.userData.wingR.rotation.z = -0.3 - flap;
  fly.userData.scarfTail.rotation.x = 0.3 + Math.sin(now*0.012)*0.25 + Math.min(1,Math.abs(P.speed)/MAXF)*0.5;
  // shadow blob
  blob.position.set(P.pos.x, 0.03, P.pos.z);
  const hgt = clamp((P.pos.y-1)/26, 0, 1);
  blob.scale.setScalar(1 + hgt*1.4); blob.material.opacity = 0.28*(1-hgt*0.55);

  /* ── camera chase ── */
  const desired = new THREE.Vector3(
    P.pos.x - fwd.x*13, P.pos.y + 5.5, P.pos.z - fwd.z*13
  );
  camPos.lerp(desired, 1 - Math.exp(-5*dt));
  camera.position.copy(camPos);
  camera.lookAt(P.pos.x + fwd.x*5, P.pos.y + 0.5, P.pos.z + fwd.z*5);

  /* ── objective marker anim ── */
  const tgt = carrying ? dropoff : pickup;
  beam.rotation.y += dt*0.4;
  ring.scale.setScalar(1 + Math.sin(now*0.004)*0.08);
  objLetter.rotation.y += dt*1.5;
  objLetter.position.y = 3.4 + Math.sin(now*0.003)*0.25;

  /* ── proximity → pickup / deliver ── */
  const dx = P.pos.x - tgt.pos.x, dz = P.pos.z - tgt.pos.z;
  const planar = Math.hypot(dx, dz);
  elDist.textContent = planar < 60 ? Math.round(planar) + ' m' : '—';
  // compass needle: world bearing to target relative to camera heading
  const bearing = Math.atan2(tgt.pos.x - P.pos.x, tgt.pos.z - P.pos.z);
  elNeedle.style.transform = `rotate(${(P.yaw - bearing)}rad)`;

  if (planar < 4.2) {
    if (!carrying) {
      carrying = true; carriedLetter.visible = true;
      showToast('✉ Letter picked up', '#ffd27a');
      setObjective();
    } else {
      delivered++; elScore.textContent = delivered;
      showToast('★ Delivered! +1', '#7fe0a0');
      // little burst at the door
      fxBurst(tgt.pos);
      newTask();
    }
  }

  /* ── NPC walk animation ── */
  npcs.forEach(n => {
    n.position.x += n.userData.speed * dt;
    if (n.position.x > BL/2-6) n.userData.speed = -Math.abs(n.userData.speed);
    if (n.position.x < -BL/2+6) n.userData.speed =  Math.abs(n.userData.speed);
    n.rotation.y = n.userData.speed > 0 ? Math.PI/2 : -Math.PI/2;
    const t = now*0.004 + n.userData.phase;
    const swing = Math.sin(t*2.2) * 0.36;
    let li = 0;
    n.traverse(c => {
      if (c.userData.isLeg) { c.rotation.x = li===0 ? swing : -swing; li++; }
      if (c.userData.isArm) { c.rotation.x = li===0 ? -swing*0.6 : swing*0.6; li++; }
    });
    n.position.y = CH + Math.abs(Math.sin(t*2.2))*0.03;
  });

  updateFX(dt);

  if (composer) composer.render(); else renderer.render(scene, camera);
}

/* ── tiny particle burst pool for deliveries ── */
const fxPool = [];
const fxGeo = new THREE.SphereGeometry(0.12, 6, 5);
function fxBurst(pos) {
  const cols = [0x7fe0a0, 0xffd060, 0xffffff, 0xff9a6a];
  for (let i = 0; i < 16; i++) {
    let p = fxPool.find(x => !x.mesh.visible);
    if (!p) { p = { mesh: new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({ transparent: true })) }; scene.add(p.mesh); fxPool.push(p); }
    p.mesh.visible = true; p.mesh.material.color.set(pick(cols)); p.mesh.material.opacity = 1;
    p.mesh.position.set(pos.x, 2.6, pos.z);
    const a = Math.random()*TAU, up = rand(2,5), sp = rand(2,5);
    p.vel = new THREE.Vector3(Math.cos(a)*sp, up, Math.sin(a)*sp); p.life = 1;
  }
}
function updateFX(dt) {
  fxPool.forEach(p => {
    if (!p.mesh.visible) return;
    p.life -= dt*1.4; if (p.life <= 0) { p.mesh.visible = false; return; }
    p.vel.y -= 9*dt; p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.material.opacity = p.life; p.mesh.scale.setScalar(0.5 + p.life*0.8);
  });
}

requestAnimationFrame(tick);
})();
</script>
</body>
